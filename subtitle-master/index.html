i tôi quay lại, có một ông già đang đứng đó, khó có thể phân biệt được ông là bà hay ông.\n돌아보면 할머 니인지 할아버지인지 분간하기 힘든 노인이 서 있다.\nWhen I turn around, there is an old man standing there who is hard to tell if he is a grandmother or a grandfather.","sourceUid":"nar-msq7aji5-7bi1xv","sourceNo":"N16","viRanges":[],"koRanges":[]},{"id":18,"readerNo":19,"displayNo":"N17","n":"N17","kind":"narration","type":"narration","vi":"Bà là một bà ngoại có mái tóc trắng và son đỏ.","ko":"빨간 립스틱을 바른 하얀 머리의 할머니다.","en":"She is a white-haired grandmother with red lipstick.","text":"Bà là một bà ngoại có mái tóc trắng và son đỏ.\n빨간 립스틱을 바른 하얀 머리의 할머니다.\nShe is a white-haired grandmother with red lipstick.","sourceUid":"nar-msq7aksd-c0jpq6","sourceNo":"N17","viRanges":[],"koRanges":[]},{"id":19,"readerNo":20,"displayNo":"N18","n":"N18","kind":"narration","type":"narration","vi":"Tôi đang cầm một chiếc giỏ đi chợ, trong đó có bánh mì baguette và hành lá.","ko":"시장바구니를 들고 있는데 바게트 빵과 대파가 같이 들어 있다.","en":"I'm holding a market basket, and it contains baguette bread and green onions.","text":"Tôi đang cầm một chiếc giỏ đi chợ, trong đó có bánh mì baguette và hành lá.\n시장바구니를 들고 있는데 바게트 빵과 대파가 같이 들어 있다.\nI'm holding a market basket, and it contains baguette bread and green onions.","sourceUid":"nar-msq7amqg-9x2azn","sourceNo":"N18","viRanges":[],"koRanges":[]},{"id":20,"readerNo":21,"displayNo":"N19","n":"N19","kind":"narration","type":"narration","vi":"Eunjae Yoo ngạc nhiên nhìn lên.","ko":"유은재는 놀라 쳐다보고.","en":"Eunjae Yoo looks up in surprise.","text":"Eunjae Yoo ngạc nhiên nhìn lên.\n유은재는 놀라 쳐다보고.\nEunjae Yoo looks up in surprise.","sourceUid":"nar-msq7ant6-tzs7xk","sourceNo":"N19","viRanges":[],"koRanges":[]},{"id":21,"readerNo":22,"displayNo":"N20","n":"N20","kind":"narration","type":"narration","vi":"Cô ấy trông giống như đang chơi ném tuyết khi chờ đợi phản ứng của Yoo Eun-jae.","ko":"그녀는 유은재의 반응을 기다리느라 눈싸움하는 모양새가 된다.","en":"She looks like she's having a snowball fight as she waits for Yoo Eun-jae's reaction.","text":"Cô ấy trông giống như đang chơi ném tuyết khi chờ đợi phản ứng của Yoo Eun-jae.\n그녀는 유은재의 반응을 기다리느라 눈싸움하는 모양새가 된다.\nShe looks like she's having a snowball fight as she waits for Yoo Eun-jae's reaction.","sourceUid":"nar-msq7ap3x-t7ld7j","sourceNo":"N20","viRanges":[],"koRanges":[]},{"id":22,"readerNo":23,"displayNo":3,"n":3,"kind":"sub","type":"merged","vi":"Hôm nay là ngày đầu tiên của tháng 3, tháng của sự háo hức đón chào học kỳ mới.\nCác bạn đã chuẩn bị đầy đủ cho ngày đầu của học kỳ chưa?\nThời khóa biểu,\nhộp bút dày cộm cùng tập vở chắc chắn.\nNgày nay chỉ cần máy tính xách tay là đủ nhỉ?","ko":"월의 첫날입니다\n새 학기 전날 모두들 필수품 챙기셨나요?\n강의시간표 빵빵한 필통 빳빳한 노트\n아... 요새는 노트북 하나만 챙기면 된다고요?","en":"It's the first day of March, the month of new beginnings.\nIs everyone ready for the first day of school?\nYour class schedule,\na pencil case, a brand new notebook.\nAll you need is a laptop these days, right?","text":"Hôm nay là ngày đầu tiên của tháng 3, tháng của sự háo hức đón chào học kỳ mới.\nCác bạn đã chuẩn bị đầy đủ cho ngày đầu của học kỳ chưa?\nThời khóa biểu,\nhộp bút dày cộm cùng tập vở chắc chắn.\nNgày nay chỉ cần máy tính xách tay là đủ nhỉ?\n월의 첫날입니다\n새 학기 전날 모두들 필수품 챙기셨나요?\n강의시간표 빵빵한 필통 빳빳한 노트\n아... 요새는 노트북 하나만 챙기면 된다고요?\nIt's the first day of March, the month of new beginnings.\nIs everyone ready for the first day of school?\nYour class schedule,\na pencil case, a brand new notebook.\nAll you need is a laptop these days, right?","sourceUid":"merged-mshaoj35-2635","sourceNo":5,"viRanges":[{"start":25.598294,"end":43.980013}],"koRanges":[{"start":58.521499,"end":86.551532}]},{"id":23,"readerNo":24,"displayNo":4,"n":4,"kind":"sub","type":"merged","vi":"Nhưng bạn cần chuẩn bị thêm một thứ quan trọng khác.\nChính là sự tự tin.\nCác bạn có thể sẽ căng thẳng khi bước vào học kỳ mới, kết bạn mới.\nBạn sợ mình lúng túng,\nsợ ai đó phát hiện ra mình lúng túng.","ko":"그렇다면, 가장 중요한 그것 그거 챙겨야죠\n바로 자신감\n새 학기 새 친구에게 적응하느라 스트레스 많이 받을 시기죠...\n어색하지는 않을까\n또 어색한 내 모습 들키지 않을까","en":"But you do need something really important.\nIt's confidence.\nThe new semester can be stressful.\nYou don't want to be awkward.\nYou don't want anyone to know your awkward first day.","text":"Nhưng bạn cần chuẩn bị thêm một thứ quan trọng khác.\nChính là sự tự tin.\nCác bạn có thể sẽ căng thẳng khi bước vào học kỳ mới, kết bạn mới.\nBạn sợ mình lúng túng,\nsợ ai đó phát hiện ra mình lúng túng.\n그렇다면, 가장 중요한 그것 그거 챙겨야죠\n바로 자신감\n새 학기 새 친구에게 적응하느라 스트레스 많이 받을 시기죠...\n어색하지는 않을까\n또 어색한 내 모습 들키지 않을까\nBut you do need something really important.\nIt's confidence.\nThe new semester can be stressful.\nYou don't want to be awkward.\nYou don't want anyone to know your awkward first day.","sourceUid":"merged-mshb0a05-2641","sourceNo":11,"viRanges":[{"start":43.980013,"end":57.713009}],"koRanges":[{"start":86.551532,"end":99.665013}]},{"id":24,"readerNo":25,"displayNo":5,"n":5,"kind":"sub","type":"merged","vi":"Tôi biết nhiều bạn đang đau đầu vì những điều này.\nNhưng càng những lúc thế này, bạn càng phải hiên ngang và tự tin.\nHãy mạnh dạn mở cánh cửa trước mặt.","ko":"노심초사 힘든 분들 많을 거예요\n하지만 이런 때일수록 당당하게 어깨 쫙 펴고\n내 앞에 놓인 새 문을 자신 있게 두드리자고요","en":"I know a lot of you are nervous about it.\nBut especially at a time like this, walk tall, and be confident.\nStart a new day with confidence.","text":"Tôi biết nhiều bạn đang đau đầu vì những điều này.\nNhưng càng những lúc thế này, bạn càng phải hiên ngang và tự tin.\nHãy mạnh dạn mở cánh cửa trước mặt.\n노심초사 힘든 분들 많을 거예요\n하지만 이런 때일수록 당당하게 어깨 쫙 펴고\n내 앞에 놓인 새 문을 자신 있게 두드리자고요\nI know a lot of you are nervous about it.\nBut especially at a time like this, walk tall, and be confident.\nStart a new day with confidence.","sourceUid":"merged-mshaq8a4-2638","sourceNo":14,"viRanges":[{"start":57.713009,"end":66.867476}],"koRanges":[{"start":99.665013,"end":108.555353}]},{"id":25,"readerNo":26,"displayNo":6,"n":6,"kind":"sub","type":"merged","vi":"XUẤT PHÁT ĐẾN PHƯỜNG YEONNAM","ko":"[신발 소리]","en":"","text":"XUẤT PH ":"‘Aaaahhh’ Tôi cố hét lên nhưng tôi bịt miệng lại.\n‘아아아악’ 비명을 지르려다가 스스로 입을 틀어 막는다.\n‘Aaaahhh’ I try to scream, but I cover my mouth.","sourceUid":"nar-msq7od0p-p7yk3r","sourceNo":"N64","viRanges":[],"koRanges":[]},{"id":73,"readerNo":74,"displayNo":"N65","n":"N65","kind":"narration","type":"narration","vi":"Go Doo-young mặc quần vừa đáng tiếc vừa buồn cười.","ko":"바지를 입던 고두영, 안됐기도 하고 웃기기도 하다.","en":"Go Doo-young wearing pants is both unfortunate and funny.","text":"Go Doo-young mặc quần vừa đáng tiếc vừa buồn cười.\n바지를 입던 고두영, 안됐기도 하고 웃기기도 하다.\nGo Doo-young wearing pants is both unfortunate and funny.","sourceUid":"nar-msq7odxh-5wiod1","sourceNo":"N65","viRanges":[],"koRanges":[]},{"id":74,"readerNo":75,"displayNo":"N66","n":"N66","kind":"narration","type":"narration","vi":"Jeong Ye-eun đang đánh Go Doo-young bằng cách nói 'Mr. Lee' và điện thoại di động của cô đổ chuông.","ko":"정예은, ‘이씨’ 하며 고두영을 때리는데 핸드폰이 울린다.","en":"Jeong Ye-eun is hitting Go Doo-young by saying ‘Mr. Lee’ and her cell phone rings.","text":"Jeong Ye-eun đang đánh Go Doo-young bằng cách nói 'Mr. Lee' và điện thoại di động của cô đổ chuông.\n정예은, ‘이씨’ 하며 고두영을 때리는데 핸드폰이 울린다.\nJeong Ye-eun is hitting Go Doo-young by saying ‘Mr. Lee’ and her cell phone rings.","sourceUid":"nar-msq7ohu5-w4uzry","sourceNo":"N66","viRanges":[],"koRanges":[]},{"id":75,"readerNo":76,"displayNo":"N67","n":"N67","kind":"narration","type":"narration","vi":"Ko Doo-young nhìn ai đó. Người gửi là ‘Sae Hame.’","ko":"고두영이 누군가 싶어 쳐다본다. 발신자는 ‘새 하메’다.","en":"Ko Doo-young looks at someone. The sender is ‘Sae Hame.’","text":"Ko Doo-young nhìn ai đó. Người gửi là ‘Sae Hame.’\n고두영이 누군가 싶어 쳐다본다. 발신자는 ‘새 하메’다.\nKo Doo-young looks at someone. The sender is ‘Sae Hame.’","sourceUid":"nar-msq7oj88-x0lygo","sourceNo":"N67","viRanges":[],"koRanges":[]},{"id":76,"readerNo":77,"displayNo":10,"n":10,"kind":"sub","type":"merged","vi":"Ai đấy? Sao đến sớm dữ vậy?\nKhông có ai sao? Vâng ạ.","ko":"누구야? 응? \"새 하메\"\n아이, 얘 뭐야? 왜 이렇게 일찍 왔어? 아이!\n(집주인) 왜? 아무도 없어?\n(유은재) 네\n(집주인) 이상하네...","en":"Who is it? Why is she so early?\nNo one's there? I don't think so.","text":"Ai đấy? Sao đến sớm dữ vậy?\nKhông có ai sao? Vâng ạ.\n누구야? 응? \"새 하메\"\n아이, 얘 뭐야? 왜 이렇게 일찍 왔어? 아이!\n(집주인) 왜? 아무도 없어?\n(유은재) 네\n(집주인) 이상하네...\nWho is it? Why is she so early?\nNo one's there? I don't think so.","sourceUid":"merged-mshpakl6-4","sourceNo":27,"viRanges":[{"start":158.746068,"end":210.006771}],"koRanges":[{"start":201.367526,"end":257.310952}]},{"id":77,"readerNo":78,"displayNo":11,"n":11,"kind":"sub","type":"merged","vi":"[Rung điện thoại di động]\n[Nhạc nền vui vẻ bắt đầu]\n[Nhấn mật khẩu]","ko":"[핸드폰 진동]\n[즐거운 배경 음악 시작]\n[비밀번호를 누른다]","en":"[Cellphone vibration]\n[Happy background music starts]\n[Press password]","text":"[Rung điện thoại di động]\n[Nhạc nền vui vẻ bắt đầu]\n[Nhấn mật khẩu]\n[핸드폰 진동]\n[즐거운 배경 음악 시작]\n[비밀번호를 누른다]\n[Cellphone vibration]\n[Happy background music starts]\n[Press password]","sourceUid":"merged-mshpbmi2-6","sourceNo":48,"viRanges":[],"koRanges":[]},{"id":78,"readerNo":79,"displayNo":"N68","n":"N68","kind":"narration","type":"narration","vi":". Trước cổng vào (ban ngày)","ko":". 현관 앞(낮)","en":". In front of the entrance (daytime)","text":". Trước cổng vào (ban ngày)\n. 현관 앞(낮)\n. In front of the entrance (daytime)","sourceUid":"nar-msq7oz1w-s39wud","sourceNo":"N68","viRanges":[],"koRanges":[]},{"id":79,"readerNo":80,"displayNo":"N69","n":"N69","kind":"narration","type":"narration","vi":"Không có cuộc gọi điện thoại và không có câu trả lời cho chuông cửa. Yoo Eun-jae cũng xấu hổ.","ko":"전화도 안 받고 초인종에 응답도 없다. 유은재도 난감하다.","en":"No phone calls and no answer to the doorbell. Yoo Eun-jae is also embarrassed.","text":"Không có cuộc gọi điện thoại và không có câu trả lời cho chuông cửa. Yoo Eun-jae cũng xấu hổ.\n전화도 안 받고 초인종에 응답도 없다. 유은재도 난감하다.\nNo phone calls and no answer to the doorbell. Yoo Eun-jae is also embarrassed.","sourceUid":"nar-msq7p3e2-9xqk9j","sourceNo":"N69","viRanges":[],"koRanges":[]},{"id":80,"reader eft, so I'm fine, so let's look around the house.","text":"Mọi người khác đã rời đi, nên tôi vẫn ổn, nên hãy nhìn quanh nhà.\n다른 사람들은 다 나갔구, 난 괜찮으니까 집 구경해.\nEveryone else has left, so I'm fine, so let's look around the house.","sourceUid":"nar-msq8w5yj-6zk6qi","sourceNo":"N103","viRanges":[],"koRanges":[]},{"id":118,"readerNo":119,"displayNo":"N104","n":"N104","kind":"narration","type":"narration","vi":"Nhìn vào căn phòng đầu tiên, căn phòng. Căn phòng đằng kia...","ko":"방부터 봐, 방. 저기 저쪽 방···.","en":"Look at the room first, the room. That room over there...","text":"Nhìn vào căn phòng đầu tiên, căn phòng. Căn phòng đằng kia...\n방부터 봐, 방. 저기 저쪽 방···.\nLook at the room first, the room. That room over there...","sourceUid":"nar-msq8w7nw-j61gai","sourceNo":"N104","viRanges":[],"koRanges":[]},{"id":119,"readerNo":120,"displayNo":"N105","n":"N105","kind":"narration","type":"narration","vi":"(Yoo Eun-jae tiếp tục nhìn chằm chằm, tuyệt vọng) Tôi ổn.","ko":"(유은재가 계속 쳐다보자 절박하다) 난 괜찮다니까.","en":"(Yoo Eun-jae continues to stare, desperate) I’m fine.","text":"(Yoo Eun-jae tiếp tục nhìn chằm chằm, tuyệt vọng) Tôi ổn.\n(유은재가 계속 쳐다보자 절박하다) 난 괜찮다니까.\n(Yoo Eun-jae continues to stare, desperate) I’m fine.","sourceUid":"nar-msq8w96u-uqsbyh","sourceNo":"N105","viRanges":[],"koRanges":[]},{"id":120,"readerNo":121,"displayNo":"N106","n":"N106","kind":"narration","type":"dialogue","vi":"Jeong Ye-eun: (Trong khi đó, anh ấy nhặt giày và ném vào phòng)","ko":"정예은: (그사이 신발을 집어 방 안으로 던진다)","en":"Jeong Ye-eun: (Meanwhile, he picks up his shoes and throws them into the room)","text":"Jeong Ye-eun: (Trong khi đó, anh ấy nhặt giày và ném vào phòng)\n정예은: (그사이 신발을 집어 방 안으로 던진다)\nJeong Ye-eun: (Meanwhile, he picks up his shoes and throws them into the room)","sourceUid":"nar-msq8xork-fac05x","sourceNo":"N106","viRanges":[],"koRanges":[]},{"id":121,"readerNo":122,"displayNo":"N107","n":"N107","kind":"narration","type":"narration","vi":"•Chèn – Phòng của Jeong Ye-eun 〉〉","ko":"•인서트 - 정예은의 방 〉〉","en":"•In ạy vào. Đã muộn rồi.","ko":"학년쯤의 여자애가 뛰어 들어온다. 늦었다.","en":"A girl of about first grade runs in. It's late.","text":"Một cô bé khoảng lớp một chạy vào. Đã muộn rồi.\n학년쯤의 여자애가 뛰어 들어온다. 늦었다.\nA girl of about first grade runs in. It's late.","sourceUid":"nar-msq9406e-p7cah9","sourceNo":"N160","viRanges":[],"koRanges":[]},{"id":189,"readerNo":190,"displayNo":"N161","n":"N161","kind":"narration","type":"narration","vi":"Đối với một đứa trẻ đến muộn, hành lang rất dài.","ko":"늦은 아이에게 복도는 굉장히 길다.","en":"For a late child, the hallway is very long.","text":"Đối với một đứa trẻ đến muộn, hành lang rất dài.\n늦은 아이에게 복도는 굉장히 길다.\nFor a late child, the hallway is very long.","sourceUid":"nar-msq9417b-juw0nz","sourceNo":"N161","viRanges":[],"koRanges":[]},{"id":190,"readerNo":191,"displayNo":"N162","n":"N162","kind":"narration","type":"narration","vi":"Tôi đi lên đi xuống hành lang dài để tìm lớp học của mình.","ko":"긴 복도를 왔다 갔다 하며 자기 반을 찾는다.","en":"I walk up and down the long hallway to find my class.","text":"Tôi đi lên đi xuống hành lang dài để tìm lớp học của mình.\n긴 복도를 왔다 갔다 하며 자기 반을 찾는다.\nI walk up and down the long hallway to find my class.","sourceUid":"nar-msq94293-68jmr9","sourceNo":"N162","viRanges":[],"koRanges":[]},{"id":191,"readerNo":192,"displayNo":"N163","n":"N163","kind":"narration","type":"narration","vi":"Những đứa trẻ khác gặp khó khăn trong việc tìm lớp học của mình, chỉ có cô gái đang đi lại trên hành lang.","ko":"다른 아이들은 잘도 자기 반을 찾는데 여자애 만이 복도를 왔다 갔다 한다.","en":"The other children had a hard time finding their classes, but only the girl was walking up and down the hallway.","text":"Những đứa trẻ khác gặp khó khăn trong việc tìm lớp học của mình, chỉ có cô gái đang đi lại trên hành lang.\n다른 아이들은 잘도 자기 반을 찾는데 여자애 만이 복도를 왔다 갔다 한다.\nThe other children had a hard time finding their classes, but only the girl was walking up and down the hallway.","sourceUid":"nar-msq949iw-5f8kd6","sourceNo":"N163","viRanges":[],"koRanges":[]},{"id":192,"readerNo":193,"displayN e không thể ngủ được trong thời gian dài.\n유은재는 한참 동안 잠을 이루지 못한다.\nYu Eun-jae cannot sleep for a long time.","sourceUid":"nar-msq94j9x-8ax1f1","sourceNo":"N168","viRanges":[],"koRanges":[]},{"id":197,"readerNo":198,"displayNo":"N169","n":"N169","kind":"narration","type":"narration","vi":". Vườn trên mái Belle Epoque (sáng)","ko":". 벨 에포크 옥상 정원(아침)","en":". Belle Epoque Rooftop Garden (morning)","text":". Vườn trên mái Belle Epoque (sáng)\n. 벨 에포크 옥상 정원(아침)\n. Belle Epoque Rooftop Garden (morning)","sourceUid":"nar-msq94khz-v2k9bo","sourceNo":"N169","viRanges":[],"koRanges":[]},{"id":198,"readerNo":199,"displayNo":"N170","n":"N170","kind":"narration","type":"narration","vi":"Mặt trời mọc.","ko":"해가 뜬다.","en":"The sun rises.","text":"Mặt trời mọc.\n해가 뜬다.\nThe sun rises.","sourceUid":"nar-msq94la9-bqmmbq","sourceNo":"N170","viRanges":[],"koRanges":[]},{"id":199,"readerNo":200,"displayNo":"N171","n":"N171","kind":"narration","type":"narration","vi":"Bà chủ quán son môi đỏ tươi uống cà phê buổi sáng và gieo hạt trên mảnh vườn trên sân thượng.","ko":"새빨간 립스틱의 주인집 할머니가 모닝 커피를 마시며 옥상 정원에 씨를 뿌린다.","en":"The owner's grandmother with bright red lipstick drinks morning coffee and sow seeds in the rooftop garden.","text":"Bà chủ quán son môi đỏ tươi uống cà phê buổi sáng và gieo hạt trên mảnh vườn trên sân thượng.\n새빨간 립스틱의 주인집 할머니가 모닝 커피를 마시며 옥상 정원에 씨를 뿌린다.\nThe owner's grandmother with bright red lipstick drinks morning coffee and sow seeds in the rooftop garden.","sourceUid":"nar-msq94m7a-e36j4b","sourceNo":"N171","viRanges":[],"koRanges":[]},{"id":200,"readerNo":201,"displayNo":"N172","n":"N172","kind":"narration","type":"narration","vi":"Vết son đỏ còn sót lại trên cốc cà phê.","ko":"커피 잔에 빨간 립스틱이 그대로 묻어난다.","en":"Red lipstick remains on the coffee cup.","text":"Vết son đỏ còn sót lại trên cốc cà phê.\n커피 잔에 빨간 립스틱이 그대로 묻어난다.\nRed lipstick remains on the coffee cup.","sourceUid":"nar-msq94nev-0debof","sourceNo":"N172","viRanges":[],"koRanges":[]},{"id":201,"readerNo":202," some? Thank you.\nThe jam is really good.\nWhere did you get it?\nI didn't buy it. My mom made it.\nIt's really good. -Have some. -Thank you.","text":"Em dậy sớm nhỉ. Chị ngủ ngon giấc không ạ?\nKhông cần khách sáo thế đâu. Biến chị thành bà già đó.\nCứ nói ngang hàng đi. Vâng. Sau này em sẽ… Sau này á?\nEm ỷ mình trẻ hơn chị hai tuổi hả? Chị ăn không ạ? Cảm ơn.\nMứt này ngon thật.\nEm mua ở đâu vậy? Không phải mua đâu. Mẹ em làm cho.\nNgon thật sự. Chị ăn thêm đi. Cảm ơn nhé.\n아 일찍 일어났네. 안녕히 주무셨어요\n야아... 무슨 극존칭을 쓰고 그래? 할머니 같잖아.\n그냥 반말해. 예, 나중에...나중에?\n너 지금 두 살 어리다고 유세 떠는 거야? 아니... 아...\n드실래요? 어, 고마워. 음! 더 드세요\n이 잼 진짜 맛있다.어디 거야? 산 거 아니에요. 엄마가 만든 거예요\n음... 되게 맛있네. 고마워\nYou're up early. Good morning, ma'am.\nNo need to be that formal. That makes me sound so old.\nNo need to be so formal. Okay. Maybe... Maybe?\nAre you trying to say you're that much younger?\nWould you like some? Thank you.\nThe jam is really good.\nWhere did you get it?\nI didn't buy it. My mom made it.\nIt's really good. -Have some. -Thank you.","sourceUid":"merged-msjsm497-14","sourceNo":95,"viRanges":[{"start":725.094479,"end":785.252685}],"koRanges":[{"start":705.439,"end":761.80544}]},{"id":213,"readerNo":214,"displayNo":"N183","n":"N183","kind":"narration","type":"narration","vi":"Ngay sau đó, bánh mì bật ra khỏi lò nướng bánh.","ko":"마침 토스터에서 식빵이 튀어오른다.","en":"Just then, bread pops out of the toaster.","text":"Ngay sau đó, bánh mì bật ra khỏi lò nướng bánh.\n마침 토스터에서 식빵이 튀어오른다.\nJust then, bread pops out of the toaster.","sourceUid":"nar-msq95lyb-y554gp","sourceNo":"N183","viRanges":[],"koRanges":[]},{"id":214,"readerNo":215,"displayNo":"N184","n":"N184","kind":"narration","type":"narration","vi":"Trong khi phết mứt táo, anh nhận ra Jeong Ye-eun đang nhìn mình. Bạn có muốn một ít không?","ko":"사과잼을 바르다가 물끄러미 자기를 보고 있는 정예은을 의식한다) 드실래요?","en":"While spreading the apple jam, he becomes aware of Jeong Ye-eun looking at him. Would you like some?","text":"Trong khi phết mứt táo, anh nhận ra Jeong Ye-eun đang nhìn mình. Bạn có muốn một ít không?\n사과잼을 바르다가 물끄러미 자기를 보고 있는 정예은을 의식한다) 드실래요?\nWhile spreading the apple jam, he becomes aware of Jeong Ye-eun looking at him. Would you like some?","sourceUid":"nar-msq95o6u-zocflu","sourceNo":"N184","viRanges":[],"koRanges":[]},{"id":215,"readerNo":216,"displayNo":"N185","n":"N185","kind":"narration","type":"dialogue","vi":"Jeong Ye-eun: (Chấp nhận như thể cô ấy đã chờ đợi) Cảm ơn bạn.","ko":"정예은: (기다렸다는 듯이 받는다) 고마워.","en":"Jeong Ye-eun: (Accepts as if she had been waiting) Thank you.","text":"Jeong Ye-eun: (Chấp nhận như thể cô ấy đã chờ đợi) Cảm ơn bạn.\n정예은: (기다렸다는 듯이 받는다) 고마워.\nJeong Ye-eun: (Accepts as if she had been waiting) Thank you.","sourceUid":"nar-msq966cg-dkrzx5","sourceNo":"N185","viRanges":[],"koRanges":[]},{"id":216,"readerNo":217,"displayNo":"N186","n":"N186","kind":"narration","type":"dialogue","vi":"Eunjae Yoo: (Tôi nghĩ hơi khó chịu nhưng anh ấy lại phết mứt lên bánh mì)...","ko":"유은재: (좀 얄밉단 생각이 들지만 다시 빵에 잼을 바른다)···.","en":"Eunjae Yoo: (I think it's a bit obnoxious, but he spreads jam on the bread again)...","text":"Eunjae Yoo: (Tôi nghĩ hơi khó chịu nhưng anh ấy lại phết mứt lên bánh mì)...\n유은재: (좀 얄밉단 생각이 들지만 다시 빵에 잼을 바른다)···.\nEunjae Yoo: (I think it's a bit obnoxious, but he spreads jam on the bread again)...","sourceUid":"nar-msq9674j-bavdc2","sourceNo":"N186","viRanges":[],"koRanges":[]},{"id":217,"readerNo":218,"displayNo":"N187","n":"N187","kind":"narration","type":"narration","vi":"Eunjae Yoo nhìn Yeeun Jeong đang ăn rất nhiều mứt táo.","ko":"유은재가 사과잼을 듬뿍 더는 정예은을 바라본다.","en":"Eunjae Yoo looks at Yeeun Jeong, who is eating a lot of apple jam.","text":"Eunjae Yoo nhìn Yeeun Jeong đang ăn rất nhiều mứt táo.\n유은재가 사과잼을 듬뿍 더는 정예은을 바라본다.\nEunjae Yoo looks at Yeeun Jeong, who is eating a lot of apple jam.","sourceUid":"nar-msq96eqq-3vi8nq","sourceNo":"N187","viRanges":[],"koRanges":[]},{"id":218,"readerNo":219,"displayNo":"N188","n":"N188","kind":"narration","type":"narration","vi":"Kang Ina bước jae Yoo: No...","text":"Eunjae Yoo: Không...\n유은재: 아뇨···.\nEunjae Yoo: No...","sourceUid":"nar-msq97f8p-xw4bz2","sourceNo":"N195","viRanges":[],"koRanges":[]},{"id":226,"readerNo":227,"displayNo":"N196","n":"N196","kind":"narration","type":"dialogue","vi":"Kang Ina: Ugh, trời lạnh quá. (Tăng nhiệt độ nồi hơi)","ko":"강이나: 으으, 추워. (보일러 온도를 높인다)","en":"Kang Ina: Ugh, it’s cold. (Raise the boiler temperature)","text":"Kang Ina: Ugh, trời lạnh quá. (Tăng nhiệt độ nồi hơi)\n강이나: 으으, 추워. (보일러 온도를 높인다)\nKang Ina: Ugh, it’s cold. (Raise the boiler temperature)","sourceUid":"nar-msq97gj6-xi8cwi","sourceNo":"N196","viRanges":[],"koRanges":[]},{"id":227,"readerNo":228,"displayNo":32,"n":32,"kind":"sub","type":"merged","vi":"- Xin chào. - Em chào chị.\nChị dọa chết con bé đấy. Mặc đồ vào đi.\nSao nào? Chỉ có mấy đứa mình thôi mà.\nChị nói rồi mà. Chị ấy thích khoe thân. Sao thế? Không có gì ạ.","ko":"(강이나) 안녕\n안녕하세...\n(정예은) 아이... 애 놀라잖아 옷 좀 입어\n내가 뭐? 남 안 달린 거 달린 것도 아닌데\n내가 얘기했지? 노출 중증이라고...\n아이...왜? - 아뇨...","en":"-Hi. -Hello.\nYou're scaring her. Wear something.\nWhat? It's just us girls.\nI told you she's an exhibitionist. What? Nothing.","text":"- Xin chào. - Em chào chị.\nChị dọa chết con bé đấy. Mặc đồ vào đi.\nSao nào? Chỉ có mấy đứa mình thôi mà.\nChị nói rồi mà. Chị ấy thích khoe thân. Sao thế? Không có gì ạ.\n(강이나) 안녕\n안녕하세...\n(정예은) 아이... 애 놀라잖아 옷 좀 입어\n내가 뭐? 남 안 달린 거 달린 것도 아닌데\n내가 얘기했지? 노출 중증이라고...\n아이...왜? - 아뇨...\n-Hi. -Hello.\nYou're scaring her. Wear something.\nWhat? It's just us girls.\nI told you she's an exhibitionist. What? Nothing.","sourceUid":"merged-msjt702g-16","sourceNo":180,"viRanges":[{"start":785.252685,"end":807}],"koRanges":[{"start":761.80544,"end":790}]},{"id":228,"readerNo":229,"displayNo":33,"n":33,"kind":"sub","type":"merged","vi":"Về tiền bối Yoon ấy ạ.\nEm chào chị ấy chưa? Vẫn chưa.\nChị ấy học Quản trị Kinh doanh ạ?\nVậy còn người đó là ai ạ?","ko":"윤 선배요?\n응... 인사했어? 아니요, 아직...\n그분 경영학과라고 했죠?\n그럼 그분은 누구예요?","en":"You mentioned Jin-Myung.\nDid you say hi? No, not yet.\nYou said she is a business major.\nThen who's the other one?","text":"Về tiền bối Yoon ấy ạ.\nEm chào chị ấy chưa? Vẫn chưa.\nChị ấy học Quản trị Kinh doanh ạ?\nVậy còn người đó là ai ạ?\n윤 선배요?\n응... 인사했어? 아니요, 아직...\n그분 경영학과라고 했죠?\n그럼 그분은 누구예요?\nYou mentioned Jin-Myung.\nDid you say hi? No, not yet.\nYou said she is a business major.\nThen who's the other one?","sourceUid":"merged-msjtb3yk-22","sourceNo":106,"viRanges":[{"start":836.937754,"end":853.627096}],"koRanges":[{"start":820.486,"end":833.695413}]},{"id":229,"readerNo":230,"displayNo":34,"n":34,"kind":"sub","type":"merged","vi":"[Tiếng uống cà phê]\n(TV News) Phà Sewol nằm trên một tàu chở khách...\n(TV News) Thủ phạm của vụ án giết người cắt xác đã bị bắt ngày hôm qua.\nBằng cách kết nối Sở cảnh sát Ansan...","ko":"[커피 마시는 소리]\n(TV 뉴스) 세월호는 여객선에...\n(TV 뉴스) 시신 훼손 살인사건 범인이 어제 붙잡혔습니다\n안산 경찰서를 연결해서...","en":"[Sound of drinking coffee]\n(TV News) The Sewol Ferry was on a passenger ship...\n(TV News) The culprit of the body mutilation murder case was caught yesterday.\nBy connecting Ansan Police Station...","text":"[Tiếng uống cà phê]\n(TV News) Phà Sewol nằm trên một tàu chở khách...\n(TV News) Thủ phạm của vụ án giết người cắt xác đã bị bắt ngày hôm qua.\nBằng cách kết nối Sở cảnh sát Ansan...\n[커피 마시는 소리]\n(TV 뉴스) 세월호는 여객선에...\n(TV 뉴스) 시신 훼손 살인사건 범인이 어제 붙잡혔습니다\n안산 경찰서를 연결해서...\n[Sound of drinking coffee]\n(TV News) The Sewol Ferry was on a passenger ship...\n(TV News) The culprit of the body mutilation murder case was caught yesterday.\nBy connecting Ansan Police Station...","sourceUid":"merged-msjt8a3v-18","sourceNo":182,"viRanges":[],"koRanges":[]},{"id":230,"readerNo":231,"displayNo":"N197","n":"N197","kind":"narration","type":"narration","vi":"Vì lý do nào đó, có vẻ như Kang Eana và Jeong Ye-eun đang bế tắc.","ko":"왠지 강이나와 정예은이 멈칫하는 것 같다.","en":"For some reason, it seems like Kang Eana and Jeong Ye-eun are at a standstill.","text":"Vì lý do nào đó, có vẻ như Kang Eana và nd]\n[Theme music ends]","text":"[Nhạc hồi hộp bắt đầu] [Tiếng đóng cửa]\n[Nhạc chủ đề bắt đầu] [Âm thanh cắt giấy]\n[Tiếng băng được gỡ bỏ] [Tiếng chuông điện thoại]\n[Nhạc chủ đề kết thúc]\n[서스펜스 음악 시작][문 닫는 소리]\n[테마 음악 시작][종이 자르는 소리]\n[테이프 떼는 소리][전화벨 소리]\n[테마 음악 끝]\n[Suspense music starts] [Door closing sound]\n[Theme music starts] [Sound of paper cutting]\n[Sound of tape being removed] [Telephone ringing sound]\n[Theme music ends]","sourceUid":"merged-msjthswq-34","sourceNo":200,"viRanges":[],"koRanges":[]},{"id":234,"readerNo":235,"displayNo":37,"n":37,"kind":"sub","type":"merged","vi":"Em nên làm gì với tấm ảnh đó? Còn làm gì nữa?\nCứ vứt đi. Chị phải đi rồi.\nLàm gì đấy?","ko":"그럼 사진 어떡하죠? 뭘 어떡해?\n그냥 버려. 나 근데 뭐 할 일 있었는데... (윤진명) 아, 쫌...","en":"What should I do with the picture? It doesn't matter.\nYou can throw it away.\nI should go now. What is it?","text":"Em nên làm gì với tấm ảnh đó? Còn làm gì nữa?\nCứ vứt đi. Chị phải đi rồi.\nLàm gì đấy?\n그럼 사진 어떡하죠? 뭘 어떡해?\n그냥 버려. 나 근데 뭐 할 일 있었는데... (윤진명) 아, 쫌...\nWhat should I do with the picture? It doesn't matter.\nYou can throw it away.\nI should go now. What is it?","sourceUid":"merged-msjth8sg-32","sourceNo":205,"viRanges":[{"start":869.31446,"end":880.621641}],"koRanges":[{"start":848.709,"end":858.83844}]},{"id":235,"readerNo":236,"displayNo":"N199","n":"N199","kind":"narration","type":"narration","vi":"(Tôi cảm thấy như mình đang trốn tránh nó vì lý do nào đó) Tôi cần phải tắm rửa. (đi vào phòng tắm)","ko":"(왠지 피하는 느낌이다) 씻어야겠다. (욕실로 들어간다)","en":"(I feel like I'm avoiding it for some reason) I need to wash up. (goes into bathroom)","text":"(Tôi cảm thấy như mình đang trốn tránh nó vì lý do nào đó) Tôi cần phải tắm rửa. (đi vào phòng tắm)\n(왠지 피하는 느낌이다) 씻어야겠다. (욕실로 들어간다)\n(I feel like I'm avoiding it for some reason) I need to wash up. (goes into bathroom)","sourceUid":"nar-msq990hv-axo3yr","sourceNo":"N199","viRanges":[],"koRanges":[]},{"id":236,"readerNo":237,"displayNo":"N200","n":"N200","kind":"narration"," .","en":"Yu Eun-jae sits down and looks carefully out the window.","text":"Yu Eun-jae ngồi xuống và cẩn thận nhìn ra ngoài cửa sổ.\n자리에 앉은 유은재가 창밖을 유심히 본다.\nYu Eun-jae sits down and looks carefully out the window.","sourceUid":"nar-msq9cu2o-w4q55r","sourceNo":"N233","viRanges":[],"koRanges":[]},{"id":274,"readerNo":275,"displayNo":"N234","n":"N234","kind":"narration","type":"narration","vi":"Tôi hồi hộp nên không bỏ lỡ nơi cần xuống.","ko":"내려야 할 곳을 놓치지 않으려고 긴장해 있다.","en":"I'm nervous so I don't miss the place I need to get off.","text":"Tôi hồi hộp nên không bỏ lỡ nơi cần xuống.\n내려야 할 곳을 놓치지 않으려고 긴장해 있다.\nI'm nervous so I don't miss the place I need to get off.","sourceUid":"nar-msq9cv2e-e5mgjk","sourceNo":"N234","viRanges":[],"koRanges":[]},{"id":275,"readerNo":276,"displayNo":"N235","n":"N235","kind":"narration","type":"narration","vi":"Tôi chăm chú lắng nghe mỗi khi có thông báo trên xe buýt.","ko":"버스에서 방송이 나올 때마다 귀를 기울인다.","en":"I listen carefully every time an announcement is made on the bus.","text":"Tôi chăm chú lắng nghe mỗi khi có thông báo trên xe buýt.\n버스에서 방송이 나올 때마다 귀를 기울인다.\nI listen carefully every time an announcement is made on the bus.","sourceUid":"nar-msq9cvx3-lmk38f","sourceNo":"N235","viRanges":[],"koRanges":[]},{"id":276,"readerNo":277,"displayNo":"N236","n":"N236","kind":"narration","type":"narration","vi":"Có thứ gì đó đập vào đầu Yoo Eun-jae.","ko":"뭔가가 유은재의 머리를 툭 친다.","en":"Something hits Yoo Eun-jae on the head.","text":"Có thứ gì đó đập vào đầu Yoo Eun-jae.\n뭔가가 유은재의 머리를 툭 친다.\nSomething hits Yoo Eun-jae on the head.","sourceUid":"nar-msq9cxql-xhue7n","sourceNo":"N236","viRanges":[],"koRanges":[]},{"id":277,"readerNo":278,"displayNo":"N237","n":"N237","kind":"narration","type":"narration","vi":"Đây là chiếc ba lô được nam sinh viên đeo.","ko":"남학생이 멘 배낭이다.","en":"This is a backpack worn by a male student.","text":"Đây là chiếc ba lô được nam sinh viên đeo.\n남학생이 멘 배낭이다.\nThis is a backpack worn by a male student.","sourceUid":"nar-msq9d21c-ascglc","sourceNo":"N237","viRanges":[],"koRanges":[]},{"id":278,"readerNo":279,"displayNo":"N238","n":"N238","kind":"narration","type":"narration","vi":"Yoo Eun-jae xoa đầu và nhìn cậu bé, nhưng anh thậm chí còn không biết mình đã đánh cô vì đang nói chuyện với bạn mình.","ko":"유은재가 머리를 문지르며 남학생을 쳐다보지만 정작 그는 친구와 이야기하느라 유은재를 친 줄도 모른다.","en":"Yoo Eun-jae rubs her head and looks at the boy, but he doesn't even know he hit her because he's talking to his friend.","text":"Yoo Eun-jae xoa đầu và nhìn cậu bé, nhưng anh thậm chí còn không biết mình đã đánh cô vì đang nói chuyện với bạn mình.\n유은재가 머리를 문지르며 남학생을 쳐다보지만 정작 그는 친구와 이야기하느라 유은재를 친 줄도 모른다.\nYoo Eun-jae rubs her head and looks at the boy, but he doesn't even know he hit her because he's talking to his friend.","sourceUid":"nar-msq9dcno-s4nt5o","sourceNo":"N238","viRanges":[],"koRanges":[]},{"id":279,"readerNo":280,"displayNo":"N239","n":"N239","kind":"narration","type":"narration","vi":"Trong khi tôi đang lo lắng về việc đầu mình sẽ bị va đập thì tôi đã muộn màng nhìn thấy Jeong Ye-eun bước xuống.","ko":"얻어맞은 머리에 신경 쓰다가, 정예은이 내리는 걸 뒤늦게 본다.","en":"While I was worrying about my head getting hit, I belatedly saw Jeong Ye-eun getting off.","text":"Trong khi tôi đang lo lắng về việc đầu mình sẽ bị va đập thì tôi đã muộn màng nhìn thấy Jeong Ye-eun bước xuống.\n얻어맞은 머리에 신경 쓰다가, 정예은이 내리는 걸 뒤늦게 본다.\nWhile I was worrying about my head getting hit, I belatedly saw Jeong Ye-eun getting off.","sourceUid":"nar-msq9ddvq-pyf79i","sourceNo":"N239","viRanges":[],"koRanges":[]},{"id":280,"readerNo":281,"displayNo":"N240","n":"N240","kind":"narration","type":"narration","vi":"Khi xe chuẩn bị đóng cửa, Eunjae Yoo lao ra ngoài và bị kẹt ở cửa xe buýt.","ko":"차가 막 문을 닫으려는 순간, 유은재가 서둘러 내리다가 버스 문에 끼인다.","en":"Just as the car is about to close, Eunjae Yoo rushes out and gets stuck in the bus door.","text":"Khi xe chuẩn bị đóng cửa, Eunjae Yoo lao ra ngoài và bị kẹt ở cửa xe buýt.\n차가 막 문을 닫으려는 순간, 유은재가 서둘러 내리다가 버스 문에 끼인다.\nJust as t nswers.\nThank you.\nOr say something entirely unrelated.\nBut when you study psychology...\nHey, could you buy me lunch?\nI'd like some pasta.","text":"Cho tôi mượn bút bi với.\nĐúng không nào?\nĐa phần sinh viên im lặng không trả lời,\nhoặc trả lời không đúng trọng tâm câu hỏi.\nTuy nhiên, nếu các em học tâm lý học…\nTiền bối.\nAnh mời bọn em ăn trưa đi.\nEm muốn ăn carbonara.\n볼펜 좀...\n(교수님) 그렇죠?\n필자의 질문에 학생들은 대게 묵묵부답으로 반응하거나...\n고마워...\n(교수님) 질문의 본질과는 거리가 먼 대답을 하지만\n간혹 심리학을 공부하면\n(학생들) 수고하셨습니다\n(여학생 1) 선배, 밥 사주세요\n저는 까르보나라\nCan I borrow a pen?\nRight?\nStudents usually don't have any answers.\nThank you.\nOr say something entirely unrelated.\nBut when you study psychology...\nHey, could you buy me lunch?\nI'd like some pasta.","sourceUid":"merged-mskiwlwj-64","sourceNo":177,"viRanges":[{"start":1126.465259,"end":1148.368134}],"koRanges":[{"start":1107.827523,"end":1121.780197}]},{"id":302,"readerNo":303,"displayNo":"N253","n":"N253","kind":"narration","type":"narration","vi":"Mọi người rời đi theo nhóm hai và ba.","ko":"모두들 삼삼오오 무리를 지어 빠져나간다.","en":"Everyone leaves in groups of twos and threes.","text":"Mọi người rời đi theo nhóm hai và ba.\n모두들 삼삼오오 무리를 지어 빠져나간다.\nEveryone leaves in groups of twos and threes.","sourceUid":"nar-msq9hd7w-btgcqz","sourceNo":"N253","viRanges":[],"koRanges":[]},{"id":303,"readerNo":304,"displayNo":"N254","n":"N254","kind":"narration","type":"narration","vi":"‘Tôi nên ăn gì?’ ‘Bạn có định đến căng tin không?’","ko":"‘뭐 먹을까?’ ‘구내식당 갈 거야?’","en":"‘What should I eat?’ ‘Are you going to the cafeteria?’","text":"‘Tôi nên ăn gì?’ ‘Bạn có định đến căng tin không?’\n‘뭐 먹을까?’ ‘구내식당 갈 거야?’\n‘What should I eat?’ ‘Are you going to the cafeteria?’","sourceUid":"nar-msq9hee4-7i1oor","sourceNo":"N254","viRanges":[],"koRanges":[]},{"id":304,"readerNo":305,"displayNo":"N255","n":"N255","kind":"narration","type":"narration","vi":"‘Tôi muốn ăn ramen’ Yoo Eun-jae ghen tị với họ.","ko":"‘라면 먹고 싶어’ 유은재는 그들이 부럽다.","en":"‘I want to eat ramen’ Yoo Eun-jae is 60,"kind":"sub","type":"merged","vi":"[tiếng giày]\n[Thở dài]\n[Nhạc chủ đề lạc quan kết thúc]","ko":"[구두 소리]\n[한숨 쉰다]\n[경쾌한 테마 음악 끝]","en":"[shoe sound]\n[Sighs]\n[Upbeat theme music ends]","text":"[tiếng giày]\n[Thở dài]\n[Nhạc chủ đề lạc quan kết thúc]\n[구두 소리]\n[한숨 쉰다]\n[경쾌한 테마 음악 끝]\n[shoe sound]\n[Sighs]\n[Upbeat theme music ends]","sourceUid":"merged-mski02er-59","sourceNo":338,"viRanges":[],"koRanges":[]},{"id":367,"readerNo":368,"displayNo":61,"n":61,"kind":"sub","type":"merged","vi":"Không phải em thật à?\nKhông mà! Chị bảo em trộm đồ đấy à?\nBắt được thì biết tay.\nĐã lén lấy mặc thì phải trả lại nguyên trạng.\nAi lại giặt rồi làm hỏng thế này? Chị mới mặc đúng một lần.","ko":"아니야, 왜 사람을 도둑으로 몰아? 아이, 짜증 나\n누군지 잡히기만 해봐\n몰래 갖다 입었으면 제대로나 돌려놔야지\n물빨래를 하고 지랄이야 나도 한 번밖에 안 입은 건데","en":"It's not! You're accusing me of stealing?\nIf I catch her...\nIf you wear someone else's clothes, shouldn't you return them?\nSomeone washed it and ruined it. I only wore it once.","text":"Không phải em thật à?\nKhông mà! Chị bảo em trộm đồ đấy à?\nBắt được thì biết tay.\nĐã lén lấy mặc thì phải trả lại nguyên trạng.\nAi lại giặt rồi làm hỏng thế này? Chị mới mặc đúng một lần.\n아니야, 왜 사람을 도둑으로 몰아? 아이, 짜증 나\n누군지 잡히기만 해봐\n몰래 갖다 입었으면 제대로나 돌려놔야지\n물빨래를 하고 지랄이야 나도 한 번밖에 안 입은 건데\nIt's not! You're accusing me of stealing?\nIf I catch her...\nIf you wear someone else's clothes, shouldn't you return them?\nSomeone washed it and ruined it. I only wore it once.","sourceUid":"merged-mski28vy-63","sourceNo":215,"viRanges":[{"start":1382.341096,"end":1393.808867}],"koRanges":[{"start":1335.816227,"end":1345.455411}]},{"id":368,"readerNo":369,"displayNo":62,"n":62,"kind":"sub","type":"merged","vi":"Có chuyện gì vậy ạ? Cái đó…\nEm giặt đấy ạ.\nEm giặt nó? Em lấy sao? - Không.\nTiền bối Ye Eun… Chị lấy bao giờ?\nBiết ngay mà. Chị mày không có bằng chứng nên đã nhịn đó giờ.","ko":"그게 왜요? 그거...\n내가 빤 건데\n너야? 니가 그랬어? - 아뇨\n예은 선배, 세탁...\n야, 내가 언제...\n(강이나) 너 그럴 줄 알았어\n물증 없어서 계속 참고 있었는데","en":"What's wrong with it? That's...\nI washed it. You did?\nYou washed it? No. Ye-Eun said\nWhen did I do that?\nI knew it.\nI've been putting up with it because I had no evidence.","text":"Có chuyện gì vậy ạ? Cái đó…\nEm giặt đấy ạ.\nEm giặt nó? Em lấy sao? - Không.\nTiền bối Ye Eun… Chị lấy bao giờ?\nBiết ngay mà. Chị mày không có bằng chứng nên đã nhịn đó giờ.\n그게 왜요? 그거...\n내가 빤 건데\n너야? 니가 그랬어? - 아뇨\n예은 선배, 세탁...\n야, 내가 언제...\n(강이나) 너 그럴 줄 알았어\n물증 없어서 계속 참고 있었는데\nWhat's wrong with it? That's...\nI washed it. You did?\nYou washed it? No. Ye-Eun said\nWhen did I do that?\nI knew it.\nI've been putting up with it because I had no evidence.","sourceUid":"merged-mskknmch-68","sourceNo":224,"viRanges":[{"start":1393.808867,"end":1410.060882}],"koRanges":[{"start":1345.455411,"end":1363.518696}]},{"id":369,"readerNo":370,"displayNo":63,"n":63,"kind":"sub","type":"merged","vi":"Đôi giày đỏ cũng là sản phẩm của em chứ gì?\nCái đó không phải do em thật mà!\nCái này thì đúng hả? Mới cãi dữ lắm mà.\nĐừng có hất nữa coi!\nCon kia! Bà chằn!\nĐừng đánh nữa! Dừng lại! Dừng tay!","ko":"내 빨간 구두 기스 난 거 그것도 네가 그런 거지?\n아, 그건 진짜 아니다!\n그럼 이건 진짜고? 아까는 아니라며\n아, 왜 때려. 이씨...야! 왜\n(유은재) 언니! 악!\n(강이나) 야, 이년아!\n(정예은) 아! 아야!\n(강이나) 너 이리와! 이리와!\n(유은재) 저기요. 아! 아파","en":"You scratched my red shoes, didn't you?\nThat one's really not me!\nAnd this one is? You said it wasn't you earlier.\nDon't hit me! Hey! Con kia!\nYou! Don't! Stop! Stop!","text":"Đôi giày đỏ cũng là sản phẩm của em chứ gì?\nCái đó không phải do em thật mà!\nCái này thì đúng hả? Mới cãi dữ lắm mà.\nĐừng có hất nữa coi!\nCon kia! Bà chằn!\nĐừng đánh nữa! Dừng lại! Dừng tay!\n내 빨간 구두 기스 난 거 그것도 네가 그런 거지?\n아, 그건 진짜 아니다!\n그럼 이건 진짜고? 아까는 아니라며\n아, 왜 때려. 이씨...야! 왜\n(유은재) 언니! 악!\n(강이나) 야, 이년아!\n(정예은) 아! 아야!\n(강이나) 너 이리와! 이리와!\n(유은재) 저기요. 아! 아파\nYou scratched my red shoes, didn't you?\nThat one's really not me!\nAnd this one is? You said it wasn't you earlier.\nDon't hit me! Hey! Con kia!\nYou! Don't! Stop! Stop!","sourceUid":"merged-msl6b8uq-1","sour ight here.","sourceUid":"merged-msl7n50g-23","sourceNo":250,"viRanges":[{"start":1537.816438,"end":1551.811272}],"koRanges":[{"start":1491.630608,"end":1504.757371}]},{"id":375,"readerNo":376,"displayNo":69,"n":69,"kind":"sub","type":"merged","vi":"Còn chỗ nào nữa không?\n- Trong này có sao không? - Làm gì vậy?","ko":"아으... 또 어디 다쳤어? 뭐, 이 안에 안 다쳤어?\n- 뭐 하는 거야, 진짜 - 괜찮아","en":"Where else?\n-Are you hurt in here? -What are you doing?","text":"Còn chỗ nào nữa không?\n- Trong này có sao không? - Làm gì vậy?\n아으... 또 어디 다쳤어? 뭐, 이 안에 안 다쳤어?\n- 뭐 하는 거야, 진짜 - 괜찮아\nWhere else?\n-Are you hurt in here? -What are you doing?","sourceUid":"merged-msl7olir-25","sourceNo":252,"viRanges":[{"start":1551.811272,"end":1556.149972}],"koRanges":[{"start":1504.757371,"end":1511.276828}]},{"id":376,"readerNo":377,"displayNo":70,"n":70,"kind":"sub","type":"ko","vi":"[hắt hơi]","ko":"[재채기]","en":"[sneeze]","text":"[hắt hơi]\n[재채기]\n[sneeze]","sourceUid":"ko-mshaf165-1192","sourceNo":416,"viRanges":[],"koRanges":[]},{"id":377,"readerNo":378,"displayNo":71,"n":71,"kind":"sub","type":"merged","vi":"Khùng điên thật chứ.\nNó tốt lành lắm hay sao mà giận dỗi?\nĐúng là cạn lời. Đây này.\nNhìn đi rồi thấy.\nNhìn đẹp chứ bộ.\nBực cái mình thật chứ.","ko":"(강이나) 돌아이야, 진짜\n그러고도 지가 잘했다고 바락바락 대드는데\n나 진짜 어이가 없어가지고...야\n나, 이것 봐 봐...우와!\n이빨이 아주 가지런하네\n아! 앗! 아앗... 진짜...\n아이, 머리...아이 짜증 나, 짜증 나","en":"Such a psycho.\nShe acted like she did nothing wrong.\nIt was ridiculous.\nLook at this.\nLooks very nice.\nAnnoying.","text":"Khùng điên thật chứ.\nNó tốt lành lắm hay sao mà giận dỗi?\nĐúng là cạn lời. Đây này.\nNhìn đi rồi thấy.\nNhìn đẹp chứ bộ.\nBực cái mình thật chứ.\n(강이나) 돌아이야, 진짜\n그러고도 지가 잘했다고 바락바락 대드는데\n나 진짜 어이가 없어가지고...야\n나, 이것 봐 봐...우와!\n이빨이 아주 가지런하네\n아! 앗! 아앗... 진짜...\n아이, 머리...아이 짜증 나, 짜증 나\nSuch a psycho.\nShe acted like she did nothing wrong.\nIt was ridiculous.\nLook at this.\nLooks very nice.\nAnnoying.","sourceUid":"merged-msl81bqw-31","sourceNo":412,"viRanges":[{"start":1556.149972,"end":1575 định chiếm vị trí đó\nthì sẽ không dễ dàng chút nào.\nVị trí của người khác?","ko":"아으! 저기...\n혹시, 그 볼펜...아... 이거?\n카페에 굴러다니는 거 주었는데\n왜? 왜 그래요\n(교수님) 포지셔닝에서 중요한 건\n다른 사람 혹은 물건의 이미지와 겹치지 않는 것입니다\n거긴 이미...선점된 어떤 자리가 있거든요\n그래서 그 자리를 뺏으려고 한다면\n그건 보통 힘든 일이 아닙니다\n(유은재) 다른 사람의 포지셔닝?","en":"That pen... This one? I found it at the cafe.\nThe important thing in positioning\nis not to overlap someone else's image.\nBecause it's already been occupied.\nSo if you try to take it away,\nit won't be easy at all.\nSomeone else's position?","text":"Bạn ơi. Cây bút bi đó… Cái này á?\nNó lăn lóc trong quán cà phê nên tôi nhặt. Sao thế?\nĐiều quan trọng trong định vị bản thân\nlà không trùng lặp với hình ảnh của người hoặc vật khác.\nVì có những vị trí vốn đã thuộc về ai đó rồi.\nCho nên, nếu các em định chiếm vị trí đó\nthì sẽ không dễ dàng chút nào.\nVị trí của người khác?\n아으! 저기...\n혹시, 그 볼펜...아... 이거?\n카페에 굴러다니는 거 주었는데\n왜? 왜 그래요\n(교수님) 포지셔닝에서 중요한 건\n다른 사람 혹은 물건의 이미지와 겹치지 않는 것입니다\n거긴 이미...선점된 어떤 자리가 있거든요\n그래서 그 자리를 뺏으려고 한다면\n그건 보통 힘든 일이 아닙니다\n(유은재) 다른 사람의 포지셔닝?\nThat pen... This one? I found it at the cafe.\nThe important thing in positioning\nis not to overlap someone else's image.\nBecause it's already been occupied.\nSo if you try to take it away,\nit won't be easy at all.\nSomeone else's position?","sourceUid":"merged-msla6zoz-45","sourceNo":451,"viRanges":[{"start":1676.402232,"end":1709.992799}],"koRanges":[{"start":1626.700423,"end":1663.223514}]},{"id":384,"readerNo":385,"displayNo":78,"n":78,"kind":"sub","type":"merged","vi":"[tiếng chuông]\n[xào xạc]\n[Nhạc nền sôi động bắt đầu]","ko":"[벨 소리]\n[부스럭]\n[경쾌한 배경 음악 시작]","en":"[bell sound]\n[rustle]\n[Upbeat background music starts]","text":"[tiếng chuông]\n[xào xạc]\n[Nhạc nền sôi động bắt đầu]\n[벨 소리]\n[부스럭]\n[경쾌한 배경 음악 시작]\n[bell sound]\n[rustle]\n[Upbeat background music starts]","sourceUid":"merged-msla7gx7-46","sourceNo":452,"viRanges":[],"koRanges":[]},{"id":385,"readerNo":386,"displayNo":79,"n":79,"kind":"sub","type":"merged","vi":"Lạnh lùng và đáng sợ. Nghiện khoe thân. - Sao?\nVà đáng sợ.\nThích ca cẩm.\nEm ỷ mình trẻ hơn chị hai tuổi hả?\nTrong số những chỗ còn trống,\ncác em cần tìm ra vị trí phù hợp với mình.","ko":"쌀쌀맞고 무섭다! 노출증에...\n뭐! 무섭다. 앵앵거리는데...\n너 두 살 어리다고 유세 떠는 거야\n무섭지\n(교수님) 여기저기 빈자리 중에서...\n나의 이미지와 가장 맞는 자리를 찾아야 하는데요","en":"Cold and scary. An exhibitionist. What? And scary.\nAnnoying.\nAre you trying to say you're that much younger?\nWithin these empty seats,\nyou need to find a spot that suits you.","text":"Lạnh lùng và đáng sợ. Nghiện khoe thân. - Sao?\nVà đáng sợ.\nThích ca cẩm.\nEm ỷ mình trẻ hơn chị hai tuổi hả?\nTrong số những chỗ còn trống,\ncác em cần tìm ra vị trí phù hợp với mình.\n쌀쌀맞고 무섭다! 노출증에...\n뭐! 무섭다. 앵앵거리는데...\n너 두 살 어리다고 유세 떠는 거야\n무섭지\n(교수님) 여기저기 빈자리 중에서...\n나의 이미지와 가장 맞는 자리를 찾아야 하는데요\nCold and scary. An exhibitionist. What? And scary.\nAnnoying.\nAre you trying to say you're that much younger?\nWithin these empty seats,\nyou need to find a spot that suits you.","sourceUid":"merged-mslajkwe-49","sourceNo":294,"viRanges":[{"start":1709.992799,"end":1729.032031}],"koRanges":[{"start":1663.223514,"end":1682.947393}]},{"id":386,"readerNo":387,"displayNo":80,"n":80,"kind":"sub","type":"merged","vi":"Hình ảnh, ấn tượng.\nTrong đó, yếu tố quan trọng nhất là ấn tượng ban đầu.\nThông qua ấn tượng ban đầu,\ndù là con người hay đồ vật,\ncó thể nói yếu tố này quyết định đến 80-90 phần trăm.\nĐiều này đúng cho đa số trường hợp.\nNếu ban đầu ta định vị sai,\nkhông hẳn là chấm hết.","ko":"이미지, 인상\n그중에서 가장 중요한 것이 첫인상입니다\n첫인상을 통해서\n물건이나 사람이나\n한 8, 90%는\n평가가 끝났다...\n라고 볼 수 있게 됩니다\n끝이 아닙니다","en":"Image, impression.\nBut the most important thing is the first impression.\nThrough the first impression,\nwhether it is someone or something,\nyou could say it's already been evaluated.\nFor the most part.\nIf the first positioning went wrong,\nthat's not the end.","text":"Hình ảnh, ấn tượng.\nTrong đó, yếu tố quan trọng nhất là ấn tượng ban đầu.\nThông qua ấn tượng ban đầu,\ndù là con người hay đồ vật,\ncó thể nói yếu tố này quyết định đến 80-90 phần trăm.\nĐiều này đúng cho đa số trường hợp.\nNếu ban đầu ta định vị sai,\nkhông hẳn là chấm hết.\n이미지, 인상\n그중에서 가장 중요한 것이 첫인상입니다\n첫인상을 통해서\n물건이나 사람이나\n한 8, 90%는\n평가가 끝났다...\n라고 볼 수 있게 됩니다\n끝이 아닙니다\nImage, impression.\nBut the most important thing is the first impression.\nThrough the first impression,\nwhether it is someone or something,\nyou could say it's already been evaluated.\nFor the most part.\nIf the first positioning went wrong,\nthat's not the end.","sourceUid":"merged-mslapcse-51","sourceNo":470,"viRanges":[{"start":1729.032031,"end":1751.098623}],"koRanges":[{"start":1682.947393,"end":1702.489172}]},{"id":387,"readerNo":388,"displayNo":81,"n":81,"kind":"sub","type":"merged","vi":"[Nhạc nền sôi động kết thúc]\n[Nhạc nền bắt đầu]","ko":"[경쾌한 배경 음악 끝]\n[배경 음악 시작]","en":"[Upbeat background music ends]\n[Background music starts]","text":"[Nhạc nền sôi động kết thúc]\n[Nhạc nền bắt đầu]\n[경쾌한 배경 음악 끝]\n[배경 음악 시작]\n[Upbeat background music ends]\n[Background music starts]","sourceUid":"merged-mslu44a8-52","sourceNo":468,"viRanges":[],"koRanges":[]},{"id":388,"readerNo":389,"displayNo":82,"n":82,"kind":"sub","type":"merged","vi":"Chúng ta còn có tái định vị.\nĐúng rồi. Mình không thể ngốc mãi được.\nMình phải tìm ra chỗ đứng riêng dù có khó khăn.\nPhải tự định vị chính mình.\nHình ảnh mà mình muốn.\nVị trí của mình.","ko":"리포지션닝이 있습니다\n(유은재) 그래... 바보로 살 수는 없어\n어렵더라도 비집고 들어가야지\n자리를 잡아야 돼\n내가 원하는 이미지!\n나의 포지셔닝","en":"There's always repositioning.\nRight. I can't be an idiot all the time.\nI have to find my spot even if it's hard.\nI have to position myself.\nAn image that I want.\nMy positioning.","text":"Chúng ta còn có tái định vị.\nĐúng rồi. Mình không thể ngốc mãi được.\nMình phải tìm ra chỗ đứng riêng dù có khó khăn.\nPhải tự định vị chính mình.\nHình ảnh mà mình muốn.\nVị trí của mình.\n리포지션닝이 있습니다\n(유은재) 그래... 바보로 살 수는 없어\n어렵더라도 비집고 들어가야지\n자리를 잡아야 돼\n내가 원하는 이미지!\n나의 포지셔닝\nThere's always repositioning.\nRight. I can't be an idiot all the time.\nI have to find my spot even if it's hard.\nI have to position myself.\nAn image that I want.\nMy positioning.","sourceUid":"merged-msluoc6g-3","sourceNo":308,"viRanges":[{"start":1751.098623,"end":1766.280557}],"koRanges":[{"start":1702.489172,"end":1718.730301}]},{"id":389,"readerNo":390,"displayNo":83,"n":83,"kind":"sub","type":"merged","vi":"Nếu chị ăn bánh mì và mứt của em thì nên mời em cà phê đi chứ.\nỪ. Được.\nMình sẽ nói điều mình muốn.\nĐừng chần chừ.\nĐồ trong máy giặt là của em hả?\nMau lấy ra cho người khác còn dùng.","ko":"내 빵이랑 내 잼 먹었으면 나도 커피 줘야죠\n어... 알았어\n(유은재) 할 말은 한다\n우물쭈물 대지 말고\n야! 세탁기에 있는 빨래 네 거야?\n빨래 널어, 다음 사람이 못 쓰잖아","en":"If you ate my bread and jam, shouldn't you give me your coffee?\nOkay.\nI'm going to say what I want to say.\nDon't hesitate.\nIs the laundry yours?\nTake it out so others can use the machine.","text":"Nếu chị ăn bánh mì và mứt của em thì nên mời em cà phê đi chứ.\nỪ. Được.\nMình sẽ nói điều mình muốn.\nĐừng chần chừ.\nĐồ trong máy giặt là của em hả?\nMau lấy ra cho người khác còn dùng.\n내 빵이랑 내 잼 먹었으면 나도 커피 줘야죠\n어... 알았어\n(유은재) 할 말은 한다\n우물쭈물 대지 말고\n야! 세탁기에 있는 빨래 네 거야?\n빨래 널어, 다음 사람이 못 쓰잖아\nIf you ate my bread and jam, shouldn't you give me your coffee?\nOkay.\nI'm going to say what I want to say.\nDon't hesitate.\nIs the laundry yours?\nTake it out so others can use the machine.","sourceUid":"merged-msluu5lm-7","sourceNo":483,"viRanges":[{"start":1766.280557,"end":1783.959682}],"koRanges":[{"start":1718.730301,"end":1736.260965}]},{"id":390,"readerNo":391,"displayNo":84,"n":84,"kind":"sub","type":"merged","vi":"Tiền bối Ye Eun nói nếu em giặt thì chị ấy sẽ phơi đồ.\nChị muốn la lối thì tìm đúng người mà la.\nSao cơ?\nXin lỗi.\nKhông dùng thì rút phích cắm đi.\nKhoan đã ạ.\nTa làm quen đã nhỉ.","ko":"내가 빨래하면 너는 건 정 선배가 하기로 했어요\n화내려면 제대로 알고 화내세요\n그랬어?\n미안\n안 쓰는 코드는 뽑아놓도록 해요\n아... 잠깐만요\n먼저 인사부터 하죠","en":"Ye-Eun said she'd do that if I ran the machine.\nI'm not the one you should be yelling at.\nWhat?\nSorry.\nUnplug it when you aren't using it.\nHold up.\nLet's say hello first.","text":"Tiền bối Ye Eun nói nếu em giặt thì chị ấy sẽ phơi đồ.\nChị muốn la lối thì tìm đúng người mà la.\nSao cơ?\nXin lỗi.\nKhông dùng thì rút phích cắm đi.\nKhoan đã ạ.\nTa làm quen đã nhỉ.\n내가 빨래하면 너는 건 정 선배가 하기로 했어요\n화내려면 제대로 알고 화내세요\n그랬어?\n미안\n안 쓰는 코드는 뽑아놓도록 해요\n아... 잠깐만요\n먼저 인사부터 하죠\nYe-Eun said she'd do that if I ran the machine.\nI'm not the one you should be yelling at.\nWhat?\nSorry.\nUnplug it when you aren't using it.\nHold up.\nLet's say hello first.","sourceUid":"merged-mslv9ny3-10","sourceNo":321,"viRanges":[{"start":1783.959682,"end":1803.821451}],"koRanges":[{"start":1736.260965,"end":1756.110775}]},{"id":391,"readerNo":392,"displayNo":85,"n":85,"kind":"sub","type":"merged","vi":"Em là Yoo Eun Jae.\nKhông né tránh ánh mắt.\nMình muốn gì thì sẽ nói đó.\nTrả em cây bút bi.\nKhông lắp bắp. Nói rõ ràng.","ko":"나는 유은재라고 해요\n(유은재) 시선을 피하지 않는다\n할 말은 할 거야\n볼펜 줘요!\n(유은재) 버벅대지 말고 또박또박","en":"I'm Eun-Jae.\nDon't break eye contact.\nI'll say what I want to say.\nGive me back my pen.\nDon't stutter, be clear.","text":"Em là Yoo Eun Jae.\nKhông né tránh ánh mắt.\nMình muốn gì thì sẽ nói đó.\nTrả em cây bút bi.\nKhông lắp bắp. Nói rõ ràng.\n나는 유은재라고 해요\n(유은재) 시선을 피하지 않는다\n할 말은 할 거야\n볼펜 줘요!\n(유은재) 버벅대지 말고 또박또박\nI'm Eun-Jae.\nDon't break eye contact.\nI'll say what I want to say.\nGive me back my pen.\nDon't stutter, be clear.","sourceUid":"merged-mslvr0al-12","sourceNo":496,"viRanges":[{"start":1803.821451,"end":1828.390884}],"koRanges":[{"start":1756.110775,"end":1779.474382}]},{"id":392,"readerNo":393,"displayNo":86,"n":86,"kind":"sub","type":"merged","vi":"Sao anh không trả bút cho em?\nLần trước anh mượn em mà.\nBút gắn cục bông.\nKêu leng keng thế này.\nNó đâu rồi?\nMất rồi chứ gì?\nMượn bút của ai thì phải trả lại chứ.","ko":"어? 내 볼펜 왜 안 줘요?\n지난번에 빌려 갔잖아요 방울 달린 거\n흔들면 딸랑거리는 거\n그거 어디 있어요?\n잃어버렸죠?\n남의 볼펜을 빌려 갔으면 돌려줘야지...","en":"You didn't give me back my pen.\nYou borrowed it the last time.\nThe one with a pompom.\nThe one that jingles. Where is it?\nYou lost it, didn't you?\nIf you borrowed someone's pen, you should return it.","text":"Sao anh không trả bút cho em?\nLần trước anh mượn em mà.\nBút gắn cục bông.\nKêu leng keng thế này.\nNó đâu rồi?\nMất rồi chứ gì?\nMượn bút của ai thì phải trả lại chứ.\n어? 내 볼펜 왜 안 줘요?\n지난번에 빌려 갔잖아요 방울 달린 거\n흔들면 딸랑거리는 거\n그거 어디 있어요?\n잃어버렸죠?\n남의 볼펜을 빌려 갔으면 돌려줘야지...\nYou didn't give me back my pen.\nYou borrowed it the last time.\nThe one with a pompom.\nThe one that jingles. Where is it?\nYou lost it, didn't you?\nIf you borrowed someone's pen, you should return it.","sourceUid":"merged-mslw650x-17","sourceNo":331,"viRanges":[{"start":1828.390884,"end":1838.30952}],"koRanges":[{"start":1779.474382,"end":1789.907238}]},{"id":393,"readerNo":394,"displayNo":87,"n":87,"kind":"sub","type":"merged","vi":"Như thế này đâu có được.\nNhìn thẳng vào mắt anh ta.\nAnh xin lỗi.\nMình làm được rồi.\nCó chuyện gì vậy?\nChuyện cái bút bi…\nBút bi gì cơ ạ?","ko":"그럼 안 되는 거잖아요\n(유은재) 눈을 똑바로 쳐다봐\n어... 미안\n(유은재) 해냈다!\n왜요? 무슨 일이에요?\n볼펜이...\n볼펜이 왜요?","en":"This is not okay.\nLook him in the eyes.\nI'm sorry.\nI did it.\nWhat happened?\nA pen was...\nWhat about a pen?","text":"Như thế này đâu có được.\nNhìn thẳng vào mắt anh ta.\nAnh xin lỗi.\nMình làm được rồi.\nCó chuyện gì vậy?\nChuyện cái bút bi…\nBút bi gì cơ ạ?\n그럼 안 되는 거잖아요\n(유은재) 눈을 똑바로 쳐다봐\n어... 미안\n(유은재) 해냈다!\n왜요? 무슨 일이에요?\n볼펜이...\n볼펜이 왜요?\nThis is not okay.\nLook him in the eyes.\nI'm sorry.\nI did it.\nWhat happened?\nA pen was...\nWhat about a pen?","sourceUid":"merged-mslwcgv6-20","sourceNo":340,"viRanges":[{"start":1838.30952,"end":1858.250285}],"koRanges":[{"start":1789.907238,"end":1811.816877}]},{"id":394,"readerNo":395,"displayNo":88,"n":88,"kind":"sub","type":"merged","vi":"Em ấy nói gì đó về bút bi…\nNày, con bé đó là ai thế?\nĐã ăn thì ăn cho đã cái nư.\nCó vậy thì mới không thèm nữa.\nChị vừa cười đúng không?","ko":"그러게 볼펜이 뭐라는데\n야, 쟤 누구냐? 쳇!\n(정예은) 어차피 한 번 먹을 때 실컷 먹는 게 나아\n그래야 당분간 떡볶이 생각이 안 나지\n방금 코로 웃었지?","en":"She said a pen was...\nHey, who's that?\nIt's better to eat a lot.\nSo I don't crave it for a while.\nYou laughed, didn't you?","text":"Em ấy nói gì đó về bút bi…\nNày, con bé đó là ai thế?\nĐã ăn thì ăn cho đã cái nư.\nCó vậy thì mới không thèm nữa.\nChị vừa cười đúng không?\n그러게 볼펜이 뭐라는데\n야, 쟤 누구냐? 쳇!\n(정예은) 어차피 한 번 먹을 때 실컷 먹는 게 나아\n그래야 당분간 떡볶이 생각이 안 나지\n방금 코로 웃었지?\nShe said a pen was...\nHey, who's that?\nIt's better to eat a lot.\nSo I don't crave it for a while.\nYou laughed, didn't you?","sourceUid":"merged-mslwiwhg-27","sourceNo":345,"viRanges":[{"start":1858.250285,"end":1876.217}],"koRanges":[{"start":1811.816877,"end":1828.325805}]},{"id":395,"readerNo":396,"displayNo":89,"n":89,"kind":"sub","type":"merged","vi":"[Nhạc nền kết thúc]\n[Tiếng giày]\n[cười]","ko":"[배경 음악 끝]\n[신발 소리]\n[피식 웃는다]\n[비명을 지른다]\n[달그락 소리]","en":"[Background music ends]\n[Shoes sound]\n[laughter]","text":"[Nhạc nền kết thúc]\n[Tiếng giày]\n[cười]\n[배경 음악 끝]\n[신발 소리]\n[피식 웃는다]\n[비명을 지른다]\n[달그락 소리]\n[Background music ends]\n[Shoes sound]\n[laughter]","sourceUid":"merged-mslwqpjn-33","sourceNo":516,"viRanges":[],"koRanges":[]},{"id":396,"readerNo":397,"displayNo":90,"n":90,"kind":"sub","type":"merged","vi":"Chị cười khẩy em chứ gì? Ừ.\nEm về muộn vậy?\nTại em chưa về nên chị ăn lố rồi.\nMọi người nên ăn cùng nhau cho vui.\nEm ăn không? Thôi ạ.\nNói điều muốn nói đi.\nĐừng chần chừ.","ko":"비웃었지? 어\n왜 이렇게 늦게 와?\n너 때문에 내가 300칼로리는 더 먹었겠다\n좀만 일찍 오지 같이 먹었으면 좋았을 텐데...\n이거라도 먹을래? 아니요...\n(유은재) 할 말은 한다\n우물쭈물 대지 말고","en":"You were laughing at me! Yes.\nYou're late.\nI ate so much because you weren't here.\nIt would have been nice to have eaten together.\nWould you like some? No.\nSay what you want to say.\nDon't hesitate.","text":"Chị cười khẩy em chứ gì? Ừ.\nEm về muộn vậy?\nTại em chưa về nên chị ăn lố rồi.\nMọi người nên ăn cùng nhau cho vui.\nEm ăn không? Thôi ạ.\nNói điều muốn nói đi.\nĐừng chần chừ.\n비웃었지? 어\n왜 이렇게 늦게 와?\n너 때문에 내가 300칼로리는 더 먹었겠다\n좀만 일찍 오지 같이 먹었으면 좋았을 텐데...\n이거라도 먹을래? 아니요...\n(유은재) 할 말은 한다\n우물쭈물 대지 말고\nYou were laughing at me! Yes.\nYou're late.\nI ate so much because you weren't here.\nIt would have been nice to have eaten together.\nWould you like some? No.\nSay what you want to say.\nDon't hesitate.","sourceUid":"merged-mslwxguf-36","sourceNo":527,"viRanges":[{"start":1876.217,"end":1904.647294}],"koRanges":[{"start":1828.325805,"end":1858.790482}]},{"id":397,"readerNo":398,"displayNo":91,"n":91,"kind":"sub","type":"merged","vi":"Ai ăn hết mứt rồi ạ?\nChị ăn vài lần.\nChị cũng ăn một hai lần.\nKhông né tránh ánh mắt.\nCác chị không nên tự tiện ăn như vậy.","ko":"이거 누가 다 먹었어요?\n내가 몇 번 먹었는데\n나도 한두 번\n(유은재) 시선을 피하지 않는다\n그렇지만 말도 안 하고 먹으면 안 되죠","en":"Who ate all this?\nI did, a few times.\nMe too, a couple times.\nDon't look away.\nYou can't just eat it without telling me.","text":"Ai ăn hết mứt rồi ạ?\nChị ăn vài lần.\nChị cũng ăn một hai lần.\nKhông né tránh ánh mắt.\nCác chị không nên tự tiện ăn như vậy.\n이거 누가 다 먹었어요?\n내가 몇 번 먹었는데\n나도 한두 번\n(유은재) 시선을 피하지 않는다\n그렇지만 말도 안 하고 먹으면 안 되죠\nWho ate all this?\nI did, a few times.\nMe too, a couple times.\nDon't look away.\nYou can't just eat it without telling me.","sourceUid":"merged-mslwyw1s-38","sourceNo":359,"viRanges":[{"start":1904.647294,"end":1917.632491}],"koRanges":[{"start":1858.790482,"end":1869.792852}]},{"id":398,"readerNo":399,"displayNo":92,"n":92,"kind":"sub","type":"merged","vi":"Em mới ăn vài lần thôi.\nXin lỗi vì cắt ngang\nnhưng em đóng cửa lại đi.\nSao ạ? À, vâng.\nEm xin lỗi.\nEm làm hư tủ bây giờ.\nĂn nữa chắc bị đấm mất.","ko":"나도 몇 번밖에 안 먹은 건데...\n말하는 중에 미안한데\n냉장고 문부터 닫아요\n예?\n아, 죄송해요\n(강이나) 야... 문 부서지겠다\n한 번 더 먹으면 맞겠네","en":"I only ate it a few times.\nI'm sorry to interrupt,\nbut close the fridge first.\nWhat? Right.\nSorry.\nYou might break it.\nYou'd hit me if I eat it again.","text":"Em mới ăn vài lần thôi.\nXin lỗi vì cắt ngang\nnhưng em đóng cửa lại đi.\nSao ạ? À, vâng.\n  đến thư viện à? - Vâng.","ko":"야! 어? 선배? 뭐 떨어트렸어? 아니요...\n고개 좀 들고 다녀\n그래야 잘생긴 남자를 발견하지\n도서관 가는 거야? 네...","en":"Hi. Hi. Did you drop something? No.\nChin up.\nThat's how you spot a good-looking guy.\n-Are you going to the library? -Yes.","text":"Ê. Ồ, tiền bối. Em đánh rơi gì à? Không ạ.\nNgẩng cao đầu lên mà đi.\nCó vậy mới tia được trai đẹp.\nEm đến thư viện à? - Vâng.\n야! 어? 선배? 뭐 떨어트렸어? 아니요...\n고개 좀 들고 다녀\n그래야 잘생긴 남자를 발견하지\n도서관 가는 거야? 네...\nHi. Hi. Did you drop something? No.\nChin up.\nThat's how you spot a good-looking guy.\n-Are you going to the library? -Yes.","sourceUid":"merged-msmmpr3n-7","sourceNo":596,"viRanges":[{"start":2063.838862,"end":2080.141113}],"koRanges":[{"start":2022,"end":2033.945124}]},{"id":411,"readerNo":412,"displayNo":105,"n":105,"kind":"sub","type":"merged","vi":"Hồi năm nhất, chị còn chẳng bén mảng đến gần thư viện.\nEm học gì vậy? Ôn TOEIC? Luyện chứng chỉ?\nKhông, em chỉ đọc sách thôi.\nÔi trời, đừng làm thế.\nBây giờ không chơi thì đợi đến bao giờ?","ko":"난 1학년 때 도서관 근처도 안 갔는데\n뭐 공부해? 토익? 자격증?\n아뇨, 그냥 책 읽어요 이것저것\n어우... 그러지 마라\n학년 때 안 놀면 언제 노냐?","en":"I never went anywhere near the library when I was a freshman.\nWhat do you study? English? Certifications?\nNo, I just read.\nGosh, don't do that.\nWhen are you going to have fun if not now?","text":"Hồi năm nhất, chị còn chẳng bén mảng đến gần thư viện.\nEm học gì vậy? Ôn TOEIC? Luyện chứng chỉ?\nKhông, em chỉ đọc sách thôi.\nÔi trời, đừng làm thế.\nBây giờ không chơi thì đợi đến bao giờ?\n난 1학년 때 도서관 근처도 안 갔는데\n뭐 공부해? 토익? 자격증?\n아뇨, 그냥 책 읽어요 이것저것\n어우... 그러지 마라\n학년 때 안 놀면 언제 노냐?\nI never went anywhere near the library when I was a freshman.\nWhat do you study? English? Certifications?\nNo, I just read.\nGosh, don't do that.\nWhen are you going to have fun if not now?","sourceUid":"merged-msmnew64-10","sourceNo":414,"viRanges":[{"start":2080.141113,"end":2094.338222}],"koRanges":[{"start":2033.945124,"end":2047.164}]},{"id":412,"readerNo":413,"displayNo":106,"n":106,"kind":"sub","type":"merged","vi":"Sống vui vẻ chút đi.\nÔi trời, chị lại càm ràm như bà già rồi.\nKhông hiểu sao dạo này chị dạy đời người khác nhiều thế.\nCó lẽ chị già rồi.\nKhông đâu.\nXin lỗi em nhiều, nhưng em xí một chỗ cho chị nhé?","ko":"그냥 재밌게 살아\n헉!\n아... 또 할머니 같은 소릴 했어\n요즘엔 왜 이렇게 가르치려는 소릴 하는지 몰라\n나 늙나 봐\n저기 미안한데... 나 자리 좀 맡아줄래?","en":"Live a little.\nGosh, I was being a grandma again.\nI don't know why I'm lecturing people these days.\nI think I'm getting old.\nYou're not.\nCould you get me a spot?","text":"Sống vui vẻ chút đi.\nÔi trời, chị lại càm ràm như bà già rồi.\nKhông hiểu sao dạo này chị dạy đời người khác nhiều thế.\nCó lẽ chị già rồi.\nKhông đâu.\nXin lỗi em nhiều, nhưng em xí một chỗ cho chị nhé?\n그냥 재밌게 살아\n헉!\n아... 또 할머니 같은 소릴 했어\n요즘엔 왜 이렇게 가르치려는 소릴 하는지 몰라\n나 늙나 봐\n저기 미안한데... 나 자리 좀 맡아줄래?\nLive a little.\nGosh, I was being a grandma again.\nI don't know why I'm lecturing people these days.\nI think I'm getting old.\nYou're not.\nCould you get me a spot?","sourceUid":"merged-msmnjs76-15","sourceNo":420,"viRanges":[{"start":2094.338222,"end":2122.547564}],"koRanges":[{"start":2047.164,"end":2074.874506}]},{"id":413,"readerNo":414,"displayNo":107,"n":107,"kind":"sub","type":"ko","vi":"[Rung điện thoại di động]","ko":"[핸드폰 진동]","en":"[Cellphone vibration]","text":"[Rung điện thoại di động]\n[핸드폰 진동]\n[Cellphone vibration]","sourceUid":"ko-mshaf166-1383","sourceNo":607,"viRanges":[],"koRanges":[]},{"id":414,"readerNo":415,"displayNo":108,"n":108,"kind":"sub","type":"merged","vi":"Tự dưng bồ chị mò đến trường mình.\nAnh ấy lúc nào cũng vậy.\nChị quay lại ngay.\nXin lỗi. Gặp em sau.","ko":"남자친군데... 갑자기 학교 앞이라고\n맨날 제 맘대로야\n나 진짜 금방 올게 미안, 이따 봐","en":"My boyfriend just showed up.\nHe always does this.\nI'll be back real quick.\nSorry. See you.","text":"Tự dưng bồ chị mò đến trường mình.\nAnh ấy lúc nào cũng vậy.\nChị quay lại ngay.\nXin lỗi. Gặp em sau.\n남자친군데... 갑자기 학교 앞이라고\n맨날 제 맘대로야\n나 진짜 금방 올게 미안, 이따 봐\nMy boyfriend just showed up.\nHe always does this.\nI'll be ba 's not like I did it on purpose.\nYou did do it on purpose. You look down on Eun-Sun.\nIt just happened.\nI couldn't help it.\nBut why do you call her Eun-Sun?\nBecause she's tacky?\nBecause she's naive.\nSame thing.","text":"Em không cố ý làm vậy.\nEm cố tình mà. Em coi thường Eun Soon thấy rõ.\nDo dòng đời xô đẩy thôi.\nEm đâu làm gì được.\nNhưng tại sao hai đứa gọi em ấy là Eun Soon?\nVì em ấy nhà quê sao?\nVì nó quá thật thà.\nGiống nhau mà.\n내가 일부러 그랬나?\n일부러 맞잖아 은순이 만만하게 봤잖아\n상황이 그랬다니까, 어쩔 수 없었어\n그런데...\n왜 은순이야?\n촌스러워서? - 으으응\n순박해서\n그거나 그거나\nIt's not like I did it on purpose.\nYou did do it on purpose. You look down on Eun-Sun.\nIt just happened.\nI couldn't help it.\nBut why do you call her Eun-Sun?\nBecause she's tacky?\nBecause she's naive.\nSame thing.","sourceUid":"merged-msmpvi0j-66","sourceNo":475,"viRanges":[{"start":2496.145367,"end":2512.437068}],"koRanges":[{"start":2415.712396,"end":2432.507882}]},{"id":429,"readerNo":430,"displayNo":123,"n":123,"kind":"sub","type":"merged","vi":"Con bé đó không trang điểm nhỉ?\nGái nhà quê đều vậy à?\nTrang điểm á?\nNó còn chẳng thèm tỉa lông mày.\nEm thích con trai có lông mày rậm.\nNhưng con gái thì không.\nChắc chỗ khác của nó cũng đầy lông.","ko":"걔 화장 안 하지?\n시골 애들은 다 걔 같은가?\n화장?\n난 남자애들이 눈썹 진한 건 괜찮은데\n여자애들이 그러면 좀 싫더라\n왠지 다른데도 털이 막 무성 할 거 같고...","en":"She doesn't wear make-up, does she?\nAre all country girls like that?\nMake-up?\nShe doesn't even trim her eyebrows.\nI like thick eyebrows on men.\nI don't like them on girls.\nI feel like she'd be hairy everywhere.","text":"Con bé đó không trang điểm nhỉ?\nGái nhà quê đều vậy à?\nTrang điểm á?\nNó còn chẳng thèm tỉa lông mày.\nEm thích con trai có lông mày rậm.\nNhưng con gái thì không.\nChắc chỗ khác của nó cũng đầy lông.\n걔 화장 안 하지?\n시골 애들은 다 걔 같은가?\n화장?\n난 남자애들이 눈썹 진한 건 괜찮은데\n여자애들이 그러면 좀 싫더라\n왠지 다른데도 털이 막 무성 할 거 같고...\nShe doesn't wear make-up, does she?\nAre all country girls like that?\nMake-up?\nShe doesn't even trim her eyebrows.\nI like thick eyebrows on men.\nI don't like them on girls.\nI feel like she'd be hairy everywhere.","sourceUid":"merged-msmsu45h-71","sourceNo":482,"viRanges":[{"start":2512.437068,"end":2528.557522}],"koRanges":[{"start":2432.507882,"end":2449.518966}]},{"id":430,"readerNo":431,"displayNo":124,"n":124,"kind":"sub","type":"merged","vi":"Em về từ khi nào vậy? Chị xin lỗi.\nMáy chị hết pin nên không gọi em được.\nChị mới sạc và đang định gọi em đây. Này!","ko":"언제 왔어? 아 미안\n배터리가 나가서 연락할 방법이 있어야지\n이제 막 충전하고 연락하려던 참인데...","en":"When did you get home? I'm sorry.\nMy battery was out and I couldn't reach you.\nI was about to call you now. Hey!","text":"Em về từ khi nào vậy? Chị xin lỗi.\nMáy chị hết pin nên không gọi em được.\nChị mới sạc và đang định gọi em đây. Này!\n언제 왔어? 아 미안\n배터리가 나가서 연락할 방법이 있어야지\n이제 막 충전하고 연락하려던 참인데...\nWhen did you get home? I'm sorry.\nMy battery was out and I couldn't reach you.\nI was about to call you now. Hey!","sourceUid":"merged-msmt2z1z-79","sourceNo":711,"viRanges":[{"start":2544.005,"end":2565.02}],"koRanges":[{"start":2464.124708,"end":2478.958628}]},{"id":431,"readerNo":432,"displayNo":125,"n":125,"kind":"sub","type":"merged","vi":"[Chuông reo] [Tín hiệu đi]\n[Tiếng ném] [Tiếng ném túi]","ko":"[벨 소리 울린다][신호가 간다]\n[던지는 소리][가방 던진다]","en":"[Bell rings] [Signal goes]\n[Throwing sound][Throwing bag]","text":"[Chuông reo] [Tín hiệu đi]\n[Tiếng ném] [Tiếng ném túi]\n[벨 소리 울린다][신호가 간다]\n[던지는 소리][가방 던진다]\n[Bell rings] [Signal goes]\n[Throwing sound][Throwing bag]","sourceUid":"merged-msmsysjw-73","sourceNo":706,"viRanges":[],"koRanges":[]},{"id":432,"readerNo":433,"displayNo":126,"n":126,"kind":"sub","type":"merged","vi":"Tôi mắc cười lắm à?\nNày.\nEm sao vậy? Tự hỏi mình đi. Tại sao các chị làm vậy?\nTôi có đần độn hay khờ khạo đi nữa\nthì các chị cũng đâu cần phải thế.","ko":"야! 내가 우스워? 야아... 왜 그래?\n너야말로 왜 그래?\n너희들이야말로 왜 그래?\n내가 아무것도 모르고...\n바보 같고 그래도...\n이럴 필요는 없잖아!","en":"You think I'm a joke?\nHey.\nWhy are you doing this? Why are you?\nWhy are you all doing this?\nEven if I am stupid and naive, you don't have to be like this.\nYou don't have to be so mean!","text":"Tôi mắc cười lắm à?\nNày.\nEm sao vậy? Tự hỏi mình đi. Tại sao các chị làm vậy?\nTôi có đần độn hay khờ khạo đi nữa\nthì các chị cũng đâu cần phải thế.\n야! 내가 우스워? 야아... 왜 그래?\n너야말로 왜 그래?\n너희들이야말로 왜 그래?\n내가 아무것도 모르고...\n바보 같고 그래도...\n이럴 필요는 없잖아!\nYou think I'm a joke?\nHey.\nWhy are you doing this? Why are you?\nWhy are you all doing this?\nEven if I am stupid and naive, you don't have to be like this.\nYou don't have to be so mean!","sourceUid":"merged-msmtfr78-82","sourceNo":712,"viRanges":[{"start":2572.716975,"end":2592.734953}],"koRanges":[{"start":2493.845736,"end":2512.503683}]},{"id":433,"readerNo":434,"displayNo":127,"n":127,"kind":"sub","type":"ko","vi":"[Nhạc chủ đề sôi động bắt đầu]","ko":"[경쾌한 테마 음악 시작]","en":"[Upbeat theme music starts]","text":"[Nhạc chủ đề sôi động bắt đầu]\n[경쾌한 테마 음악 시작]\n[Upbeat theme music starts]","sourceUid":"ko-mshaf167-1490","sourceNo":714,"viRanges":[],"koRanges":[]},{"id":434,"readerNo":435,"displayNo":128,"n":128,"kind":"sub","type":"merged","vi":"Các chị đâu cần xấu tính đến vậy!\nĐâu cần cười nhạo tôi!\nTử tế chút cũng được mà.\nĐâu phải ai cũng sỏi đời như các chị.\nTôi…\nthấy khổ sở chết đi được!","ko":"그렇게 못되게 굴 것까진 없잖아!\n비웃을 필요는 없잖아!\n조금은 친절해도 되잖아\n다들 너희들처럼 익숙한 건 아니니까\n나는...\n죽을 것처럼 힘든데!","en":"You don't have to laugh at me!\nYou can be a little nice.\nNot everyone is used to this.\nI'm...\ndying here!","text":"Các chị đâu cần xấu tính đến vậy!\nĐâu cần cười nhạo tôi!\nTử tế chút cũng được mà.\nĐâu phải ai cũng sỏi đời như các chị.\nTôi…\nthấy khổ sở chết đi được!\n그렇게 못되게 굴 것까진 없잖아!\n비웃을 필요는 없잖아!\n조금은 친절해도 되잖아\n다들 너희들처럼 익숙한 건 아니니까\n나는...\n죽을 것처럼 힘든데!\nYou don't have to laugh at me!\nYou can be a little nice.\nNot everyone is used to this.\nI'm...\ndying here!","sourceUid":"merged-msmu9usd-85","sourceNo":500,"viRanges":[{"start":2592.734953,"end":2611.656329}],"koRanges":[{"start":2512.503683,"end":2533.096167}]} iết.\nMẹ ơi.\nCon muốn về nhà. Nhưng không có chỗ để về.\nMình muốn về nhà.\n야... 너 가방! 어, 아악!\n바보. 화도 못 내는 바보\n엄마... 집에 가고 싶어\n돌아갈 집도 없는데...\nYour bag. Stupid.\nI'm so stupid. I can't even be angry. Mom.\nI want to go home. You don't answer the phone.\nI don't even have a home.","sourceUid":"merged-msn6kmtl-1","sourceNo":513,"viRanges":[{"start":2673.770462,"end":2727.366669}],"koRanges":[{"start":2594.189179,"end":2668.081517}]},{"id":438,"readerNo":439,"displayNo":132,"n":132,"kind":"sub","type":"merged","vi":"Hình như em ấy sốt rồi. Có cần đi viện không?\nNhà mình còn thuốc hạ sốt không?\nKhông sao đâu.\nSao lại thế?\nSao em phải dọn nhà vệ sinh vậy? Tính ra em thiệt nhất rồi.\nÔi.Em tỉnh rồi hả?\nThấy ổn hơn chưa?\nKhông sao chứ?\nBớt sốt chưa?","ko":"열나는 것 같은데...\n야, 얘 아픈가 봐... 병원에 안 가도 돼?\n(윤진명) 해열제 있어?\n(남자) 괜찮아, 괜찮아. 어... 어. 도대체 왜?\n내가 왜 화장실이야?\n손해 본 걸로 따지면 내가 최고구먼.\n아휴 진짜. 지난번에도 화장실. 어? 일어났어?\n너 괜찮아? 네...","en":"She seems sick. Does she need to go to the hospital?\nDo we have anything to lower her fever? It's okay. Why?\nI sacrificed the most around here. Gosh. You're up.\nAre you feeling okay?\nAre you okay?\nHas the fever gone down? Yes.","text":"Hình như em ấy sốt rồi. Có cần đi viện không?\nNhà mình còn thuốc hạ sốt không?\nKhông sao đâu.\nSao lại thế?\nSao em phải dọn nhà vệ sinh vậy? Tính ra em thiệt nhất rồi.\nÔi.Em tỉnh rồi hả?\nThấy ổn hơn chưa?\nKhông sao chứ?\nBớt sốt chưa?\n열나는 것 같은데...\n야, 얘 아픈가 봐... 병원에 안 가도 돼?\n(윤진명) 해열제 있어?\n(남자) 괜찮아, 괜찮아. 어... 어. 도대체 왜?\n내가 왜 화장실이야?\n손해 본 걸로 따지면 내가 최고구먼.\n아휴 진짜. 지난번에도 화장실. 어? 일어났어?\n너 괜찮아? 네...\nShe seems sick. Does she need to go to the hospital?\nDo we have anything to lower her fever? It's okay. Why?\nI sacrificed the most around here. Gosh. You're up.\nAre you feeling okay?\nAre you okay?\nHas the fever gone down? Yes.","sourceUid":"merged-msnf70lz-18","sourceNo":757,"viRanges":[{"start":2727.366669,"end":2829.343087}],"koRanges":[{"start":2668.081517,"end":2737.993261}]},{"id":439,"readerNo":440,"displayNo":133,"n":133,"kind":"sub","type":"merged","vi":"Rồi ạ. À… Em muốn dùng nhà vệ sinh.\nỪ, đi đi. Chắc em ấy nhịn lâu lắm rồi.\nChắc nhịn để đi một lần cho đã.\nEm nên làm gì đây ạ?\nKhông sao. Bọn chị làm xong rồi.\nEm xin lỗi.","ko":"괜찮아? 열은 내렸어?\n네...저...화장실 좀\n어...들어가\n되게 오래 참았나 봐\n참다 참다... 터트리는 게 취민가 보지\n저 뭐하면 되죠? 아니야, 할 거 없어, 다했어\n죄송해요","en":"She must have held it for a while.\nWell... I need to use the bathroom. Sure, go ahead.\nShe holds it until it explodes, I guess. What can I do?\nIt's okay, we're done. I'm sorry.","text":"Rồi ạ. À… Em muốn dùng nhà vệ sinh.\nỪ, đi đi. Chắc em ấy nhịn lâu lắm rồi.\nChắc nhịn để đi một lần cho đã.\nEm nên làm gì đây ạ?\nKhông sao. Bọn chị làm xong rồi.\nEm xin lỗi.\n괜찮아? 열은 내렸어?\n네...저...화장실 좀\n어...들어가\n되게 오래 참았나 봐\n참다 참다... 터트리는 게 취민가 보지\n저 뭐하면 되죠? 아니야, 할 거 없어, 다했어\n죄송해요\nShe must have held it for a while.\nWell... I need to use the bathroom. Sure, go ahead.\nShe holds it until it explodes, I guess. What can I do?\nIt's okay, we're done. I'm sorry.","sourceUid":"merged-msoj1fdw-23","sourceNo":532,"viRanges":[],"koRanges":[{"start":2737.993261,"end":2789.695132}]},{"id":440,"readerNo":441,"displayNo":134,"n":134,"kind":"sub","type":"merged","vi":"[Cằn nhằn] [Thở dài]\n[Tiếng mở cửa] [Cốc rơi]\n[Cá vỗ cánh] [Thở dài]\n[tiếng chó sủa]","ko":"[구시렁거린다][한숨 쉰다]\n[문 여는 소리][컵 떨어진다]\n[물고기가 팔딱거린다][숨 길게 쉰다]\n[개가 짖는다]","en":"[Grumpers] [Sighs]\n[Sound of door opening] [Cup falls]\n[The fish flutters] [Takes a long breath]\n[dog barks]","text":"[Cằn nhằn] [Thở dài]\n[Tiếng mở cửa] [Cốc rơi]\n[Cá vỗ cánh] [Thở dài]\n[tiếng chó sủa]\n[구시렁거린다][한숨 쉰다]\n[문 여는 소리][컵 떨어진다]\n[물고기가 팔딱거린다][숨 길게 쉰다]\n[개가 짖는다]\n[Grumpers] [Sighs]\n[Sound of door opening] [Cup falls]\n[The fish flutters] [Takes a long breath]\n[dog barks]","sourceUid":"merged-msneywwd-14","sourceNo":749,"viRanges":[],"koRanges":[]},{"id":441,"readerNo":442,"displayNo":135,"n":135,"kind":"sub","type":"merged","vi":"[Tiếng đóng cửa]\n[Có tiếng nước rơi]\n[Cười]\n[Cười]\n[Tiếng xả dge and the--\nIt's fine.","text":"Tuy hơi phiền nhưng hãy rút phích cắm ra nhé.\nKhi nào ra ngoài, em nhớ rút điện nhé,\nmặc dù hơi phiền.\nEm lại ăn mì này.\nKhông được. Em đừng ăn.\nEm sốt hừng hực cả đêm rồi. Không thể ăn mì gói được.\nHãy ăn cháo rồi uống thuốc đi.\nEm sẽ trả tiền cháo và thuốc…\nKhỏi đi.\n(윤진명) 밖에 나갈 때는 전원을 뽑아줄래?\n귀찮더라도 코드는 뽑고 나갔으면...\n음...이리 와, 라면 먹어\n안 돼, 넌 먹지 마\n(정예은) 됐어\n죽 값이랑 약값은...\n[후루룩 먹는다]\n[경쾌한 배경 음악 끝]\nWhen you go out, please turn it off.\nI know it's a hassle, but please unplug it.\nI know it's a hassle.\nHave some ramen.\nNo, you can't eat.\nYou were sick all night. You can't have ramen.Have some porridge and take your medicine.\nI'll pay for the porridge and the--\nIt's fine.","sourceUid":"merged-msoeqndo-21","sourceNo":537,"viRanges":[{"start":2922.54,"end":2953.033381}],"koRanges":[{"start":2832.220444,"end":2870.906982}]},{"id":444,"readerNo":445,"displayNo":138,"n":138,"kind":"sub","type":"merged","vi":"Chị Jin Myung mang cháo hết hạn\nở cửa hàng tiện lợi về đấy.\nMới hết hạn một ngày. Vẫn ăn được.","ko":"죽은 윤 선배가 편의점에서 유통기한 지난 거 들고 온 거고\n하루밖에 안 지난 거니까 괜찮아","en":"Jin-Myung brought porridge past the sell by date\nfrom the convenience store.\nOnly by one day. It's fine.","text":"Chị Jin Myung mang cháo hết hạn\nở cửa hàng tiện lợi về đấy.\nMới hết hạn một ngày. Vẫn ăn được.\n죽은 윤 선배가 편의점에서 유통기한 지난 거 들고 온 거고\n하루밖에 안 지난 거니까 괜찮아\nJin-Myung brought porridge past the sell by date\nfrom the convenience store.\nOnly by one day. It's fine.","sourceUid":"merged-msok6ro1-25","sourceNo":803,"viRanges":[{"start":2953.033381,"end":2960.858633}],"koRanges":[{"start":2870.906982,"end":2882.88408}]},{"id":445,"readerNo":446,"displayNo":139,"n":139,"kind":"sub","type":"merged","vi":"Bọn chị có sẵn thuốc ở nhà.\nEm xin lỗi chuyện hôm qua.\nĐúng đấy. Túi của chị có tội tình gì?\nGhét chị thì ghét, đừng giận lây sang nó chứ.","ko":"(정예은) 밤새 끙끙 앓아 댄 주제에 라면이 말이 되냐?\n약은 원래 있던 거니까\n어젠 죄송해요\n죽 먹고 약 먹어\n그래, 가방이 무슨 죄냐?\n번거롭겠지만\n죄는 미워해도 가방은 미워하지 말아야지","en":"We already had the medicine.\nI'm sorry about yesterday.\nRight. What did my bag ever do?\nYou can hate me, but you can't hate the bag.","text":"Bọn chị có sẵn thuốc ở nhà.\nEm xin lỗi chuyện hôm qua.\nĐúng đấy. Túi của chị có tội tình gì?\nGhét chị thì ghét, đừng giận lây sang nó chứ.\n(정예은) 밤새 끙끙 앓아 댄 주제에 라면이 말이 되냐?\n약은 원래 있던 거니까\n어젠 죄송해요\n죽 먹고 약 먹어\n그래, 가방이 무슨 죄냐?\n번거롭겠지만\n죄는 미워해도 가방은 미워하지 말아야지\nWe already had the medicine.\nI'm sorry about yesterday.\nRight. What did my bag ever do?\nYou can hate me, but you can't hate the bag.","sourceUid":"merged-msokchog-27","sourceNo":551,"viRanges":[{"start":2960.858633,"end":2971.356828}],"koRanges":[{"start":2882.88408,"end":2891.959999}]},{"id":446,"readerNo":447,"displayNo":140,"n":140,"kind":"sub","type":"merged","vi":"Đúng đấy.\nLần sau, em nên ném người. Đây.","ko":"(강이나) 그래...\n다음엔 사람을 집어 던져\n(정예은) 자...","en":"Right.\nNext time, just throw someone. Here.","text":"Đúng đấy.\nLần sau, em nên ném người. Đây.\n(강이나) 그래...\n다음엔 사람을 집어 던져\n(정예은) 자...\nRight.\nNext time, just throw someone. Here.","sourceUid":"merged-msoknhf7-35","sourceNo":815,"viRanges":[{"start":2971.356828,"end":2976.198189}],"koRanges":[{"start":2891.959999,"end":2898.810431}]},{"id":447,"readerNo":448,"displayNo":141,"n":141,"kind":"sub","type":"ko","vi":"[Nhạc chủ đề sôi động bắt đầu]","ko":"[경쾌한 테마 음악 시작]","en":"[Upbeat theme music starts]","text":"[Nhạc chủ đề sôi động bắt đầu]\n[경쾌한 테마 음악 시작]\n[Upbeat theme music starts]","sourceUid":"ko-mshaf168-1614","sourceNo":838,"viRanges":[],"koRanges":[]},{"id":448,"readerNo":449,"displayNo":142,"n":142,"kind":"sub","type":"merged","vi":"Nếu em không hài lòng điều gì thì hãy nói ra ngay.\nĐừng âm thầm giữ bực tức trong lòng.\nEm xin lỗi.\nChị nói không phải vì muốn em xin lỗi.\n[Chạm vào thùng rác]\n[Nhạc nền sôi động bắt đầu]\n[Húp xì xụp và ăn]","ko":"맘에 안 드는 게 있으면 그때그때 말해\n혼자 끙끙대면서 부풀리지 말고\n죄송해요\n미안하라고 하는 말이 아니라\n[쓰레기통 툭툭 친다]\n[경쾌한 배경 음악 시작]\n[후루룩 먹는다]","en":"If you don't like something, you can say it.\nI'm sorry.\nDon't let it build up inside you.\nI'm not saying it so you apologize.\n[Tap on the trash can]\n[Upbeat background music starts]\n[Slurps and eats]","text":"Nếu em không hài lòng điều gì thì hãy nói ra ngay.\nĐừng âm thầm giữ bực tức trong lòng.\nEm xin lỗi.\nChị nói không phải vì muốn em xin lỗi.\n[Chạm vào thùng rác]\n[Nhạc nền sôi động bắt đầu]\n[Húp xì xụp và ăn]\n맘에 안 드는 게 있으면 그때그때 말해\n혼자 끙끙대면서 부풀리지 말고\n죄송해요\n미안하라고 하는 말이 아니라\n[쓰레기통 툭툭 친다]\n[경쾌한 배경 음악 시작]\n[후루룩 먹는다]\nIf you don't like something, you can say it.\nI'm sorry.\nDon't let it build up inside you.\nI'm not saying it so you apologize.\n[Tap on the trash can]\n[Upbeat background music starts]\n[Slurps and eats]","sourceUid":"merged-msokf1hk-29","sourceNo":811,"viRanges":[{"start":3000.758733,"end":3017.088166}],"koRanges":[{"start":2923.915007,"end":2939.837365}]},{"id":449,"readerNo":450,"displayNo":143,"n":143,"kind":"sub","type":"merged","vi":"Tôi cứ tưởng chỉ mình tôi e dè xung quanh.\nKhi ở chung với người lạ, thể nào cũng sẽ có\nnhiều điều không vừa ý.\nĐôi khi em phải nhẫn nhịn,\nnhưng khi cần nói thì phải nói. Sao?\nChị nói ngang hàng từ khi nào vậy?\nChị bỏ kính ngữ được chứ?\nVâng, tất nhiên rồi ạ. Em nói đi.","ko":"생판 모르는 사람들끼리 한 공간에서 사는데...\n맘에 안 드는 일이 한두 개야?\n참기도 해야겠지만... 왜?\n필요한 말은 꼭 하라고\n언제부터 반말하기로 했어?\n반말해도 되지? 네, 그럼요 너 말해봐","en":"When total strangers live together, you can't like everything.\nSometimes you have to put up with something,\nyou need to be able to say what you have to say. What?\nSince when did you talk to her informally?\nIs that okay? Yes, of course. Tell me.","text":"Tôi cứ tưởng chỉ mình tôi e dè xung quanh.\nKhi ở chung với người lạ, thể nào cũng sẽ có\nnhiều điều không vừa ý.\nĐôi khi em phải nhẫn nhịn,\nnhưng khi cần nói thì phải nói. Sao?\nChị nói ngang hàng từ khi nào vậy?\nChị bỏ kính ngữ được chứ?\nVâng, tất nhiên rồi ạ. Em nói đi.\n생판 모르는 사람들끼리 한 공간에서 사는데...\n맘에 안 드는 일이 한두 개야?\n참기도 해야겠지만... 왜?\n필요한 말은 꼭 하라고\n언제부터 반말하기로 했어?\n반말해도 되지? 네, 그럼요 너 말해봐\nWhen total strangers live together, you can't like everything.\nSometimes you have to put up with something,\nyou need to be able to say what you have to say. What?\nSince when did you talk to her informally?\nIs that okay? Yes, of course. Tell me.","sourceUid":"merged-msq6izo6-46","sourceNo":824,"viRanges":[{"start":3017.088166,"end":3042.708483}],"koRanges":[{"start":2939.837365,"end":2963.052241}]},{"id":450,"readerNo":451,"displayNo":144,"n":144,"kind":"sub","type":"merged","vi":"Em không vừa ý điều gì? Em tưởng các chị biết tuốt à?\nBọn chị không thể biết đâu. Không có à?\nVậy chị nói trước nhé. Em đánh máy rất mạnh.\nPhòng chị nghe thấy hết. Vậy ạ?\nTôi cứ tưởng có nói ra cũng không ích gì.","ko":"뭐가 마음에 안 드는지, 말 안 해도 다 알 거 같지?\n절대 모른다 너...없어?\n그럼 나 먼저 한다. 너 워드 칠 때 너무 세게 쳐.\n우리 방까지 다 들려 아, 그래요?","en":"What did you not like? You think I'd know?\nWe never know. Isn't there anything?\nThen I'll go first. You type really loud.\nI can hear it from my room. Really?","text":"Em không vừa ý điều gì? Em tưởng các chị biết tuốt à?\nBọn chị không thể biết đâu. Không có à?\nVậy chị nói trước nhé. Em đánh máy rất mạnh.\nPhòng chị nghe thấy hết. Vậy ạ?\nTôi cứ tưởng có nói ra cũng không ích gì.\n뭐가 마음에 안 드는지, 말 안 해도 다 알 거 같지?\n절대 모른다 너...없어?\n그럼 나 먼저 한다. 너 워드 칠 때 너무 세게 쳐.\n우리 방까지 다 들려 아, 그래요?\nWhat did you not like? You think I'd know?\nWe never know. Isn't there anything?\nThen I'll go first. You type really loud.\nI can hear it from my room. Really?","sourceUid":"merged-msq6huj0-45","sourceNo":575,"viRanges":[{"start":3042.708483,"end":3058.849254}],"koRanges":[{"start":2963.052241,"end":2981.978005}]},{"id":451,"readerNo":452,"displayNo":145,"n":145,"kind":"sub","type":"merged","vi":"Em sẽ chú ý hơn. Nhưng mà… Sao nào?\nLúc chị gọi điện với bạn trai, em cũng nghe thấy hết. Thật á?\nCác chị cũng vậy à?\n\"Ứ ừ. Bé Ye Eun mún ăn bánh xếp.\"\nEm nói thế bao giờ?","ko":"주의할게요. 근데요... - 응\n선배님, 남자친구랑 통화하는 소리도 다 들려요. 진짜? 진짜야?\n‘으으응, 예은이 만두 먹고 시포’\n아, 내가 언제?","en":"I'll watch it. But... -Yes?\nI hear you talking to your boyfriend on your phone too. Really?\nDo you hear it?\n\"Ye-Eun wants dumplings.\"\nWhen did I do that?","text":"Em sẽ chú ý hơn. Nhưng mà… Sao nào?\nLúc chị gọi điện với bạn trai, em cũng nghe thấy hết. Thật á?\nCác chị cũng vậy à?\n\"Ứ ừ. Bé Ye Eun mún ăn bánh xếp.\"\nEm nói thế bao giờ?\n주의할게요. 근데요... - 응\n선배님, 남자친구랑 통화하는 소리도 다 들려요. 진짜? 진짜야?\n‘으으응, 예은이 만두 먹고 시포’\n아, 내가 언제?\nI'll watch it. But... -Yes?\nI hear you talking to your boyfriend on your phone too. Really?\nDo you hear it?\n\"Ye-Eun wants dumplings.\"\nWhen did I do that?","sourceUid":"merged-msoppk60-45","sourceNo":840,"viRanges":[{"start":3058.849254,"end":3077.259594}],"koRanges":[{"start":2981.978005,"end":2999.150337}]},{"id":452,"readerNo":453,"displayNo":146,"n":146,"kind":"sub","type":"merged","vi":"\"Anh iu mua cho bé đi.\" Chị đừng nói nữa!\nEm đừng vừa xả nước vừa tiểu nhé.\nTốn tiền nước lắm. Vâng. Đúng rồi.\nEm đi nặng hơi lâu đấy. Chuyện đó thì…\nChị đừng vào nhà vệ sinh lúc em đang tắm nhé.","ko":"‘오빠야가 사다주라, 으응?’ 아, 하지마아 진짜! 어우...\n너 오줌 눌 때 물 틀어 놓는 거 하지 마\n물세 많이 나와. 네\n아! 너 똥 너무 오래 싸\n그건... 강 언니도, 나 샤워할 때 들어오는 거 그거 하지 마세요","en":"\"Can you bring some, honey?\" Don't!\nDon't run the water in the sink when you pee.\nThe water bill gets high. Okay. Right.\nYou take way too long when you poop. That's...\nPlease don't come in when I'm showering.","text":"\"Anh iu mua cho bé đi.\" Chị đừng nói nữa!\nEm đừng vừa xả nước vừa tiểu nhé.\nTốn tiền nước lắm. Vâng. Đúng rồi.\nEm đi nặng hơi lâu đấy. Chuyện đó thì…\nChị đừng vào nhà vệ sinh lúc em đang tắm nhé.\n‘오빠야가 사다주라, 으응?’ 아, 하지마아 진짜! 어우...\n너 오줌 눌 때 물 틀어 놓는 거 하지 마\n물세 많이 나와. 네\n아! 너 똥 너무 오래 싸\n그건... 강 언니도, 나 샤워할 때 들어오는 거 그거 하지 마세요\n\"Can you bring some, honey?\" Don't!\nDon't run the water in the sink when you pee.\nThe water bill gets high. Okay. Right.\nYou take way too long when you poop. That's...\nPlease don't come in when I'm showering.","sourceUid":"merged-msopzfz9-49","sourceNo":849,"viRanges":
