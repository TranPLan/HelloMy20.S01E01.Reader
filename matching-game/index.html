ourceNo":811,"displayNo":142,"vi":"Nếu em không hài lòng điều gì thì hãy nói ra ngay.\nĐừng âm thầm giữ bực tức trong lòng.\nEm xin lỗi.\nChị nói không phải vì muốn em xin lỗi.\n[Chạm vào thùng rác]\n[Nhạc nền sôi động bắt đầu]\n[Húp xì xụp và ăn]","ko":"맘에 안 드는 게 있으면 그때그때 말해\n혼자 끙끙대면서 부풀리지 말고\n죄송해요\n미안하라고 하는 말이 아니라\n[쓰레기통 툭툭 친다]\n[경쾌한 배경 음악 시작]\n[후루룩 먹는다]","en":"If you don't like something, you can say it.\nI'm sorry.\nDon't let it build up inside you.\nI'm not saying it so you apologize.\n[Tap on the trash can]\n[Upbeat background music starts]\n[Slurps and eats]","start":2923.915007,"end":2939.837365,"viStart":3000.758733,"viEnd":3017.088166,"koStart":2923.915007,"koEnd":2939.837365,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3000.758733,"end":3017.088166},"koRange":{"start":2923.915007,"end":2939.837365}},{"id":143,"sourceUid":"merged-msq6izo6-46","sourceNo":143,"originalSourceNo":824,"displayNo":143,"vi":"Tôi cứ tưởng chỉ mình tôi e dè xung quanh.\nKhi ở chung với người lạ, thể nào cũng sẽ có\nnhiều điều không vừa ý.\nĐôi khi em phải nhẫn nhịn,\nnhưng khi cần nói thì phải nói. Sao?\nChị nói ngang hàng từ khi nào vậy?\nChị bỏ kính ngữ được chứ?\nVâng, tất nhiên rồi ạ. Em nói đi.","ko":"생판 모르는 사람들끼리 한 공간에서 사는데...\n맘에 안 드는 일이 한두 개야?\n참기도 해야겠지만... 왜?\n필요한 말은 꼭 하라고\n언제부터 반말하기로 했어?\n반말해도 되지? 네, 그럼요 너 말해봐","en":"When total strangers live together, you can't like everything.\nSometimes you have to put up with something,\nyou need to be able to say what you have to say. What?\nSince when did you talk to her informally?\nIs that okay? Yes, of course. Tell me.","start":2939.837365,"end":2963.052241,"viStart":3017.088166,"viEnd":3042.708483,"koStart":2939.837365,"koEnd":2963.052241,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3017.088166,"end":3042.708483},"koRange":{"start":2939.837365,"end":2963.052241}},{"id":144,"sourceUid":"merged-msq6huj0-45","sourceNo":144,"originalSourceNo":575,"displayNo":144,"vi":"Em không vừa ý điều gì? Em tưởng các chị biết tuốt à?\nBọn chị không thể biết đâu. Không có à?\nVậy chị nói trước nhé. Em đánh máy rất mạnh.\nPhòng chị nghe thấy hết. Vậy ạ?\nTôi cứ tưởng có nói ra cũng không ích gì.","ko":"뭐가 마음에 안 드는지, 말 안 해도 다 알 거 같지?\n절대 모른다 너...없어?\n그럼 나 먼저 한다. 너 워드 칠 때 너무 세게 쳐.\n우리 방까지 다 들려 아, 그래요?","en":"What did you not like? You think I'd know?\nWe never know. Isn't there anything?\nThen I'll go first. You type really loud.\nI can hear it from my room. Really?","start":2963.052241,"end":2981.978005,"viStart":3042.708483,"viEnd":3058.849254,"koStart":2963.052241,"koEnd":2981.978005,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3042.708483,"end":3058.849254},"koRange":{"start":2963.052241,"end":2981.978005}},{"id":145,"sourceUid":"merged-msoppk60-45","sourceNo":145,"originalSourceNo":840,"displayNo":145,"vi":"Em sẽ chú ý hơn. Nhưng mà… Sao nào?\nLúc chị gọi điện với bạn trai, em cũng nghe thấy hết. Thật á?\nCác chị cũng vậy à?\n\"Ứ ừ. Bé Ye Eun mún ăn bánh xếp.\"\nEm nói thế bao giờ?","ko":"주의할게요. 근데요... - 응\n선배님, 남자친구랑 통화하는 소리도 다 들려요. 진짜? 진짜야?\n‘으으응, 예은이 만두 먹고 시포’\n아, 내가 언제?","en":"I'll watch it. But... -Yes?\nI hear you talking to your boyfriend on your phone too. Really?\nDo you hear it?\n\"Ye-Eun wants dumplings.\"\nWhen did I do that?","start":2981.978005,"end":2999.150337,"viStart":3058.849254,"viEnd":3077.259594,"koStart":2981.978005,"koEnd":2999.150337,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3058.849254,"end":3077.259594},"koRange":{"start":2981.978005,"end":2999.150337}},{"id":146,"sourceUid":"merged-msopzfz9-49","sourceNo":146,"originalSourceNo":849,"displayNo":146,"vi":"\"Anh iu mua cho bé đi.\" Chị đừng nói nữa!\nEm đừng vừa xả nước vừa tiểu nhé.\nTốn tiền nước lắm. Vâng. Đúng rồi.\nEm đi nặng hơi lâu đấy. Chuyện đó thì…\nChị đừng vào nhà vệ sinh lúc em đang tắm nhé.","ko":"‘오빠야가 사다주라, 으응?’ 아, 하지마아 진짜! 어우...\n너 오줌 눌 때 물 틀어 놓는 거 하지 마\n물세 많이 나와. 네\n아! 너 똥 너무 오래 싸\n그건... 강 언니도, 나 샤워할 때 들어오는 거 그거 하지 마세요","en":"\"Can you bring some, honey?\" Don't!\nDon't run the water in the sink when you pee.\nThe water bill gets high. Okay. Right.\nYou take way too long when you poop. That's...\nPlease don't come in when I'm showering.","start":2999.150337,"end":3018.449084,"viStart":3077.259594,"viEnd":3095.493603,"koStart":2999.150337,"koEnd":3018.449084,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3077.259594,"end":3095.493603},"koRange":{"start":2999.150337,"end":3018.449084}},{"id":147,"sourceUid":"merged-msoq7iau-58","sourceNo":147,"originalSourceNo":597,"displayNo":147,"vi":"Coi nó kìa!\nEm cười ra tiếng được không? Nhìn em đáng sợ lắm.\nĂn đi. Ăn thôi.Cảm ơn chị.\nTôi cứ tưởng chỉ mình tôi chịu đựng.\nTôi cứ tưởng chỉ mình tôi thấy khó chịu.","ko":"어쭈...너 웃을 때 소리 좀 내 음침해 보여\n먹어...먹자, 먹자...\n진짜 감사합니다\n(유은재) 나만 참는 줄 알았다\n나만 불편한 줄 알았다","en":"Look at you!\nMake some noise when you laugh. You look scary.\nEat. Let's eat. Thank you.\nI thought I was the only one having to put up with things.\nI thought I was the only one walking on eggshells.","start":3018.449084,"end":3073,"viStart":3095.493603,"viEnd":3151.703773,"koStart":3018.449084,"koEnd":3073,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3095.493603,"end":3151.703773},"koRange":{"start":3018.449084,"end":3073}},{"id":148,"sourceUid":"merged-msoqpjj8-65","sourceNo":148,"originalSourceNo":602,"displayNo":148,"vi":"Tôi sợ bị ghét nếu nói gì đó.\nTự suy diễn mình sẽ bị cười cợt.\nBây giờ nghĩ lại,\ncó lẽ tôi đã nghĩ mình khác mọi người.\nTôi nghĩ người khác vô duyên, bạo lực.\nvà vô tâm hơn mình.","ko":"나만 눈치 보는 줄 알았다\n말해도 소용없을 거라는 생각\n말하면 미움받을 거라는 두려움\n비웃을 거라는 지레짐작\n그러고 보면...\n나는 다른 사람들이 나와 다르다고 생각했다\n나보다 무례하고\n난폭하고\n무신경할 거라고 생각했다","en":"I thought it wouldn't change anything even if I said something.\nI was afraid I'd be hated if I said something.\nI assumed I'd be laughed at.\nNow that I think of it,\nI thought the others were different than me.\nI thought the others were rude, violent,\nand insensitive.","start":3073,"end":3099.092379,"viStart":3151.703773,"viEnd":3177.964038,"koStart":3073,"koEnd":3099.092379,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3151.703773,"end":3177.964038},"koRange":{"start":3073,"end":3099.092379}},{"id":149,"sourceUid":"merged-msoq6q0r-55","sourceNo":149,"originalSourceNo":857,"displayNo":149,"vi":"[Cười]\n[Âm thanh gõ bàn phím]","ko":"[웃는다]\n[키보드 두드리는 소리]","en":"[Laughs]\n[Keyboard tapping sound]","start":3194.83,"end":3196.03,"viStart":3194.83,"viEnd":3196.03,"koStart":3194.83,"koEnd":3196.03,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":150,"sourceUid":"merged-msoqt22n-71","sourceNo":150,"originalSourceNo":611,"displayNo":150,"vi":"LÚC RA NGOÀI, EM NHỚ RÚT ĐIỆN NHÉ.\nTôi đã quá kiêu ngạo.\nHọ cũng giống tôi.\nHọ cũng chỉ là con người như tôi.\nHọ bất an giống tôi.\nHọ cũng do dự như tôi.","ko":"밖에 나갈 때는 전원을 뽑아줄래?\n나는 오만했다\n나와 같다\n나와 같은 사람이다\n나만큼 불안하고\n나만큼 머뭇대고","en":"PLEASE UNPLUG IT BEFORE YOU GO OUT.\nThey are the same.\nThey're just people. Just like me.\nI was arrogant.\nThey're as nervous as me.\nThey hesitate just as much as I do.","start":3099.092379,"end":3123.712381,"viStart":3177.964038,"viEnd":3201.273652,"koStart":3099.092379,"koEnd":3123.712381,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3177.964038,"end":3201.273652},"koRange":{"start":3099.092379,"end":3123.712381}},{"id":151,"sourceUid":"merged-msq6fhcg-43","sourceNo":151,"originalSourceNo":617,"displayNo":151,"vi":"Nói vậy mà nghe được.\nTớ thắng rồi mà. Anh gì ơi!\nCặp của anh cứ đập vào tôi. Tôi xin lỗi.\nThật sự xin lỗi cô. Xin lỗi cô nhé.","ko":"(남학생) 야, 말을 되는 소릴해 그건 아니지...\n밥 먹었지...\n내가 냈잖아...\n저기요\n저기... 가방이 자꾸 쳐서\n죄송합니다, 죄송합니다 진짜 죄송합니다, 죄송합니다","en":"I'm so sorry. Stop being ridiculous.\nBecause I won. Excuse me.\nYour bag is hitting me. I'm sorry.","start":3123.712381,"end":3144.770171,"viStart":3201.273652,"viEnd":3222.934,"koStart":3123.712381,"koEnd":3144.770171,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3201.273652,"end":3222.934},"koRange":{"start":3123.712381,"end":3144.770171}},{"id":152,"sourceUid":"merged-msos0xu1-82","sourceNo":152,"originalSourceNo":886,"displayNo":152,"vi":"Họ cũng hiền lành như tôi.\nĐây này. Là bút này đúng không?\nAnh trả em rồi đấy nhé.\nVâng, cảm ơn anh.\nEm…tên gì vậy?Em…","ko":"(유은재) 나만큼은 착한 사람\n이거! 아... 이거 맞지?\n나 분명히 돌려줬다\n네, 고맙습니다\n너...이름이 뭐냐?","en":"They're as nice as me.\nHere. It's this one, right?\nI gave it back to you.\nYes, thank you.\nWhat's your name?","start":3144.770171,"end":3195.558017,"viStart":3222.934217,"viEnd":3276.56675,"koStart":3144.770171,"koEnd":3195.558017,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3222.934217,"end":3276.56675},"koRange":{"start":3144.770171,"end":3195.558017}},{"id":153,"sourceUid":"merged-msosa1g1-88","sourceNo":153,"originalSourceNo":894,"displayNo":153,"vi":"Mắc cười quá đi!\nThú vị ghê. - Không phải như vậy đâu.\nĐã bảo là không phải mà.\nEun Jae à, mau lại đây.","ko":"아... 진짜 웃겨... 진짜 웃겨\n아... 진짜 웃겨...\n일도 아니야, 그런 거는...\n야, 일도 아니라니까\n어, 은재야 이리 와... 이리 와","en":"Well...That's so funny!\n-That's so funny. -No, it's not like that at all.\nIt's not like that!\nCome here, Eun-Jae.","start":3218.246506,"end":3232.597331,"viStart":3296.422492,"viEnd":3310.869154,"koStart":3218.246506,"koEnd":3232.597331,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3296.422492,"end":3310.869154},"koRange":{"start":3218.246506,"end":3232.597331}},{"id":154,"sourceUid":"merged-msos19lv-83","sourceNo":154,"originalSourceNo":891,"displayNo":154,"vi":"[Nhạc chủ đề lạc quan kết thúc]\n[cười]","ko":"[경쾌한 테마 음악 끝]\n[깔깔 웃는다]","en":"[Upbeat theme music ends]\n[laughter]","start":3353.73,"end":3355.06,"viStart":3353.73,"viEnd":3355.06,"koStart":3353.73,"koEnd":3355.06,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":155,"sourceUid":"merged-msostzov-94","sourceNo":155,"originalSourceNo":636,"displayNo":155,"vi":"Chào em. Em chào chị.\nChị Song Ji Won mới đi tình nguyện về.\nLại đây. Uống với bọn chị.\nEm với Ye Eun chiến nhau dữ lắm hả?\nTại chị không có nhà đấy.","ko":"아! 안녕 안녕하세요\n그 봉활 갔던 애, 송지원\n이리 와, 이리 와\n한잔해\n정 씨랑 한바탕 했다며?\n미안하다, 이게 다 내가 자리를 비워서 그런 거야","en":"Hi. Hello.\nThe one that went to volunteer. It's Ji-Won.\nCome on, have a drink.\nI heard you had a big thing with Ye-Eun.\nI'm sorry.\nIt's all because I wasn't here.","start":3232.597331,"end":3252.777683,"viStart":3310.869154,"viEnd":3330.689851,"koStart":3232.597331,"koEnd":3252.777683,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3310.869154,"end":3330.689851},"koRange":{"start":3232.597331,"end":3252.777683}},{"id":156,"sourceUid":"ko-mshaf168-1678","sourceNo":156,"originalSourceNo":902,"displayNo":156,"vi":"[Mở lon]","ko":"[캔을 딴다]","en":"[Opens a can]","start":3376.83,"end":3377.93,"viStart":3376.83,"viEnd":3377.93,"koStart":3376.83,"koEnd":3377.93,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":157,"sourceUid":"merged-msot0msw-99","sourceNo":157,"originalSourceNo":642,"displayNo":157,"vi":"Mấy người này chỉ to xác thôi.\nKhông mở tiệc chào đón em luôn nhỉ?\nCó ma mới đến thì nên nhậu một bữa chứ.\nRượu vào mới thành huynh đệ.\nVà hỏi thăm về gia đình em ấy.\nEm có anh trai không? Không ạ.","ko":"이것들이 나이만 먹었지 철이 없어요\n환영회도 안 했다며?\n새사람이 들어왔으면...\n술부터 먹여가면서 친목을 도모했어야지\n호구조사도 좀 하고\n오빠 있어? 아뇨","en":"They're all just big kids.\nThey didn't even throw you a welcome party.\nWhen a new person moves in, you're supposed to drink together.\nThat's how you become friends.\nAnd ask about her life.\nDo you have a big brother? No.","start":3252.777683,"end":3268.134591,"viStart":3330.689851,"viEnd":3345.61159,"koStart":3252.777683,"koEnd":3268.134591,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3330.689851,"end":3345.61159},"koRange":{"start":3252.777683,"end":3268.134591}},{"id":158,"sourceUid":"merged-msot5b07-103","sourceNo":158,"originalSourceNo":649,"displayNo":158,"vi":"Vậy chắc có chú nhỉ?\nChú út bao nhiêu tuổi rồi?\nBốn mươi mấy rồi ạ.\nNhìn em ấy kìa.\nCứ tưởng chỉ biết uống trà thôi chứ.","ko":"삼촌은 있지? 막내 삼촌 몇 살이야? 예?\n마흔 몇 살인데... 너 나가!\n(송지원) 아, 신이시여... 캬...\n아휴, 얘 봐라 보리차만 먹게 생겨가지고는","en":"You have an uncle though, right?\nHow old is your youngest uncle?\nForty something. Just leave!\nLook at her.\nI didn't think she'd be a drinker.","start":3268.134591,"end":3290.081661,"viStart":3345.61159,"viEnd":3370.034732,"koStart":3268.134591,"koEnd":3290.081661,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3345.61159,"end":3370.034732},"koRange":{"start":3268.134591,"end":3290.081661}},{"id":159,"sourceUid":"merged-msotdk31-108","sourceNo":159,"originalSourceNo":654,"displayNo":159,"vi":"Em hỏi chị chuyện này được chứ? Em lượn đi! Chuyện gì?\nChính trị, kinh tế, xã hội, văn hóa. Cứ tự nhiên hỏi.\nVề bạn trọ cũ của các chị.\nSao chị ấy chuyển đi vậy ạ?\nEm không nên biết chuyện đó sao?","ko":"저, 뭐하나 물어봐도 돼요? 뭐?\n정치, 경제, 사회, 문화, 다 물어봐\n전에 살던 하우스메이트요\n왜 나간 거예요?\n제가 알면 안 되는 이윤가요?","en":"Can I ask you something? What is it?\nPolitics, economics, current events, or culture. You can ask anything.\nIt's about your old housemate.\nWhy did she move out?\nAm I not supposed to know?","start":3290.081661,"end":3312.02845,"viStart":3370.034732,"viEnd":3389.675928,"koStart":3290.081661,"koEnd":3312.02845,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3370.034732,"end":3389.675928},"koRange":{"start":3290.081661,"end":3312.02845}},{"id":161,"sourceUid":"ko-mshaf168-1700","sourceNo":161,"originalSourceNo":924,"displayNo":161,"vi":"[Nhạc nền sôi động bắt đầu]","ko":"[경쾌한 배경 음악 시작]","en":"[Upbeat background music starts]","start":3436.63,"end":3437.6,"viStart":3436.63,"viEnd":3437.6,"koStart":3436.63,"koEnd":3437.6,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":162,"sourceUid":"merged-msotl4fx-115","sourceNo":162,"originalSourceNo":933,"displayNo":162,"vi":"Vì sao em hỏi chuyện này? Vì…\nmỗi khi nhắc đến chuyện đó, mọi người đều lảng đi,\nvà rời khỏi vị trí.\nEm đoán là có lý do gì đó.\nThôi được rồi. Có gì to tát đâu. Cậu ấy có bầu.\nBị người nhà lôi về.","ko":"그게 왜 궁금한데? 그게...\n자꾸 그 얘기만 나오면 눈치 보고...\n자리 피하고...\n분명히 이유가 있는 것 같은데\n아 됐어, 별것도 아닌 걸 갖고\n임신해 갖고 집에 끌려간 거야","en":"Why do you want to know that? Well...\nwhenever it comes up, everyone looks away.\nAnd then you get up.\nIt seems like there was a reason.\nIt's not a big deal. She got pregnant. She was dragged home.","start":3312.02845,"end":3339.151927,"viStart":3389.675928,"viEnd":3417.88781,"koStart":3312.02845,"koEnd":3339.151927,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3389.675928,"end":3417.88781},"koRange":{"start":3312.02845,"end":3339.151927}},{"id":163,"sourceUid":"ko-mshaf168-1711","sourceNo":163,"originalSourceNo":935,"displayNo":163,"vi":"[Nhạc nền sôi động kết thúc]","ko":"[경쾌한 배경 음악 끝]","en":"[Upbeat background music ends]","start":3471.96,"end":3472.83,"viStart":3471.96,"viEnd":3472.83,"koStart":3471.96,"koEnd":3472.83,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":164,"sourceUid":"merged-msotrz41-120","sourceNo":164,"originalSourceNo":943,"displayNo":164,"vi":"Sao cơ? Có quan hệ thì phải biết tránh thai đấy. Biết chưa? Vâng.\nChuyện này chẳng hay ho gì.\nNếu đồn ra ngoài thì không hay.\nCậu ấy còn học trường mình nữa.\nThì ra là vì vậy. Lẽ nào em nghĩ bọn chị bắt nạt người ta?","ko":"예? 너 섹스할 땐 꼬옥 피임해라\n어! 섹스...\n아니... 뭐 좋은 얘기도 아니고...\n소문나면 그렇잖아\n우리랑 같은 학교기도 하고\n아...\n그래서 나만 보면 피해 다녔구나","en":"What? When you have sex, use birth control. Okay? Okay.\nIt's not really a good story.\nWe wouldn't want to spread her story. She goes to the same school too.\nSo that's why.\nYou didn't think we bullied her, did you?","start":3339.151927,"end":3360.182208,"viStart":3417.88781,"viEnd":3442.527,"koStart":3339.151927,"koEnd":3360.182208,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3417.88781,"end":3442.527},"koRange":{"start":3339.151927,"end":3360.182208}},{"id":165,"sourceUid":"merged-mspnsauj-7","sourceNo":165,"originalSourceNo":952,"displayNo":165,"vi":"Đâu có.\nNó mới khựng lại kìa. Đúng.\nEm nghĩ vậy thật nhỉ?\nChắc em nghĩ bọn chị xì xào nói xấu sau lưng phải không? Vâng.\nSẵn sự việc này, chúng ta hãy trải lòng với nhau đi.","ko":"설마...우리가 왕따시켜가지고 나간 줄 알았어?\n아뇨. 얘 잠깐 멈칫했지?\n너 진짜 그렇게 생각했구나? 네\n자기들끼리 눈을 움찔움찔 속닥속닥 그랬나 보지, 그렇지?\n자, 그런 의미에서\n우리 고백의 시간을 가져봅시다","en":"No. She hesitated. Yes.\nYou really thought it, didn't you?\n\"They must have whispered and acted all weird.\" Right? Yes.\nSpeaking of which, let's have a little confession time.","start":3360.182208,"end":3380.597564,"viStart":3442.527,"viEnd":3474.753558,"koStart":3360.182208,"koEnd":3380.597564,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3442.527,"end":3474.753558},"koRange":{"start":3360.182208,"end":3380.597564}},{"id":166,"sourceUid":"merged-mspo1vm9-11","sourceNo":166,"originalSourceNo":964,"displayNo":166,"vi":"Chị Jin Myung về rồi.\nChị ơi! Sao mấy đứa say dữ vậy?\nChị về muộn thế?\nChị ngồi đi.\nTiền bối đã về rồi.\nMấy đứa uống bao nhiêu rồi?","ko":"- 뭔 고백? - 숨겨왔던 나...의\n♪ 비밀 털어놓고 ♪\n♪ 부쩍 친해지기 ♪\n오 예!\n(정예은) 술 왔다\n언니...\n(윤진명) 다들 왜 이렇게 취한 거야?\n왜 인제 와...\n(정예은) 일단 빨리 앉아\n얼마나 마신 거야?","en":"There she is.\nHi! -Why are you so drunk?\nYou're so late.\nHave a seat.\nYou're here.\nHow much have you been drinking?","start":3380.597564,"end":3399.783226,"viStart":3474.753558,"viEnd":3488.025344,"koStart":3380.597564,"koEnd":3399.783226,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3474.753558,"end":3488.025344},"koRange":{"start":3380.597564,"end":3399.783226}},{"id":167,"sourceUid":"merged-mspodv4m-12","sourceNo":167,"originalSourceNo":965,"displayNo":167,"vi":"[Nhạc nền sôi động bắt đầu]\n[tiếng chó sủa]\n[Mở lon]","ko":"[경쾌한 배경 음악 시작]\n[개가 짖는다]\n[캔을 딴다]","en":"[Upbeat background music starts]\n[dog barks]\n[Opens a can]","start":3546.56,"end":3547.66,"viStart":3546.56,"viEnd":3547.66,"koStart":3546.56,"koEnd":3547.66,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":168,"sourceUid":"merged-mspofpmw-18","sourceNo":168,"originalSourceNo":691,"displayNo":168,"vi":"Bọn em đang bật mí những bí mật.\nChị cũng nhập cuộc đi.\nGiá mà chị có thời gian để tạo ra bí mật.\nMấy đứa kể những bí mật gì rồi?\nÚt ơi, tóm tắt cho chị ấy nghe.\nÀ…Chị Yi Na đang bắt cá hai tay.","ko":"지금 비밀 자폭 중\n선배도 하나 털어놔\n비밀 같은 거 만들 시간이나 있었으면 좋겠다\n이제까지 어떤 비밀이 나왔는데\n막내야, 브리핑해라!\n어...강 언니는 현재 양다리고요","en":"You tell us one too.\nI wish I had time to have secrets.\nWe've been telling our secrets.\nWhat sort of secrets did you tell so far?\nLittle one, brief her.\nWell...Yi-Na is two-timing right now.","start":3399.783226,"end":3422.918459,"viStart":3488.025344,"viEnd":3510.316436,"koStart":3399.783226,"koEnd":3422.918459,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3488.025344,"end":3510.316436},"koRange":{"start":3399.783226,"end":3422.918459}},{"id":169,"sourceUid":"merged-mspok9zu-21","sourceNo":169,"originalSourceNo":697,"displayNo":169,"vi":"Chị ấy không độ loa. Chỉ làm mắt thôi.\nChị Ye Eun từng nặng đến 63kg.\nVà chị Ji Won chưa từng có buổi hẹn hò thứ hai nào sau các lần xem mắt.","ko":"가슴 수술은 안 했고, 눈 수술만 했대요\n정 선배는. 63킬로까지 나간 적 있대요\n그리고 송 선배는...이제껏 소개팅에서...애프터를 받아 본 적이 없고요","en":"She didn't get a boob job done. Only her eyes.\nYe-Eun weighed 131 pounds once.\nAnd Ji-Won has never been on a second date after a blind date.","start":3422.918459,"end":3443.046945,"viStart":3510.316436,"viEnd":3529.833828,"koStart":3422.918459,"koEnd":3443.046945,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3510.316436,"end":3529.833828},"koRange":{"start":3422.918459,"end":3443.046945}},{"id":170,"sourceUid":"merged-msposgfm-25","sourceNo":170,"originalSourceNo":703,"displayNo":170,"vi":"Có hai kiểu bí mật.\nBí mật có thể bật mí\nvà bí mật chôn xuống mồ.\nEm bắt đầu uống rượu từ hồi lớp chín.\nNhững bí mật có thể kể ra ở nơi thế này không thật sự được coi là bí mật.","ko":"(유은재) 비밀에는 두 가지가 있다\n말할 수 있는 비밀과\n말할 수 없는 비밀\n나는...중 3 때부터 술을 마셨어요\n(유은재) 어차피 이런 자리에서 털어놓을 수 있는 비밀이란\n해도 그만 안 해도 그만인 그저 그런 이야기","en":"There are two types of secrets.\nThe ones you can tell,\nand the ones you can't.\nI've been drinking since ninth grade.\nThe secrets you can tell in a place like this are not really secrets.","start":3443.046945,"end":3461.147087,"viStart":3529.833828,"viEnd":3547.884397,"koStart":3443.046945,"koEnd":3461.147087,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3529.833828,"end":3547.884397},"koRange":{"start":3443.046945,"end":3461.147087}},{"id":171,"sourceUid":"merged-mspozp9p-30","sourceNo":171,"originalSourceNo":715,"displayNo":171,"vi":"Mọi người muốn nghe bí mật thật sự của mị không?\nGì mà xỉn dữ vậy bây?\nTôi có một bí mật tuyệt đối không thể nói ra.\nThật ra… em có thể nhìn thấy ma.\nTôi từng giết người.\nCái gì? Cậu nhìn thấy gì cơ? Ma. Thật á? Từ khi nào?\nTừ lâu rồi.","ko":"내 진짜 비밀을 말해줄까?\n얜 왜 이렇게 취했냐?\n(유은재) 나는 절대로 말할 수 없는 비밀이 하나 있다\n나 사실은...귀신 본다\n나는...사람을 죽였다\n엥? 뭐 본다고?\n귀신 진짜? 언제부터? 옛날부터","en":"Do you want to hear my real secret? Why is she so drunk?\nI have a secret I can never tell.\nActually...I see ghosts. I killed someone before.\nWhat? You see what? Ghosts. You do? Since when? Since forever.","start":3461.147087,"end":3494.97,"viStart":3547.884397,"viEnd":3581.506891,"koStart":3461.147087,"koEnd":3494.97,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3547.884397,"end":3581.506891},"koRange":{"start":3461.147087,"end":3494.97}},{"id":172,"sourceUid":"merged-mspp0n4c-33","sourceNo":172,"originalSourceNo":993,"displayNo":172,"vi":"[Nhạc nền sôi động kết thúc]\n[Nhạc chủ đề bắt đầu]\n[Nhạc chủ đề kết thúc]\n[âm thanh kỳ quái]\n[Nhạc nền sôi động bắt đầu]","ko":"[경쾌한 배경 음악 끝]\n[테마 음악 시작]\n[테마 음악 끝]\n[음산한 소리]\n[경쾌한 배경 음악 시작]","en":"[Upbeat background music ends]\n[Theme music starts]\n[Theme music ends]\n[eerie sound]\n[Upbeat background music starts]","start":3625.13,"end":3626.06,"viStart":3625.13,"viEnd":3626.06,"koStart":3625.13,"koEnd":3626.06,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":173,"sourceUid":"merged-mspw7ma9-3","sourceNo":173,"originalSourceNo":724,"displayNo":173,"vi":"Vậy sao bây giờ mới nói?\nThật ra là vì…Ngay bây giờ cũng có một con ở đằng kia.\nTôi từng giết người.\nVậy thì chắc là người chị đã giết lúc đó.\nCó một người mà chị rất muốn họ chết.\nNhững người này thật kỳ lạ.\nSao thế? Làm sao?","ko":"근데 왜 그걸 지금 얘기하는데?\n그게 사실은...지금 저기도 하나 있어\n(유은재) 나는...사람을 죽인 적이 있다. 아, 그러면...\n그때 내가 죽인 게 맞나 보다...\n난 죽었으면 하는 사람이 있는데...\n이 사람들...이상해. 어! 왜요? - 왜? 왜?","en":"Then why are you just saying it now?\nWell that's because...There's one right there.\nI killed someone before.\nMaybe I really killed someone.\nI have someone I want dead.\nThese people are weird.\nWhat is it? What's wrong with me?","start":3494.97,"end":3540.295934,"viStart":3581.506891,"viEnd":3615.151242,"koStart":3494.97,"koEnd":3540.295934,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3581.506891,"end":3615.151242},"koRange":{"start":3494.97,"end":3540.295934}},{"id":174,"sourceUid":"ko-mshaf169-1793","sourceNo":174,"originalSourceNo":1017,"displayNo":174,"vi":"[la hét]","ko":"[비명을 지른다]","en":"[screams]","start":3681.83,"end":3683.13,"viStart":3681.83,"viEnd":3683.13,"koStart":3681.83,"koEnd":3683.13,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":175,"sourceUid":"merged-mspwxc11-12","sourceNo":175,"originalSourceNo":733,"displayNo":175,"vi":"Rốt cuộc em nốc bao nhiêu calo vậy?\nMình điên thật rồi. Muốn chết quá! Đưa chị bàn chải với.\nJi Won à. Ji Won à, về phòng đi.\nJi Won à. Em buồn ngủ. Em buồn ngủ rồi.\nJi Won à. Một con gà là 2.100 calo…","ko":"도대체 몇 칼로리를 먹은 거야\n미쳤어... 죽음이야 죽음...\n(윤진명) 지원아...\n지원아 들어가서 자, 지원아!\n나 졸려...나...(윤진명) 지원아... 지원아\n(정예은) 치킨이 한 마리에 2,100칼로리","en":"What?\nHow many calories have I been eating?\nI need to die! Get me my toothbrush.\nJi-Won. Ji-Won, go to bed.\nJi-Won. I'm sleepy. I'm sleepy.\nJi-Won. I need to say something.","start":3540.295934,"end":3559.687565,"viStart":3540.295934,"viEnd":3559.687565,"koStart":3540.295934,"koEnd":3559.687565,"hasViAudio":false,"hasKoAudio":true,"viRange":null,"koRange":{"start":3540.295934,"end":3559.687565}},{"id":176,"sourceUid":"merged-mspwu4b7-10","sourceNo":176,"originalSourceNo":1029,"displayNo":176,"vi":"[Nhạc nền sôi động kết thúc]\n[Nhạc chủ đề bắt đầu]","ko":"[경쾌한 배경 음악 끝]\n[테마 음악 시작]","en":"[Upbeat background music ends]\n[Theme music starts]","start":3703.73,"end":3704.66,"viStart":3703.73,"viEnd":3704.66,"koStart":3703.73,"koEnd":3704.66,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":177,"sourceUid":"merged-mspwz2em-14","sourceNo":177,"originalSourceNo":1036,"displayNo":177,"vi":"Bàn chải màu đỏ hay màu xanh?\nNhớ nặn kem đánh răng luôn.\nNhững người này thật sự kỳ lạ.","ko":"그중에 5분의 1을 먹었으니까\n그거 나누기를 해야지...\n아이 계산이 안 돼\n칫솔 줘\n빠아알간 칫솔 줄까? 파아란 칫솔 줄까?\n치약이나 묻혀줘\n이 사람들...\n진짜 이상해","en":"Your toothbrush?\nGet me some toothpaste.\nThese people are really weird.","start":3559.687565,"end":3581.205128,"viStart":3615.151242,"viEnd":3638.373,"koStart":3559.687565,"koEnd":3581.205128,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3615.151242,"end":3638.373},"koRange":{"start":3559.687565,"end":3581.205128}},{"id":178,"sourceUid":"merged-mspwzm54-17","sourceNo":178,"originalSourceNo":1039,"displayNo":178,"vi":"[Nhạc nền thô ráp bắt đầu]\n[Nhạc nền thô ráp kết thúc]\n[Nhạc chủ đề kết thúc]\n[Nhạc chủ đề vui vẻ bắt đầu]","ko":"[거친 배경 음악 시작]\n[거친 배경 음악 끝]\n[테마 음악 끝]\n[즐거운 테마 음악 시작]","en":"[Rough background music starts]\n[Rough background music ends]\n[Theme music ends]\n[Happy theme music starts]","start":3735.3,"end":3736.5,"viStart":3735.3,"viEnd":3736.5,"koStart":3735.3,"koEnd":3736.5,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":179,"sourceUid":"merged-mspx133x-21","sourceNo":179,"originalSourceNo":743,"displayNo":179,"vi":"Quy tắc quan trọng nhất ở Belle Epoque là gì?\nCấm đưa đàn ông vào nhà.\nChị tìm được nó ở ban công.\nNghĩa là có đàn ông vào nhà.\nNhưng sao nó lại ở trong túi x   arr.forEach((it,idx)=>{const rg=audioRange(it,side),div=document.createElement('div'),isMatched=state.matched.has(it.id);const audioOnly=side==='left'&&it.audioOnlyLeft;div.className='item '+(idx===sel?'selected ':'')+(isMatched?'good dim ':'')+(!audioOnly&&isKo(it[side])?'ko':'');const mainText=audioOnly?'<span class="audioBadge '+rg.lang+'">Audio cue</span>':esc(clean(it[side]));div.innerHTML=(side==='left'?'<span class="num">'+String(idx+1).padStart(2,'0')+'.</span>':'')+mainText+'<div class="meta">'+fmt(rg.start)+' → '+fmt(rg.end)+' · <span class="audioBadge '+rg.lang+'">'+rg.label+'</span></div>';const btn=document.createElement('button');btn.className='listenBtn '+rg.lang;btn.type='button';btn.textContent=rg.lang==='readko'?'Read KO':'Nghe';btn.onclick=(ev)=>{ev.stopPropagation();playSegment(it,side)};const meta=div.querySelector('.meta');if(meta)meta.appendChild(btn);div.onclick=()=>{if(side==='left')state.leftSel=idx;else state.rightSel=idx;render()};el.appendChild(div)})
}
function selected(side){const idx=side==='left'?state.leftSel:state.rightSel;if(idx===null||idx===undefined)return null;return side==='left'?state.left[idx]:state.right[idx]}
function match(){const l=selected('left'),r=selected('right');if(!l||!r)return setStatus('Bạn cần chọn 1 câu bên trái và 1 câu bên phải.');if(l.id===r.id){state.matched.add(l.id);setStatus('Đúng rồi! Điểm: <strong>'+state.matched.size+'/'+state.pairs.length+'</strong>')}else{setStatus('Chưa đúng. Thử lại nhé.')}render()}
function playSegment(item,side){if(!item)return setStatus('Bạn chưa chọn câu.');const rg=audioRange(item,side);if(rg.lang==='readko'){readKoText(item.ko,side==='left'?'Read KO bên trái':'Read KO bên phải');return}const a=audioEl(rg.lang);if(!a.src){if(item.ko)return readKoText(item.ko,'Không có audio, chuyển sang Read KO');return setStatus('Bạn chưa nạp audio '+rg.label+'.')}stopAudio();applyGameVolume(rg.lang);const off=parseFloat($('offset').value||0)||0;state.audioMode='segment';state.segmentEnd=Math.max(0,rg.end+off);a.currentTime=Math.max(0,rg.start+off+0.01);a.play().catch(()=>setStatus('Cần bấm Play trên audio một lần.'));setStatus('Đang nghe '+(side==='left'?'trái':'phải')+': '+fmt(rg.start)+' → '+fmt(rg.end)+' · '+rg.label)}
function playAudioRangePromise(rg){return new Promise(resolve=>{const a=audioEl(rg.lang);if(!a||!a.src){resolve();return}const off=parseFloat($('offset').value||0)||0;const end=Math.max(0,rg.end+off);let done=false;const cleanup=()=>{if(done)return;done=true;clearInterval(timer);resolve()};const timer=setInterval(()=>{if(state.audioMode!=='roundseq'){cleanup();return}if(a.currentTime>=end){a.pause();cleanup()}},80);applyGameVolume(rg.lang);a.currentTime=Math.max(0,rg.start+off+0.01);a.play().catch(()=>cleanup())})}
async function playRound(){if(!state.left.length)return;const side='left', items=state.left.map(x=>({...x,_rg:audioRange(x,side)})).sort((a,b)=>a._rg.start-b._rg.start);stopAudio();state.audioMode='roundseq';setStatus('Đang nghe/Read KO cả lượt: '+items.length+' câu.');for(const it of items){if(state.audioMode!=='roundseq')break;const rg=audioRange(it,side);setStatus((rg.lang==='readko'?'Read KO':'Nghe')+' cả lượt: '+(items.indexOf(it)+1)+'/'+items.length+' · '+rg.label);if(rg.lang==='readko'){await readKoPromise(it.ko)}else{await playAudioRangePromise(rg)}await new Promise(r=>setTimeout(r,180))}if(state.audioMode==='roundseq'){state.audioMode='free';setStatus('Đã nghe/Read KO xong cả lượt.')}}
function syncAudioGuard(){['vi','ko'].forEach(k=>{const a=audioEl(k);if(!a.src||a.paused)return;if(state.audioMode==='segment'&&state.segmentEnd!==null&&a.currentTime>=state.segmentEnd){a.pause();state.audioMode='free';setStatus('Đã nghe xong câu đang chọn.')}if(state.audioMode==='round'&&state.roundEnd!==null&&a.currentTime>=state.roundEnd){a.pause();state.audioMode='free';setStatus('Đã nghe xong audio cả lượt.')}})}
function showAnswer(){const left=selected('left');if(!left)return setStatus('Chọn một câu bên trái trước.');state.rightSel=state.right.findIndex(x=>x.id===left.id);render();setStatus('Đã chọn đáp án bên phải.')}
$('gameJsonFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());loadGameProject(data,false)}catch(err){setStatus('Không đọc được JSON dự phòng: '+(err&&err.message?err.message:err))}};
$('viFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(state.audioUrl.vi)URL.revokeObjectURL(state.audioUrl.vi);state.audioUrl.vi=URL.createObjectURL(f);$('viAudio').src=state.audioUrl.vi;try{$('viAudio').load()}catch(e){}applyGameVolume('vi');setStatus('Đã nạp VI Dub từ file máy.')};
$('koFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(state.audioUrl.ko)URL.revokeObjectURL(state.audioUrl.ko);state.audioUrl.ko=URL.createObjectURL(f);$('koAudio').src=state.audioUrl.ko;try{$('koAudio').load()}catch(e){}applyGameVolume('ko');setStatus('Đã nạp KO Live từ file máy.')};
['mode','direction','pickMode','startMode','audioPromptLang'].forEach(id=>$(id).onchange=()=>newRound());
$('newRoundBtn').onclick=newRound;$('matchBtn').onclick=match;$('playLeftBtn').onclick=()=>playSegment(selected('left'),'left');$('playRightBtn').onclick=()=>playSegment(selected('right'),'right');$('playRoundBtn').onclick=playRound;$('stopBtn').onclick=()=>{stopAudio();setStatus('Đã dừng.')};
$('fNew').onclick=newRound;$('fMatch').onclick=match;$('fLeft').onclick=()=>playSegment(selected('left'),'left');$('fRight').onclick=()=>playSegment(selected('right'),'right');$('fRound').onclick=playRound;$('fStop').onclick=()=>{stopAudio();setStatus('Đã dừng.')};$('fAnswer').onclick=showAnswer;
$('fontSize').oninput=e=>{document.documentElement.style.setProperty('--font-size',e.target.value+'px');$('fontLabel').textContent=e.target.value+' px'};$('offset').oninput=e=>$('offsetLabel').textContent=Number(e.target.value).toFixed(1)+'s';$('startCue').onchange=()=>{if($('pickMode').value!=='fromcue')$('pickMode').value='fromcue';newRound()};
['vi','ko'].forEach(k=>audioEl(k).addEventListener('timeupdate',syncAudioGuard));
initVolumeControls();
loadGameProject(project,true);
autoLoadGithubAudio();
</script>
</body>
