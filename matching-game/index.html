<script>
let project = {"version":"MATCHING_GAME_PROJECT_V1","source":"Subtitle Dub VI + KO Live Cut Studio V4.9.96","title":"HelloMy20 S01E01","movieTitle":"HelloMy20","episodeTitle":"S01E01","audioFolder":"../audio","viAudioFile":"hellomy20_s01e01_VI_Dub.mp3","koAudioFile":"hellomy20_s01e01_KO_Live.mp3","items":[{"id":1,"sourceUid":"cand-mshak67d-2631","sourceNo":1,"originalSourceNo":1,"displayNo":1,"vi":"Xin Chào Tuổi Hai Mươi - S01E01","ko":"청춘시대 - S01E01","en":"Hello My Twenties - S01E01","start":0,"end":58.521499,"viStart":0,"viEnd":10.136168000000001,"koStart":0,"koEnd":58.521499,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":0,"end":10.136168000000001},"koRange":{"start":0,"end":58.521499}},{"id":2,"sourceUid":"merged-mshal4vg-2633","sourceNo":2,"originalSourceNo":1,"displayNo":2,"vi":"NỘI QUY CỦA BELLE EPOQUE CẤM ĐƯA ĐÀN ÔNG VÀO NHÀ\n“Tuổi trẻ”\n[Nhạc chủ đề chính bắt đầu]\n[Tiếng máy nướng bánh mì nhổ bánh mì]\n[Nhạc chủ đề chính kết thúc]\n[Nhạc nền bắt đầu]\n[Tiếng còi inh ỏi]\n(Radio DJ) Tràn đầy hứng khởi cho khởi đầu mới trong học kỳ mới","ko":"\"청춘시대\"\n[메인 주제 음악 시작]\n[토스터기 빵 뱉는 소리]\n[메인 주제 음악 끝]\n[배경 음악 시작]\n[경적 울림]\n(라디오 DJ) 새 학기 새 출발의 설렘이 가득한","en":"HOUSE RULES: NO BOYFRIENDS ALLOWED\n\"Age of Youth\"\n[Main theme music starts]\n[Sound of toaster spitting bread]\n[Main theme music ends]\n[Background music starts]\n[Horn blaring]\n(Radio DJ) Full of excitement for a new start in the new semester","start":10.136,"end":25.598,"viStart":10.136,"viEnd":25.598,"koStart":10.136,"koEnd":25.598,"hasViAudio":true,"hasKoAudio":false,"viRange":{"start":10.136,"end":25.598},"koRange":null},{"id":3,"sourceUid":"merged-mshaoj35-2635","sourceNo":3,"originalSourceNo":5,"displayNo":3,"vi":"Hôm nay là ngày đầu tiên của tháng 3, tháng của sự háo hức đón chào học kỳ mới.\nCác bạn đã chuẩn bị đầy đủ cho ngày đầu của học kỳ chưa?\nThời khóa biểu,\nhộp bút dày cộm cùng tập vở chắc chắn.\nNgày nay chỉ cần máy tính xách tay là đủ nhỉ?","ko":"3월의 첫날입니다\n새 학기 전날 모두들 필수품 챙기셨나요?\n강의시간표 빵빵한 필통 빳빳한 노트\n아... 요새는 노트북 하나만 챙기면 된다고요?","en":"It's the first day of March, the month of new beginnings.\nIs everyone ready for the first day of school?\nYour class schedule,\na pencil case, a brand new notebook.\nAll you need is a laptop these days, right?","start":58.521499,"end":86.551532,"viStart":25.598294,"viEnd":43.980013,"koStart":58.521499,"koEnd":86.551532,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":25.598294,"end":43.980013},"koRange":{"start":58.521499,"end":86.551532}},{"id":4,"sourceUid":"merged-mshb0a05-2641","sourceNo":4,"originalSourceNo":11,"displayNo":4,"vi":"Nhưng bạn cần chuẩn bị thêm một thứ quan trọng khác.\nChính là sự tự tin.\nCác bạn có thể sẽ căng thẳng khi bước vào học kỳ mới, kết bạn mới.\nBạn sợ mình lúng túng,\nsợ ai đó phát hiện ra mình lúng túng.","ko":"그렇다면, 가장 중요한 그것 그거 챙겨야죠\n바로 자신감\n새 학기 새 친구에게 적응하느라 스트레스 많이 받을 시기죠...\n어색하지는 않을까\n또 어색한 내 모습 들키지 않을까","en":"But you do need something really important.\nIt's confidence.\nThe new semester can be stressful.\nYou don't want to be awkward.\nYou don't want anyone to know your awkward first day.","start":86.551532,"end":99.665013,"viStart":43.980013,"viEnd":57.713009,"koStart":86.551532,"koEnd":99.665013,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":43.980013,"end":57.713009},"koRange":{"start":86.551532,"end":99.665013}},{"id":5,"sourceUid":"merged-mshaq8a4-2638","sourceNo":5,"originalSourceNo":14,"displayNo":5,"vi":"Tôi biết nhiều bạn đang đau đầu vì những điều này.\nNhưng càng những lúc thế này, bạn càng phải hiên ngang và tự tin.\nHãy mạnh dạn mở cánh cửa trước mặt.","ko":"노심초사 힘든 분들 많을 거예요\n하지만 이런 때일수록 당당하게 어깨 쫙 펴고\n내 앞에 놓인 새 문을 자신 있게 두드리자고요","en":"I know a lot of you are nervous about it.\nBut especially at a time like this, walk tall, and be confident.\nStart a new day with confidence.","start":99.665013,"end":108.555353,"viStart":57.713009,"viEnd":66.867476,"koStart":99.665013,"koEnd":108.555353,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":57.713009,"end":66.867476},"koRange":{"start":99.665013,"end":108.555353}},{"id":6,"sourceUid":"merged-mshaqdzo-2639","sourceNo":6,"originalSourceNo":20,"displayNo":6,"vi":"XUẤT PHÁT ĐẾN PHƯỜNG YEONNAM","ko":"[신발 소리]","en":"","start":108.555353,"end":147.610436,"viStart":66.867476,"viEnd":106.246049,"koStart":108.555353,"koEnd":147.610436,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":66.867476,"end":106.246049},"koRange":{"start":108.555353,"end":147.610436}},{"id":7,"sourceUid":"merged-mshar2wq-2640","sourceNo":7,"originalSourceNo":19,"displayNo":7,"vi":"Cháu là ai?\nCháu chào bà.\nCháu mới dọn đến hôm nay.\nTên cháu là Yoo Eun Jae.\nCon bé này sẽ cực đây.","ko":"누구?\n안녕하세요\n저 오늘 이사 오기로 한...\n유은재라고...\n(집주인) 애 좀 먹겠다","en":"Who are you?\nHello.\nI'm Eun-Jae Yoo.\nI'm supposed to move in today.\nIt's gotta be tough.","start":147.610436,"end":175.761729,"viStart":106.246049,"viEnd":134.696298,"koStart":147.610436,"koEnd":175.761729,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":106.246049,"end":134.696298},"koRange":{"start":147.610436,"end":175.761729}},{"id":8,"sourceUid":"merged-mshp3k54-2","sourceNo":8,"originalSourceNo":23,"displayNo":8,"vi":"Năm học mới, học kỳ mới.\nKhởi đầu mới.\nLần nào tôi cũng gặp ác mộng.\nLúc nào khởi đầu mới cũng khiến tôi lo sợ thay vì háo hức.","ko":"(유은재) 새 학년, 새 학기\n새 출발...\n그때마다 나는 악몽을 꾼다\n나에게 처음이란 것은\n늘 설렘보다는 두려움이다","en":"New year, new semester.\nNew start.\nEvery time, I have nightmares.\nEvery time, a new start is rather scary than exciting.","start":175.761729,"end":201.367526,"viStart":134.696298,"viEnd":158.746068,"koStart":175.761729,"koEnd":201.367526,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":134.696298,"end":158.746068},"koRange":{"start":175.761729,"end":201.367526}},{"id":9,"sourceUid":"merged-mshp9jxv-3","sourceNo":9,"originalSourceNo":36,"displayNo":9,"vi":"[Nhạc nền kết thúc]\n[Thở dài một hơi]\n[Nhấn chuông cửa]\n(Go Doo-young) À!\n[Tiếng mở cửa]","ko":"[배경 음악 끝]\n[긴 숨을 토한다]\n[초인종을 누른다]\n(고두영) 아!\n[문 여는 소리]","en":"[Background music ends]\n[Exhales a long breath]\n[Press the doorbell]\n(Go Doo-young) Ah!\n[Sound of door opening]","start":221.73,"end":222.93,"viStart":221.73,"viEnd":222.93,"koStart":221.73,"koEnd":222.93,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":10,"sourceUid":"merged-mshpakl6-4","sourceNo":10,"originalSourceNo":27,"displayNo":10,"vi":"Ai đấy? Sao đến sớm dữ vậy?\nKhông có ai sao? Vâng ạ.","ko":"누구야? 응? \"새 하메\"\n아이, 얘 뭐야? 왜 이렇게 일찍 왔어? 아이!\n(집주인) 왜? 아무도 없어?\n(유은재) 네\n(집주인) 이상하네...","en":"Who is it? Why is she so early?\nNo one's there? I don't think so.","start":201.367526,"end":257.310952,"viStart":158.746068,"viEnd":210.006771,"koStart":201.367526,"koEnd":257.310952,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":158.746068,"end":210.006771},"koRange":{"start":201.367526,"end":257.310952}},{"id":11,"sourceUid":"merged-mshpbmi2-6","sourceNo":11,"originalSourceNo":48,"displayNo":11,"vi":"[Rung điện thoại di động]\n[Nhạc nền vui vẻ bắt đầu]\n[Nhấn mật khẩu]","ko":"[핸드폰 진동]\n[즐거운 배경 음악 시작]\n[비밀번호를 누른다]","en":"[Cellphone vibration]\n[Happy background music starts]\n[Press password]","start":254.26,"end":256.46,"viStart":254.26,"viEnd":256.46,"koStart":254.26,"koEnd":256.46,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":12,"sourceUid":"merged-mshpenbm-9","sourceNo":12,"originalSourceNo":35,"displayNo":12,"vi":"Tới liền! Cháu ở nhà à? Sao không mở cửa?\nTại cháu đang ngủ. Em vào đi. - Chào chị. - Chào em. Bà về cẩn thận ạ.","ko":"비켜봐. 나가요! 안에 있었어?\n뭐 하느라고 문도 안 열어줘?\n아... 그게...\n깜빡 잠들어서...\n어서 와요. 안녕하세요. 안녕히 가세요. 어...","en":"Coming! I didn't know you were in there.\nWhy didn't you get the door?\nI fell asleep.\nCome in. Hello. Bye.","start":257.560952,"end":290.543412,"viStart":210.006771,"viEnd":250.853574,"koStart":257.560952,"koEnd":290.543412,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":210.006771,"end":250.853574},"koRange":{"start":257.560952,"end":290.543412}},{"id":13,"sourceUid":"merged-mshpefej-8","sourceNo":13,"originalSourceNo":59,"displayNo":13,"vi":"[Bíp bíp bíp tiếng cửa]\n[Nhạc nền vui vẻ kết thúc]","ko":"[삑삑삑 문소리]\n[즐거운 배경 음악 끝]","en":"[Beep beep beep sound of door]\n[Happy background music ends]","start":288.76,"end":290.56,"viStart":288.76,"viEnd":290.56,"koStart":288.76,"koEnd":290.56,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":14,"sourceUid":"merged-mshpf30h-10","sourceNo":14,"originalSourceNo":38,"displayNo":14,"vi":"Em vào đi.\nMà sao em đến sớm thế?\nEm hẹn 3:00 chiều sẽ đến mà.\nĐâu phải, là 5:00 mà.","ko":"들어와요, 들어와\n근데 왜 이렇게 일찍 왔어?\n예? 저 3시까지 온다고...\n아니야, 5시라고...","en":"Come in.\nWhy are you here so early?\nWe said 3:00 p.m.\nNo, it was 5:00.","start":290.543412,"end":310.631163,"viStart":250.853574,"viEnd":268.513435,"koStart":290.543412,"koEnd":310.631163,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":250.853574,"end":268.513435},"koRange":{"start":290.543412,"end":310.631163}},{"id":15,"sourceUid":"merged-mshpfzop-11","sourceNo":15,"originalSourceNo":45,"displayNo":15,"vi":"Không sao đâu. Em cũng không đợi lâu.\nChị về phòng đi.\nKhông sao. Em cứ thong thả.\nCác ngăn khác có chủ rồi nên em dùng ngăn dưới cùng nhé. Vâng.\nEm vào đi. Căn phòng ở bên trái.\nVào phòng đi.","ko":"괜찮아요, 얼마 안 기다렸어요. 응...\n먼저 들어가세요\n아니야... 괜찮아, 천천히 해\n칸마다 주인이 정해져 있으니까 넌 맨 밑에 칸 쓰면 되겠다. 예...\n들어가 봐, 저기 왼쪽 방이야\n들어가, 들어가","en":"It's okay, I didn't wait too long. You can go.\nIt's okay. Take your time.\nWe share this one. You can take the bottom shelf. Okay.\nYou can go in. It's the room on the left. Go in.","start":310.631163,"end":342.123063,"viStart":268.513435,"viEnd":290.656449,"koStart":310.631163,"koEnd":342.123063,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":268.513435,"end":290.656449},"koRange":{"start":310.631163,"end":342.123063}},{"id":16,"sourceUid":"merged-msj3bi8x-2","sourceNo":16,"originalSourceNo":50,"displayNo":16,"vi":"Em có thể để hành lý ở đây. Vâng.\nĐây là bàn của tiền bối Yoon.\nChị ấy học năm tư Khoa Quản trị Kinh doanh, hơi lớn tuổi.\nCụ thể là 28.\nChị ấy bảo lưu khá nhiều.","ko":"어... 짐 여기다 놔 이게 네 책상. 네\n어... 아, 이게 윤 선배 책상이고\n윤 선배는 이방 쓰는 선밴데\n경영학과 4학년이고 나이는 되게 많아\n스물여덟 살\n중간에 휴학을 많이 해서 그래","en":"You can leave your stuff here. Okay.\nThis is Jin-Myung's desk.\nShe's is a lot older and studies management.\nShe's 28. She took some time off.","start":342.123063,"end":364.310835,"viStart":304,"viEnd":322.033835,"koStart":342.123063,"koEnd":364.310835,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":304,"end":322.033835},"koRange":{"start":342.123063,"end":364.310835}},{"id":17,"sourceUid":"ko-mshaf162-852","sourceNo":17,"originalSourceNo":76,"displayNo":17,"vi":"[Tiếng đóng cửa]","ko":"[문 닫는 소리]","en":"[Sound of door closing]","start":351.4,"end":352.93,"viStart":351.4,"viEnd":352.93,"koStart":351.4,"koEnd":352.93,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":18,"sourceUid":"merged-msj3ole0-3","sourceNo":18,"originalSourceNo":55,"displayNo":18,"vi":"Còn chị là sinh viên năm ba Khoa Thực phẩm và Dinh dưỡng.\nBạn cùng phòng chị học Báo chí và Truyền thông.\nCậu ấy đi tình nguyện tuần sau mới về.\nCòn một người nữa cũng học Quản trị Kinh doanh.","ko":"그리고 나는...\n식영과 3학년이고\n나랑 같이 방 쓰는 애는 언론 정보학관데\n지금 봉활 가서 없어 다음 주에 올 거야\n- 네 - 그리고... 또 한 명도 경영학관데, 그...","en":"And I'm a junior, and a food and nutrition major.\nMy roommate studies communications.\nShe went to volunteer. She'll be here next week.\nAnd there's another business major.","start":364.310835,"end":375.482047,"viStart":322.033835,"viEnd":335.144039,"koStart":364.310835,"koEnd":375.482047,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":322.033835,"end":335.144039},"koRange":{"start":364.310835,"end":375.482047}},{"id":19,"sourceUid":"merged-msj3rod6-4","sourceNo":19,"originalSourceNo":58,"displayNo":19,"vi":"Chị ấy thích khoe thân vì nghĩ thân hình mình đẹp.\nCòn gì nữa không nhỉ?\nEm có thể nằm giường tầng dưới.","ko":"그 노출증이 있어\n자기가 몸매가 좀 된다 그거지\n그리고 또 뭐가 있더라... 그...\n(정예은) 아 맞다, 침대는 네가 1층 쓰면 되고, 그리고...","en":"She doesn't like to wear clothes. She likes her figure a lot.\nAnd what else?\nYou can use the bottom bunk.","start":375.482047,"end":384.693468,"viStart":335.144039,"viEnd":342.676647,"koStart":375.482047,"koEnd":384.693468,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":335.144039,"end":342.676647},"koRange":{"start":375.482047,"end":384.693468}},{"id":20,"sourceUid":"ko-mshaf162-867","sourceNo":20,"originalSourceNo":91,"displayNo":20,"vi":"[Bíp bíp bíp tiếng cửa]","ko":"[삑삑삑 문소리]","en":"[Beep beep beep sound of door]","start":382.73,"end":383.83,"viStart":382.73,"viEnd":383.83,"koStart":382.73,"koEnd":383.83,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":21,"sourceUid":"merged-msj3wbzm-5","sourceNo":21,"originalSourceNo":64,"displayNo":21,"vi":"Tủ quần áo thì…\nEm có thể dùng tủ này.\nÀ, siêu thị ở bên phải nhà mình.\nTẩu thoát thành công.\nEm tự tìm nhé.\nNghỉ ngơi đi.","ko":"옷장은...이거 쓰면 되겠다\n또 보자... 뭐가 있더라...\n그... 그... 아!\n마트는 집 앞에서 오른쪽으로 가면은 있으니까...\n(고두영) 탈출 성공. 네가 찾아봐. 쉬어!","en":"And the closet...\nYou can use this one.\nThere's a grocery store to the right.\nSuccessfully escaped.\nYou can find it yourself.\nTake your time.","start":384.693468,"end":404.062958,"viStart":342.676647,"viEnd":362.084842,"koStart":384.693468,"koEnd":404.062958,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":342.676647,"end":362.084842},"koRange":{"start":384.693468,"end":404.062958}},{"id":22,"sourceUid":"merged-msj3wm10-6","sourceNo":22,"originalSourceNo":105,"displayNo":22,"vi":"[tiếng đóng cửa] [nhạc nền sôi động bắt đầu]\n[Thở dài] [Tiếng mở ngăn kéo]\n[rút hộp ra] [tiếng mở cửa]","ko":"[문 닫는 소리][경쾌한 배경 음악 시작]\n[한숨 쉰다][서랍 여는 소리]\n[상자 끈다][문 여는 소리]","en":"[door closing sound] [upbeat background music starts]\n[Sighs] [Sound of drawer opening]\n[pulls out box] [sound of door opening]","start":457.63,"end":458.73,"viStart":457.63,"viEnd":458.73,"k 리]\n[삑삑삑 문소리]\n[문 닫는 소리]\n[경쾌한 테마 음악 시작]\n집에서는 가급적 통화 대신 문자로 해줘요 벨 소리는 진동으로 하고요\n[한숨 쉰다]","en":"Please text instead of talk on the phone. And put your phone on mute.","start":974.45503,"end":996.131739,"viStart":1009.05821,"viEnd":1015.995171,"koStart":974.45503,"koEnd":996.131739,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1009.05821,"end":1015.995171},"koRange":{"start":974.45503,"end":996.131739}},{"id":42,"sourceUid":"merged-msjuahq5-46","sourceNo":42,"originalSourceNo":141,"displayNo":42,"vi":"Lúc cuối…\nỞ hiệp một còn là 2-0.\nCuối trận lại đá vào ba quả.\nChỉ trong năm phút.\nLập cú ăn ba luôn.\nQuả là không ngờ.\nTớ thật sự á khẩu.\nKhông thể tin được luôn.\n(남학생 1) 5분도 안 되어서 3골 넣었을걸","ko":"(남학생 1) 마지막에... 아...\n(남학생 2) 전반에 2대 0이었는데...\n(남학생 1) 막판에 3골 넣었잖아\n(남학생 2) 엉...\n(남학생 1) 5분도 안 되어서 3골 넣었을걸 \n(남학생 2) 막 해트트릭하잖아...\n장난아니야...\n(남학생 1) 난 말도 안 나온다 진짜\n어저께 정말 대박이었어 진짜 어제...\n채널 돌릴까 말까 고민 했는데 진짜 안 돌린 게...\n다음 주에 또 있다\n(남학생 2) 아, 그래...","en":"At the end...\nThe first half was 2-0.\nThey scored three times at the end.\nIn the last five minutes.\nIt just happened so fast.\nWho knew?\nIt was ridiculous.\nIt was unbelievable.\nI was about to change the channel.","start":996.131739,"end":1033.408494,"viStart":1015.995171,"viEnd":1045.431043,"koStart":996.131739,"koEnd":1033.408494,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1015.995171,"end":1045.431043},"koRange":{"start":996.131739,"end":1033.408494}},{"id":43,"sourceUid":"merged-msjucpa8-50","sourceNo":43,"originalSourceNo":248,"displayNo":43,"vi":"Sao em đứng lên sớm thế? Còn ba trạm lận mà?","ko":"왜 벌써 일어났어? 아직 3정거장이나 \n남았는데...\n\n[남학생들 얘기한다]\n[여자 웃는다]\n[경쾌한 테마 음악 끝]","en":"Why did you get up already?","start":1092.53,"end":1094.63,"viStart":1092.53,"viEnd":1094.63,"koStart":1092.53,"koEnd":1094.63,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":44,"sourceUid":"merged-msjv7ivg-51","sourceNo":44,"originalSourceNo":252,"displayNo":44,"vi":"Em thích vậy thôi.\nSao anh ấy biết được nhỉ?\nEm không dự tiết định hướng à? Sao vậy?\nLúc đó em bị cảm.\nChắc em sẽ khó làm quen đây.","ko":"그냥...OT 안 갔어? 왜?\n감기 걸려서...\n너 되게 적응하기 힘들겠다","en":"It's three stops away.\nNo reason.\nHow did he know?\nDidn't you go to orientation? Why?\nI had a cold.\nIt must be hard for you to get used to things.","start":1033.408494,"end":1043.274854,"viStart":1045.431043,"viEnd":1064.920955,"koStart":1033.408494,"koEnd":1043.274854,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1045.431043,"end":1064.920955},"koRange":{"start":1033.408494,"end":1043.274854}},{"id":45,"sourceUid":"merged-mskgxotz-12","sourceNo":45,"originalSourceNo":156,"displayNo":45,"vi":"Có lẽ các bạn khác đã thân nhau rồi.\nSun Kyung à! Han Yu Kyung!\nYe Eun à!","ko":"자기들끼리는 벌써 다 친해졌을 텐데...\n아! 송경아! 한유경!\n(여학생들) 아, 정예은!\n(여학생들) 야! 오랜만이다\n(정예은) 뭐, 뭐, 뭐, 뭐?\n아니야\n(여학생) 솔직히 말해 야, 너 뭐 했지?\n(정예은) 그냥 발랐어...\n(여학생) 솔직히 말해... 너 뭐 했지?\n(정예은) 아니야...","en":"They're probably close already.\nSun-Kyung! Yu-Kyung! Ye-Eun!","start":1043.274854,"end":1064.271,"viStart":1064.920955,"viEnd":1084.698098,"koStart":1043.274854,"koEnd":1064.271,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1064.920955,"end":1084.698098},"koRange":{"start":1043.274854,"end":1064.271}},{"id":46,"sourceUid":"merged-mskh9shu-15","sourceNo":46,"originalSourceNo":272,"displayNo":46,"vi":"Chào cô ạ. - Chào Giáo sư.\nChào các em.Xem nào.\nTôi thấy vài gương mặt thân quen.\nAi đăng ký học lại, giơ tay.\nĐược rồi.\nHãy chăm chỉ và cố gắng hơn trong kỳ này.\nKỳ sau chúng ta đừng gặp nhau nữa nhé.","ko":"(남학생) 안녕하세요\n(학생들) 안녕하세요\n(교수님) 안녕하세요\n자... 보자\n가만있어봐라... 얼굴이 좀 낯익은 학생들이 있는데\n재수강하는 학생들 한번 손 들어보지?\n어, 그렇지... 어...\n다음 학기에는 안 보는 걸로 약속하고\n어... 이번 학기에 열심히 한번 해보도록 합시다","en":"-Hi. -Hello. Hello. Let's see. Some of you look familiar.\nLet's not see each other next semester.\nWho's re-taking my class?\nOkay.\nLet's try and do better this semester.","start":1064.271,"end":1085.49595,"viStart":1084.698098,"viEnd":1107.202252,"koStart":1064.271,"koEnd":1085.49595,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1084.698098,"end":1107.202252},"koRange":{"start":1064.271,"end":1085.49595}},{"id":47,"sourceUid":"merged-mskhbjxz-18","sourceNo":47,"originalSourceNo":162,"displayNo":47,"vi":"Nếu mở trang thứ hai của giáo trình,\ncác em sẽ thấy định nghĩa tâm lý học.","ko":"그... 가지고 계신 교재...\n맨 처음에 보면은 페이지 2에\n심리학의 정의라고 있어요","en":"Let's look at page two of the book.\nYou can find the definition of psychology.","start":1085.49595,"end":1092.805975,"viStart":1107.202252,"viEnd":1115.74139,"koStart":1085.49595,"koEnd":1092.805975,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1107.202252,"end":1115.74139},"koRange":{"start":1085.49595,"end":1092.805975}},{"id":48,"sourceUid":"merged-mskhckfx-20","sourceNo":48,"originalSourceNo":279,"displayNo":48,"vi":"Trước tiên, chúng ta phải biết tâm lý học là gì.\nCùng xem định nghĩa nhé.\nCô đọc nhé.","ko":"우리가 심리학이 무엇인지 일단 알아야 하니까\n한번 읽어보도록 하겠습니다\n자, 제가 읽을게요\n저기...","en":"We need to know what psychology is.\nWe're going to read it.\nI'll read it.","start":1092.805975,"end":1099.459912,"viStart":1115.74139,"viEnd":1122.117807,"koStart":1092.805975,"koEnd":1099.459912,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1115.74139,"end":1122.117807},"koRange":{"start":1092.805975,"end":1099.459912}},{"id":49,"sourceUid":"merged-mskhdwos-22","sourceNo":49,"originalSourceNo":169,"displayNo":49,"vi":"Định nghĩa tâm lý học.\nỞ buổi học đầu, tác giả hỏi…\nBạn ơi.\n…vì sao lại chọn môn này.","ko":"(교수님) 1, 심리학의 정의\n심리학 수업 첫 시간에 필자는 종종\n저기...\n(교수님) 왜 심리학을 수강하려 하는지를 묻는다","en":"Definition of psychology.\nIn the first class...\nExcuse me.\nWhy do you take psychology...","start":1099.459912,"end":1107.827523,"viStart":1122.117807,"viEnd":1126.465259,"koStart":1099.459912,"koEnd":1107.827523,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1122.117807,"end":1126.465259},"koRange":{"start":1099.459912,"end":1107.827523}},{"id":50,"sourceUid":"merged-mskiwlwj-64","sourceNo":50,"originalSourceNo":177,"displayNo":50,"vi":"Cho tôi mượn bút bi với.\nĐúng không nào?\nĐa phần sinh viên im lặng không trả lời,\nhoặc trả lời không đúng trọng tâm câu hỏi.\nTuy nhiên, nếu các em học tâm lý học…\nTiền bối.\nAnh mời bọn em ăn trưa đi.\nEm muốn ăn carbonara.","ko":"볼펜 좀...\n(교수님) 그렇죠?\n필자의 질문에 학생들은 대게 묵묵부답으로 반응하거나...\n고마워...\n(교수님) 질문의 본질과는 거리가 먼 대답을 하지만\n간혹 심리학을 공부하면\n(학생들) 수고하셨습니다\n(여학생 1) 선배, 밥 사주세요\n저는 까르보나라","en":"Can I borrow a pen?\nRight?\nStudents usually don't have any answers.\nThank you.\nOr say something entirely unrelated.\nBut when you study psychology...\nHey, could you buy me lunch?\nI'd like some pasta.","start":1107.827523,"end":1121.780197,"viStart":1126.465259,"viEnd":1148.368134,"koStart":1107.827523,"koEnd":1121.780197,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1126.465259,"end":1148.368134},"koRange":{"start":1107.827523,"end":1121.780197}},{"id":51,"sourceUid":"merged-mskhmb9v-27","sourceNo":51,"originalSourceNo":184,"displayNo":51,"vi":"Em thích canh lòng lợn. - Tại sao chứ?\nNghe nói tân sinh viên không cần tự mua đồ ăn.\nĐúng đấy.\nAi nói cơ?\nĐi mà anh.\nĐi thôi.\nAnh mời cơm thì mấy đứa làm gì cho anh?","ko":"(여학생 2) 저는 순댓국... - (윤종열) 내가 왜?\n(여학생 1) 신입생 때는 자기 돈으로 밥 사 먹는 거 아니래요\n(여학생 2) 맞아요...\n(윤종열) 야... 누가 그래?\n(여학생들) 밥 먹으러 가요 가요, 가요...\n(윤종열) 야, 내가 밥 사주면 너희들은 날 위해서 뭘 해줄 거냐","en":"-I'd like sundae soup. -Why would I do that?\nThey say freshmen don't buy their food.\nRight.\nWho says that?\nPlease.\nLet's go.\nWhat will you do if I buy you lunch?","start":1121.780197,"end":1133.000604,"viStart":1148.368134,"viEnd":1159.432598,"koStart":1121.780197,"koEnd":1133.000604,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1148.368134,"end":1159.432598},"koRange":{"start":1121.780197,"end":1133.000604}},{"id":52,"sourceUid":"ko-mshaf164-1067","sourceNo":52,"originalSourceNo":291,"displayNo":52,"vi":"[Tiếng đập bàn]","ko":"[책상 부딪치는 소리]\n(확성기 소리) 귤이 왔습니다\n새콤달콤, 맛도 좋고\n피부에도 좋은 귤이 왔어요\n할머니, 할아버지\n엄마, 아빠\n누나, 동생 모두...","en":"[Sound of hitting desk]","start":1133.000604,"end":1176.303664,"viStart":1159.432598,"viEnd":1177.446602,"koStart":1133.000604,"koEnd":1176.303664,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1159.432598,"end":1177.446602},"koRange":{"start":1133.000604,"end":1176.303664}},{"id":53,"sourceUid":"merged-mskhwff6-49","sourceNo":53,"originalSourceNo":190,"displayNo":53,"vi":"Hãy tắt TV khi ra ngoài.\nCòn nữa, bàn ăn là không gian chung.\nDùng xong phải dọn ngay.\nNhà tắm cũng thế.\nKhông dùng thì rút phích cắm đi.\nEm muốn nói gì không?","ko":"밖에 나갈 때 TV 끄도록 해요\n식탁은 다 같이 쓰는 공간이니까\n그때그때 치우도록 하고요\n화장실도 마찬가지예요\n안 쓰는 코드 뽑아놔요\n뭐 할 말 있어요?","en":"Turn the TV off when you go out.\nAnd we share the table.\nClean up after you're done.\nSame goes for the bathroom.\nUnplug when you're not using it.\nDo you want to say something?","start":1176.303664,"end":1196.127701,"viStart":1200.542316,"viEnd":1223.747164,"koStart":1176.303664,"koEnd":1196.127701,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1200.542316,"end":1223.747164},"koRange":{"start":1176.303664,"end":1196.127701}},{"id":54,"sourceUid":"merged-mskht7oh-35","sourceNo":54,"originalSourceNo":196,"displayNo":54,"vi":"À…\nChào chị.\nQuýt…\nMình muốn về nhà quá.","ko":"어...\n안녕하세요\n아...\n귤...\n집에 가고 싶다","en":"Well...\nHello.\nWould you like some...\nI want to go home.","start":1196.127701,"end":1221.716553,"viStart":1230.917386,"viEnd":1248.470583,"koStart":1196.127701,"koEnd":1221.716553,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1230.917386,"end":1248.470583},"koRange":{"start":1196.127701,"end":1221.716553}},{"id":55,"sourceUid":"merged-mskk4vkm-65","sourceNo":55,"originalSourceNo":300,"displayNo":55,"vi":"Người cuối cùng ra khỏi nhà hãy tắt cục phát wifi.","ko":"(윤진명) 마지막 나가는 사람\n공유기 끕시다","en":"The last one to leave turns the router off.","start":1238.424173,"end":1256.238676,"viStart":1278.311995,"viEnd":1283.902199,"koStart":1238.424173,"koEnd":1256.238676,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1278.311995,"end":1283.902199},"koRange":{"start":1238.424173,"end":1256.238676}},{"id":56,"sourceUid":"merged-mskhxcvh-51","sourceNo":56,"originalSourceNo":324,"displayNo":56,"vi":"[Nhạc chủ đề sôi động bắt đầu]\n[Tiếng đóng cửa]\n[tiếng giày]\n[Tiếng mở cửa]\n[Tiếng mở quần áo]","ko":"[경쾌한 테마 음악 시작]\n[문 닫는 소리]\n[구두 소리]\n[문 여는 소리]\n[옷 터는 소리]","en":"[Upbeat theme music starts]\n[Sound of door closing]\n[shoe sound]\n[Sound of door opening]\n[Sound of clothes opening]","start":1256.238676,"end":1273.188881,"viStart":1256.238676,"viEnd":1273.188881,"koStart":1256.238676,"koEnd":1273.188881,"hasViAudio":false,"hasKoAudio":true,"viRange":null,"koRange":{"start":1256.238676,"end":1273.188881}},{"id":57,"sourceUid":"merged-mskhvta3-47","sourceNo":57,"originalSourceNo":203,"displayNo":57,"vi":"Em giặt đồ hả? Cho chị ké chút xíu.\nChị sẽ phơi cho.\nĐồ trong máy giặt là của em hả?\nMau lấy ra cho người khác còn dùng.\nDạ, chuyện là…\nSao?","ko":"빨래할 거지?\n내 것도\n너는 건 내가 할게\n야! 세탁기 빨래, 네 거야?\n빨리 널어, 다음 사람 못 쓰잖아!\n어...\n그게...\n뭐?","en":"Are you doing laundry? Can I put mine in there?\nI'll hang them up later.\nIs the laundry yours?\nTake it out so others can use the machine.\nWell, that's...\nSao?\nWhat?","start":1273.188881,"end":1292.635712,"viStart":1303.842154,"viEnd":1321.672176,"koStart":1273.188881,"koEnd":1292.635712,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1303.842154,"end":1321.672176},"koRange":{"start":1273.188881,"end":1292.635712}},{"id":59,"sourceUid":"merged-mskhzytt-58","sourceNo":59,"originalSourceNo":343,"displayNo":59,"vi":"Làm vậy thì tiết kiệm được mấy đồng?\nĐừng chi li vậy chứ.\nCác người thì tốt hơn ai chứ?\nỞ nhà này còn ai ngoài em?\nĐã bảo không phải em mà.","ko":"(윤진명) 안 쓰는 코드는 뽑아놔요\n(유은재) 그까짓 거 한다고 얼마나 절약되는데요\n일일이 지적 좀 하지 마요\n너희들은 얼마나 잘하는데\n(강이나) 이 집에서 너 말고 더 있어?\n(정예은) 아... 아니라니까 자꾸 나한테 왜 그래\n너 진짜 아니야?","en":"How much are you saving with these little things?\nDon't nitpick.\nWho do you think you are?\nWho else would do it if not you?\nI said it's not me!\nIs it really not you?","start":1315.835456,"end":1335.816227,"viStart":1356.259282,"viEnd":1382.341096,"koStart":1315.835456,"koEnd":1335.816227,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1356.259282,"end":1382.341096},"koRange":{"start":1315.835456,"end":1335.816227}},{"id":60,"sourceUid":"merged-mski02er-59","sourceNo":60,"originalSourceNo":338,"displayNo":60,"vi":"[tiếng giày]\n[Thở dài]\n[Nhạc chủ đề lạc quan kết thúc]","ko":"[구두 소리]\n[한숨 쉰다]\n[경쾌한 테마 음악 끝]","en":"[shoe sound]\n[Sighs]\n[Upbeat theme music ends]","start":1402.9,"end":1404.33,"viStart":1402.9,"viEnd":1404.33,"koStart":1402.9,"koEnd":1404.33,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":61,"sourceUid":"merged-mski28vy-63","sourceNo":61,"originalSourceNo":215,"displayNo":61,"vi":"Không phải em thật à?\nKhông mà! Chị bảo em trộm đồ đấy à?\nBắt được thì biết tay.\nĐã lén lấy mặc thì phải trả lại nguyên trạng.\nAi lại giặt rồi làm hỏng thế này? Chị mới mặc đúng một lần.","ko":"아니야, 왜 사람을 도둑으로 몰아? 아이, 짜증 나\n누군지 잡히기만 해봐\n몰래 갖다 입었으면 제대로나 돌려놔야지\n물빨래를 하고 지랄이야 나도 한 번밖에 안 입은 건데","en":"It's not! You're accusing me of stealing?\nIf I catch her...\nIf you wear someone else's clothes, shouldn't you return them?\nSomeone washed it and ruined it. I only wore it once.","start":1335.816227,"end":1345.455411,"viStart":1382.341096,"viEnd":1393.808867,"koStart":1335.816227,"koEnd":1345.455411,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1382.341096,"end":1393.808867},"koRange":{"start":1335.816227,"end":1345.455411}},{"id":62,"sourceUid":"merged-mskknmch-68","sourceNo":62,"originalSourceNo":224,"displayNo":62,"vi":"Có chuyện gì vậy ạ? Cái đó…\nEm giặt đấy ạ.\nEm giặt nó? Em lấy sao? - Không.\nTiền bối Ye Eun… Chị lấy bao giờ?\nBiết ngay mà. Chị mày không có bằng chứng nên đã nhịn đó giờ.","ko":"그게 왜요? 그거...\n내가 빤 건데\n너야? 니가 그랬어? - 아뇨\n예은 선배, 세탁...\n야, 내가 언제...\n(강이나) 너 그럴 줄 알았어\n물증 없어서 계속 참고 있었는데","en":"What's wrong with it? That's...\nI washed it. You did?\nYou washed it? No. Ye-Eun said\nWhen did I do that?\nI knew it.\nI've been putting up with it because I had no evidence.","start":1345.455411,"end":1363.518696,"viStart":1393.808867,"viEnd":1410.060882,"koStart":1345.455411,"koEnd":1363.518696,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1393.808867,"end":1410.060882},"koRange":{"start":1345.455411,"end":1363.518696}},{"id":63,"sourceUid":"merged-msl6b8uq-1","sourceNo":63,"originalSourceNo":232,"displayNo":63,"vi":"Đôi giày đỏ cũng là sản phẩm của em chứ gì?\nCái đó không phải do em thật mà!\nCái này thì đúng hả? Mới cãi dữ lắm mà.\nĐừng có hất nữa coi!\nCon kia! Bà chằn!\nĐừng đánh nữa! Dừng lại! Dừng tay!","ko":"내 빨간 구두 기스 난 거 그것도 네가 그런 거지?\n아, 그건 진짜 아니다!\n그럼 이건 진짜고? 아까는 아니라며\n아, 왜 때려. 이씨...야! 왜\n(유은재) 언니! 악!\n(강이나) 야, 이년아!\n(정예은) 아! 아야!\n(강이나) 너 이리와! 이리와!\n(유은재) 저기요. 아! 아파","en":"You scratched my red shoes, didn't you?\nThat one's really not me!\nAnd this one is? You said it wasn't you earlier.\nDon't hit me! Hey! Con kia!\nYou! Don't! Stop! Stop!","start":1363.518696,"end":1400.531366,"viStart":1410.060882,"viEnd":1421.361926,"koStart":1363.518696,"koEnd":1400.531366,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1410.060882,"end":1421.361926},"koRange":{"start":1363.518696,"end":1400.531366}},{"id":64,"sourceUid":"merged-msl6gc3a-3","sourceNo":64,"originalSourceNo":375,"displayNo":64,"vi":"[la hét]\n[Nhạc nền bộ lạc bắt đầu]\n[Kết thúc nhạc nền bộ lạc]\n[Thở dài]","ko":"[비명을 지른다]\n[부족의 배경 음악 시작]\n[부족의 배경 음악 끝]\n[한숨 쉰다]\n[문 닫는 소리]","en":"[screams]\n[Tribal background music starts]\n[End of tribal background music]\n[Sighs]","start":1503.5,"end":1504.63,"viStart":1503.5,"viEnd":1504.63,"koStart":1503.5,"koEnd":1504.63,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":65,"sourceUid":"merged-msl7fp7h-12","sourceNo":65,"originalSourceNo":379,"displayNo":65,"vi":"Em chào chị.\nBuổi sáng tốt lành.\nChào chị.\nCon điên. Nghĩ mình tốt hơn ai?\nChị ngủ ngon không…","ko":"안녕히 주무셨어...요\n좋은 아침\n예? 예...\n미친년... 지가 뭘 잘했다고\n안녕히 주무셨어요\n[물 붓는 소리]\n[지퍼 닫는다]\n[한숨 쉰다]","en":"Good morning.\nMorning.\nHi.\nWhy is she mad?","start":1472.7251,"end":1505.575531,"viStart":1472.7251,"viEnd":1505.575531,"koStart":1472.7251,"koEnd":1505.575531,"hasViAudio":true,"hasKoAudio":false,"viRange":{"start":1472.7251,"end":1505.575531},"koRange":null},{"id":67,"sourceUid":"merged-msl6kdy7-11","sourceNo":67,"originalSourceNo":390,"displayNo":67,"vi":"Sống tập thể thì tốt nhất nên giữ mồm giữ miệng.\nChị ta điên nặng lắm rồi!\nAi bảo em mặc đồ của người ta?\nCon gái thường mượn đồ của nhau mà.\nEm nói chưa xin phép người ta mà.","ko":"여럿이 살 때는 말조심하는 게 최고예요\n(정예은) 완전 싸이코라니까\n에이... 그러게 남의 옷을 왜 입냐?\n여자애들끼리는 원래 빌려 입고 빌려주고 그런단 말이야\n말 안 하고 입었다며?\n그래서? 오빤 누구 편이야?","en":"It's better to watch what you say when you live with others.\nShe's a total psycho!\nSo why did you wear someone else's clothes?\nGirls share clothes!\nYou said you wore it without asking her.\nSo? Whose side are you on?","start":1465,"end":1491.630608,"viStart":1505.575531,"viEnd":1537.816438,"koStart":1465,"koEnd":1491.630608,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1505.575531,"end":1537.816438},"koRange":{"start":1465,"end":1491.630608}},{"id":68,"sourceUid":"merged-msl7n50g-23","sourceNo":68,"originalSourceNo":250,"displayNo":68,"vi":"Rồi sao? Anh bênh ai?\nÝ anh là em đáng bị ăn đòn à?\nChị ta đánh em sao?\nNãy giờ anh không nghe em nói à?\nChị ta giật tóc em ở đây này!\nCòn cào ở đây nữa.\nThâm tím rồi đây này.\nĐây này.","ko":"나는 뭐 맞아도 싸다는 거야?\n뭐... 맞기도 했어?\n아이... 지금까지 내 얘기 뭐 들었어?\n내가 그래가지고, 엉, 여기...\n여기 머리 뽑히고\n여기 긁히고, 여기 멍들고...\n- 봐 봐... - 여기","en":"Do you mean I deserved to be hit?\nHave you been listening to me at all?\nShe pulled my hair right here too!\nShe scratched me here.\nI got bruised here.\nRight here.","start":1491.630608,"end":1504.757371,"viStart":1537.816438,"viEnd":1551.811272,"koStart":1491.630608,"koEnd":1504.757371,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1537.816438,"end":1551.811272},"koRange":{"start":1491.630608,"end":1504.757371}},{"id":69,"sourceUid":"merged-msl7olir-25","sourceNo":69,"originalSourceNo":252,"displayNo":69,"vi":"Còn chỗ nào nữa không?\n- Trong này có sao không? - Làm gì vậy?","ko":"아으... 또 어디 다쳤어? 뭐, 이 안에 안 다쳤어?\n- 뭐 하는 거야, 진짜 - 괜찮아","en":"Where else?\n-Are you hurt in here? -What are you doing?","start":1504.757371,"end":1511.276828,"viStart":1551.811272,"viEnd":1556.149972,"koStart":1504.757371,"koEnd":1511.276828,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1551.811272,"end":1556.149972},"koRange":{"start":1504.757371,"end":1511.276828}},{"id":70,"sourceUid":"ko-mshaf165-1192","sourceNo":70,"originalSourceNo":416,"displayNo":70,"vi":"[hắt hơi]","ko":"[재채기]","en":"[sneeze]","start":1631.36,"end":1632.46,"viStart":1631.36,"viEnd":1632.46,"koStart":1631.36,"koEnd":1632.46,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":71,"sourceUid":"merged-msl81bqw-31","sourceNo":71,"originalSourceNo":412,"displayNo":71,"vi":"Khùng điên thật chứ.\nNó tốt lành lắm hay sao mà giận dỗi?\nĐúng là cạn lời. Đây này.\nNhìn đi rồi thấy.\nNhìn đẹp chứ bộ.\nBực cái mình thật chứ.","ko":"(강이나) 돌아이야, 진짜\n그러고도 지가 잘했다고 바락바락 대드는데\n나 진짜 어이가 없어가지고...야\n나, 이것 봐 봐...우와!\n이빨이 아주 가지런하네\n아! 앗! 아앗... 진짜...\n아이, 머리...아이 짜증 나, 짜증 나","en":"Such a psycho.\nShe acted like she did nothing wrong.\nIt was ridiculous.\nLook at this.\nLooks very nice.\nAnnoying.","start":1511.276828,"end":1536.41484,"viStart":1556.149972,"viEnd":1575.647007,"koStart":1511.276828,"koEnd":1536.41484,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1556.149972,"end":1575.647007},"koRange":{"start":1511.276828,"end":1536.41484}},{"id":72,"sourceUid":"merged-msl805d3-29","sourceNo":72,"originalSourceNo":410,"displayNo":72,"vi":"[ngạc nhiên]\n[âm thanh gõ]\n[Rung điện thoại di động]","ko":"[놀란다]\n[톡 소리]\n[핸드폰 진동]","en":"[surprised]\n[tapping sound]\n[Cellphone vibration]","start":1616.13,"end":1617.63,"viStart":1616.13,"viEnd":1617.63,"koStart":1616.13,"koEnd":1617.63,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":73,"sourceUid":"merged-msl86swc-33","sourceNo":73,"originalSourceNo":419,"displayNo":73,"vi":"Ai đấy?\nCó quen đâu. Số lạ mà gọi hoài.\nNghe đi. Thôi khỏi. Xin lỗi nhé.","ko":"누군데? 아 몰라, 모르는 번혼데 자꾸 전화하고 문자질이야\n받아봐. 됐어. 에에이 앗! 아이, 미안하다\n아이... 정말...","en":"Who is it? I don't know. But they keep calling me. Take it. Sorry.","start":1536.41484,"end":1550.228165,"viStart":1575.647007,"viEnd":1595.539723,"koStart":1536.41484,"koEnd":1550.228165,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1575.647007,"end":1595.539723},"koRange":{"start":1536.41484,"end":1550.228165}},{"id":74,"sourceUid":"merged-msl8amfz-37","sourceNo":74,"originalSourceNo":269,"displayNo":74,"vi":"Ăn xong rồi làm gì?\nĐi xem phim không? Ơ hay.\nCái quần đó là nhỏ nào mua cho à?\nCon bé ở phường Sungsam hay Sungbuk?\nXin phép vào nhà vệ sinh chút nhé.\nKhông phải vậy đâu.","ko":"밥 먹고 뭐 할래? 영화 볼래? 에헤이!\n어떤 누님이 사 준거야? 청담동? 성북동?\n야, 나 잠깐 화장실 좀...\n아이, 그게 아니라...","en":"What do you want to do later?\nDo you want to watch a movie? Gosh.\nWhich girl bought you those pants?\nThe one from Sungsam? Or the one from Sungbuk?\nI need to use the bathroom.\nThat's not it.","start":1550.228165,"end":1566.922168,"viStart":1595.539723,"viEnd":1613.848657,"koStart":1550.228165,"koEnd":1566.922168,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1595.539723,"end":1613.848657},"koRange":{"start":1550.228165,"end":1566.922168}},{"id":75,"sourceUid":"ko-mshaf165-1203","sourceNo":75,"originalSourceNo":427,"displayNo":75,"vi":"[Đặt thìa xuống]","ko":"[숟가락을 탁 내려놓는다]","en":"[Puts down the spoon]","start":1650.26,"end":1651.3,"viStart":1650.26,"viEnd":1651.3,"koStart":1650.26,"koEnd":1651.3,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":76,"sourceUid":"merged-msl8mn59-39","sourceNo":76,"originalSourceNo":429,"displayNo":76,"vi":"Không tẩy nhanh thì sẽ có vết. Thôi bỏ đi.\nTiếc thế thì lần sau ở truồng đi ăn cho rồi. Này!\nLàm ơn bớt cộc cằn đi. Này, Kang Yi Na! Trời ạ.","ko":"얼른 안 빨면 얼룩지잖아 아이, 참... 야! 됐고\n너 다음부터 뭐 먹을 때는 빨가벗고 .어. 야, 야...\n아... 저 성질 좀...\n야! 강이나! 강이나!","en":"It will stain if I leave it. Forget it.\nJust be naked when you eat something next time. Hey! That temper. Hey, Yi-Na! Gosh.\nExcuse me.","start":1566.922168,"end":1582.076091,"viStart":1613.848657,"viEnd":1630.996594,"koStart":1566.922168,"koEnd":1582.076091,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1613.848657,"end":1630.996594},"koRange":{"start":1566.922168,"end":1582.076091}},{"id":77,"sourceUid":"merged-msla6zoz-45","sourceNo":77,"originalSourceNo":451,"displayNo":77,"vi":"Bạn ơi. Cây bút bi đó… Cái này á?\nNó lăn lóc trong quán cà phê nên tôi nhặt. Sao thế?\nĐiều quan trọng trong định vị bản thân\nlà không trùng lặp với hình ảnh của người hoặc vật khác.\nVì có những vị trí vốn đã thuộc về ai đó rồi.\nCho nên, nếu các em định chiếm vị trí đó\nthì sẽ không dễ dàng chút nào.\nVị trí của người khác?","ko":"아으! 저기...\n혹시, 그 볼펜...아... 이거?\n카페에 굴러다니는 거 주었는데\n왜? 왜 그래요\n(교수님) 포지셔닝에서 중요한 건\n다른 사람 혹은 물건의 이미지와 겹치지 않는 것입니다\n거긴 이미...선점된 어떤 자리가 있거든요\n그래서 그 자리를 뺏으려고 한다면\n그건 보통 힘든 일이 아닙니다\n(유은재) 다른 사람의 포지셔닝?","en":"That pen... This one? I found it at the cafe.\nThe important thing in positioning\nis not to overlap someone else's image.\nBecause it's already been occupied.\nSo if you try to take it away,\nit won't be easy at all.\nSomeone else's position?","start":1626.700423,"end":1663.223514,"viStart":1676.402232,"viEnd":1709.992799,"koStart":1626.700423,"koEnd":1663.223514,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1676.402232,"end":1709.992799},"koRange":{"start":1626.700423,"end":1663.223514}},{"id":78,"sourceUid":"merged-msla7gx7-46","sourceNo":78,"originalSourceNo":452,"displayNo":78,"vi":"[tiếng chuông]\n[xào xạc]\n[Nhạc nền sôi động bắt đầu]","ko":"[벨 소리]\n[부스럭]\n[경쾌한 배경 음악 시작]","en":"[bell sound]\n[rustle]\n[Upbeat background music starts]","start":1751.53,"end":1753.33,"viStart":1751.53,"viEnd":1753.33,"koStart":1751.53,"koEnd":1753.33,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":79,"sourceUid":"merged-mslajkwe-49","sourceNo":79,"originalSourceNo":294,"displayNo":79,"vi":"Lạnh lùng và đáng sợ. Nghiện khoe thân. - Sao?\nVà đáng sợ.\nThích ca cẩm.\nEm ỷ mình trẻ hơn chị hai tuổi hả?\nTrong số những chỗ còn trống,\ncác em cần tìm ra vị trí phù hợp với mình.","ko":"쌀쌀맞고 무섭다! 노출증에...\n뭐! 무섭다. 앵앵거리는데...\n너 두 살 어리다고 유세 떠는 거야\n무섭지\n(교수님) 여기저기 빈자리 중에서...\n나의 이미지와 가장 맞는 자리를 찾아야 하는데요","en":"Cold and scary. An exhibitionist. What? And scary.\nAnnoying.\nAre you trying to say you're that much younger?\nWithin these empty seats,\nyou need to find a spot that suits you.","start":1663.223514,"end":1682.947393,"viStart":1709.992799,"viEnd":1729.032031,"koStart":1663.223514,"koEnd":1682.947393,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1709.992799,"end":1729.032031},"koRange":{"start":1663.223514,"end":1682.947393}},{"id":80,"sourceUid":"merged-mslapcse-51","sourceNo":80,"originalSourceNo":470,"displayNo":80,"vi":"Hình ảnh, ấn tượng.\nTrong đó, yếu tố quan trọng nhất là ấn tượng ban đầu.\nThông qua ấn tượng ban đầu,\ndù là con người hay đồ vật,\ncó thể nói yếu tố này quyết định đến 80-90 phần trăm.\nĐiều này đúng cho đa số trường hợp.\nNếu ban đầu ta định vị sai,\nkhông hẳn là chấm hết.","ko":"이미지, 인상\n그중에서 가장 중요한 것이 첫인상입니다\n첫인상을 통해서\n물건이나 사람이나\n한 8, 90%는\n평가가 끝났다...\n라고 볼 수 있게 됩니다\n끝이 아닙니다","en":"Image, impression.\nBut the most important thing is the first impression.\nThrough the first impression,\nwhether it is someone or something,\nyou could say it's already been evaluated.\nFor the most part.\nIf the first positioning went wrong,\nthat's not the end.","start":1682.947393,"end":1702.489172,"viStart":1729.032031,"viEnd":1751.098623,"koStart":1682.947393,"koEnd":1702.489172,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1729.032031,"end":1751.098623},"koRange":{"start":1682.947393,"end":1702.489172}},{"id":81,"sourceUid":"merged-mslu44a8-52","sourceNo":81,"originalSourceNo":468,"displayNo":81,"vi":"[Nhạc nền sôi động kết thúc]\n[Nhạc nền bắt đầu]","ko":"[경쾌한 배경 음악 끝]\n[배경 음악 시작]","en":"[Upbeat background music ends]\n[Background music starts]","start":1785.16,"end":1786.36,"viStart":1785.16,"viEnd":1786.36,"koStart":1785.16,"koEnd":1786.36,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":82,"sourceUid":"merged-msluoc6g-3","sourceNo":82,"originalSourceNo":308,"displayNo":82,"vi":"Chúng ta còn có tái định vị.\nĐúng rồi. Mình không thể ngốc mãi được.\nMình phải tìm ra chỗ đứng riêng dù có khó khăn.\nPhải tự định vị chính mình.\nHình ảnh mà mình muốn.\nVị trí của mình.","ko":"리포지션닝이 있습니다\n(유은재) 그래... 바보로 살 수는 없어\n어렵더라도 비집고 들어가야지\n자리를 잡아야 돼\n내가 원하는 이미지!\n나의 포지셔닝","en":"There's always repositioning.\nRight. I can't be an idiot all the time.\nI have to find my spot even if it's hard.\nI have to position myself.\nAn image that I want.\nMy positioning.","start":1702.489172,"end":1718.730301,"viStart":1751.098623,"viEnd":1766.280557,"koStart":1702.489172,"koEnd":1718.730301,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1751.098623,"end":1766.280557},"koRange":{"start":1702.489172,"end":1718.730301}},{"id":83,"sourceUid":"merged-msluu5lm-7","sourceNo":83,"originalSourceNo":483,"displayNo":83,"vi":"Nếu chị ăn bánh mì và mứt của em thì nên mời em cà phê đi chứ.\nỪ. Được.\nMình sẽ nói điều mình muốn.\nĐừng chần chừ.\nĐồ trong máy giặt là của em hả?\nMau lấy ra cho người khác còn dùng.","ko":"내 빵이랑 내 잼 먹었으면 나도 커피 줘야죠\n어... 알았어\n(유은재) 할 말은 한다\n우물쭈물 대지 말고\n야! 세탁기에 있는 빨래 네 거야?\n빨래 널어, 다음 사람이 못 쓰잖아","en":"If you ate my bread and jam, shouldn't you give me your coffee?\nOkay.\nI'm going to say what I want to say.\nDon't hesitate.\nIs the laundry yours?\nTake it out so others can use the machine.","start":1718.730301,"end":1736.260965,"viStart":1766.280557,"viEnd":1783.959682,"koStart":1718.730301,"koEnd":1736.260965,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1766.280557,"end":1783.959682},"koRange":{"start":1718.730301,"end":1736.260965}},{"id":84,"sourceUid":"merged-mslv9ny3-10","sourceNo":84,"originalSourceNo":321,"displayNo":84,"vi":"Tiền bối Ye Eun nói nếu em giặt thì chị ấy sẽ phơi đồ.\nChị muốn la lối thì tìm đúng người mà la.\nSao cơ?\nXin lỗi.\nKhông dùng thì rút phích cắm đi.\nKhoan đã ạ.\nTa làm quen đã nhỉ.","ko":"내가 빨래하면 너는 건 정 선배가 하기로 했어요\n화내려면 제대로 알고 화내세요\n그랬어?\n미안\n안 쓰는 코드는 뽑아놓도록 해요\n아... 잠깐만요\n먼저 인사부터 하죠","en":"Ye-Eun said she'd do that if I ran the machine.\nI'm not the one you should be yelling at.\nWhat?\nSorry.\nUnplug it when you aren't using it.\nHold up.\nLet's say hello first.","start":1736.260965,"end":1756.110775,"viStart":1783.959682,"viEnd":1803.821451,"koStart":1736.260965,"koEnd":1756.110775,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1783.959682,"end":1803.821451},"koRange":{"start":1736.260965,"end":1756.110775}},{"id":85,"sourceUid":"merged-mslvr0al-12","sourceNo":85,"originalSourceNo":496,"displayNo":85,"vi":"Em là Yoo Eun Jae.\nKhông né tránh ánh mắt.\nMình muốn gì thì sẽ nói đó.\nTrả em cây bút bi.\nKhông lắp bắp. Nói rõ ràng.","ko":"나는 유은재라고 해요\n(유은재) 시선을 피하지 않는다\n할 말은 할 거야\n볼펜 줘요!\n(유은재) 버벅대지 말고 또박또박","en":"I'm Eun-Jae.\nDon't break eye contact.\nI'll say what I want to say.\nGive me back my pen.\nDon't stutter, be clear.","start":1756.110775,"end":1779.474382,"viStart":1803.821451,"viEnd":1828.390884,"koStart":1756.110775,"koEnd":1779.474382,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1803.821451,"end":1828.390884},"koRange":{"start":1756.110775,"end":1779.474382}},{"id":86,"sourceUid":"merged-mslw650x-17","sourceNo":86,"originalSourceNo":331,"displayNo":86,"vi":"Sao anh không trả bút cho em?\nLần trước anh mượn em mà.\nBút gắn cục bông.\nKêu leng keng thế này.\nNó đâu rồi?\nMất rồi chứ gì?\nMượn bút của ai thì phải trả lại chứ.","ko":"어? 내 볼펜 왜 안 줘요?\n지난번에 빌려 갔잖아요 방울 달린 거\n흔들면 딸랑거리는 거\n그거 어디 있어요?\n잃어버렸죠?\n남의 볼펜을 빌려 갔으면 돌려줘야지...","en":"You didn't give me back my pen.\nYou borrowed it the last time.\nThe one with a pompom.\nThe one that jingles. Where is it?\nYou lost it, didn't you?\nIf you borrowed someone's pen, you should return it.","start":1779.474382,"end":1789.907238,"viStart":1828.390884,"viEnd":1838.30952,"koStart":1779.474382,"koEnd":1789.907238,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1828.390884,"end":1838.30952},"koRange":{"start":1779.474382,"end":1789.907238}},{"id":87,"sourceUid":"merged-mslwcgv6-20","sourceNo":87,"originalSourceNo":340,"displayNo":87,"vi":"Như thế này đâu có được.\nNhìn thẳng vào mắt anh ta.\nAnh xin lỗi.\nMình làm được rồi.\nCó chuyện gì vậy?\nChuyện cái bút bi…\nBút bi gì cơ ạ?","ko":"그럼 안 되는 거잖아요\n(유은재) 눈을 똑바로 쳐다봐\n어... 미안\n(유은재) 해냈다!\n왜요? 무슨 일이에요?\n볼펜이...\n볼펜이 왜요?","en":"This is not okay.\nLook him in the eyes.\nI'm sorry.\nI did it.\nWhat happened?\nA pen was...\nWhat about a pen?","start":1789.907238,"end":1811.816877,"viStart":1838.30952,"viEnd":1858.250285,"koStart":1789.907238,"koEnd":1811.816877,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1838.30952,"end":1858.250285},"koRange":{"start":1789.907238,"end":1811.816877}},{"id":88,"sourceUid":"merged-mslwiwhg-27","sourceNo":88,"originalSourceNo":345,"displayNo":88,"vi":"Em ấy nói gì đó về bút bi…\nNày, con bé đó là ai thế?\nĐã ăn thì ăn cho đã cái nư.\nCó vậy thì mới không thèm nữa.\nChị vừa cười đúng không?","ko":"그러게 볼펜이 뭐라는데\n야, 쟤 누구냐? 쳇!\n(정예은) 어차피 한 번 먹을 때 실컷 먹는 게 나아\n그래야 당분간 떡볶이 생각이 안 나지\n방금 코로 웃었지?","en":"She said a pen was...\nHey, who's that?\nIt's better to eat a lot.\nSo I don't crave it for a while.\nYou laughed, didn't you?","start":1811.816877,"end":1828.325805,"viStart":1858.250285,"viEnd":1876.217,"koStart":1811.816877,"koEnd":1828.325805,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1858.250285,"end":1876.217},"koRange":{"start":1811.816877,"end":1828.325805}},{"id":89,"sourceUid":"merged-mslwqpjn-33","sourceNo":89,"originalSourceNo":516,"displayNo":89,"vi":"[Nhạc nền kết thúc]\n[Tiếng giày]\n[cười]","ko":"[배경 음악 끝]\n[신발 소리]\n[피식 웃는다]\n[비명을 지른다]\n[달그락 소리]","en":"[Background music ends]\n[Shoes sound]\n[laughter]","start":1912.63,"end":1913.8,"viStart":1912.63,"viEnd":1913.8,"koStart":1912.63,"koEnd":1913.8,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":90,"sourceUid":"merged-mslwxguf-36","sourceNo":90,"originalSourceNo":527,"displayNo":90,"vi":"Chị cười khẩy em chứ gì? Ừ.\nEm về muộn vậy?\nTại em chưa về nên chị ăn lố rồi.\nMọi người nên ăn cùng nhau cho vui.\nEm ăn không? Thôi ạ.\nNói điều muốn nói đi.\nĐừng chần chừ.","ko":"비웃었지? 어\n왜 이렇게 늦게 와?\n너 때문에 내가 300칼로리는 더 먹었겠다\n좀만 일찍 오지 같이 먹었으면 좋았을 텐데...\n이거라도 먹을래? 아니요...\n(유은재) 할 말은 한다\n우물쭈물 대지 말고","en":"You were laughing at me! Yes.\nYou're late.\nI ate so much because you weren't here.\nIt would have been nice to have eaten together.\nWould you like some? No.\nSay what you want to say.\nDon't hesitate.","start":1828.325805,"end":1858.790482,"viStart":1876.217,"viEnd":1904.647294,"koStart":1828.325805,"koEnd":1858.790482,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1876.217,"end":1904.647294},"koRange":{"start":1828.325805,"end":1858.790482}},{"id":91,"sourceUid":"merged-mslwyw1s-38","sourceNo":91,"originalSourceNo":359,"displayNo":91,"vi":"Ai ăn hết mứt rồi ạ?\nChị ăn vài lần.\nChị cũng ăn một hai lần.\nKhông né tránh ánh mắt.\nCác chị không nên tự tiện ăn như vậy.","ko":"이거 누가 다 먹었어요?\n내가 몇 번 먹었는데\n나도 한두 번\n(유은재) 시선을 피하지 않는다\n그렇지만 말도 안 하고 먹으면 안 되죠","en":"Who ate all this?\nI did, a few times.\nMe too, a couple times.\nDon't look away.\nYou can't just eat it without telling me.","start":1858.790482,"end":1869.792852,"viStart":1904.647294,"viEnd":1917.632491,"koStart":1858.790482,"koEnd":1869.792852,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1904.647294,"end":1917.632491},"koRange":{"start":1858.790482,"end":1869.792852}},{"id":92,"sourceUid":"merged-mslx69gi-44","sourceNo":92,"originalSourceNo":366,"displayNo":92,"vi":"Em mới ăn vài lần thôi.\nXin lỗi vì cắt ngang\nnhưng em đóng cửa lại đi.\nSao ạ? À, vâng.\nEm xin lỗi.\nEm làm hư tủ bây giờ.\nĂn nữa chắc bị đấm mất.","ko":"나도 몇 번밖에 안 먹은 건데...\n말하는 중에 미안한데\n냉장고 문부터 닫아요\n예?\n아, 죄송해요\n(강이나) 야... 문 부서지겠다\n한 번 더 먹으면 맞겠네","en":"I only ate it a few times.\nI'm sorry to interrupt,\nbut close the fridge first.\nWhat? Right.\nSorry.\nYou might break it.\nYou'd hit me if I eat it again.","start":1869.792852,"end":1882.628668,"viStart":1917.632491,"viEnd":1931.242324,"koStart":1869.792852,"koEnd":1882.628668,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1917.632491,"end":1931.242324},"koRange":{"start":1869.792852,"end":1882.628668}},{"id":93,"sourceUid":"merged-mslxoe31-48","sourceNo":93,"originalSourceNo":372,"displayNo":93,"vi":"Không, ý em là…\nEm bảo chị ăn mà. Sao ạ?\nEm chỉ mời chị lúc đó thôi.\nChị đâu thể ăn mãi…\nChị có mời em cà phê đâu.","ko":"아니, 그게...\n네가 먹으랬잖아. 예? 아...\n그건 그때 한 번 그런 건데...\n계속 먹으면...\n자기는 커피도 안 주고...","en":"I mean...\nYou told me to eat it. Yes?\nI meant just that morning.\nYou can't keep eating...\nYou don't share your coffee.","start":1882.628668,"end":1898.42868,"viStart":1931.242324,"viEnd":1945.821452,"koStart":1882.628668,"koEnd":1898.42868,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1931.242324,"end":1945.821452},"koRange":{"start":1882.628668,"end":1898.42868}},{"id":94,"sourceUid":"ko-mshaf166-1315","sourceNo":94,"originalSourceNo":539,"displayNo":94,"vi":"[Đóng mạnh cửa lại]","ko":"[문을 세게 닫는다]","en":"[Closes the door hard]","start":1966.26,"end":1967.23,"viStart":1966.26,"viEnd":1967.23,"koStart":1966.26,"koEnd":1967.23,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":95,"sourceUid":"merged-mslxw3wg-51","sourceNo":95,"originalSourceNo":378,"displayNo":95,"vi":"Nó đang nói gì vậy?\nĐây là mứt của em mà.\nChuyện này nghiêm trọng vậy cơ à?\nThôi đừng nói nữa.\nĐể chị mua đền lại, được chưa?\nChị ấy thật đáng sợ khi nổi giận.","ko":"뭐라는 거야?\n모르겠어\n내 쨈인데...\n(정예은) 근데 그게 그렇게 정색할 일이야?\n아 그만해, 됐어 내가 나중에 하나 사줄게 됐지?\n(정예은) 쟤 화나니까 되게 무섭네","en":"What is she saying?\nIt's my jam.\nAnd it's that serious?\nStop it.\nI'll buy you another one. Okay?\nShe's scary when she's angry.","start":1898.42868,"end":1914.347,"viStart":1945.821452,"viEnd":1961.901,"koStart":1898.42868,"koEnd":1914.347,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1945.821452,"end":1961.901},"koRange":{"start":1898.42868,"end":1914.347}},{"id":96,"sourceUid":"merged-mslxweyr-52","sourceNo":96,"originalSourceNo":556,"displayNo":96,"vi":"[Tiếng ném]\n[Nhạc nền sôi động bắt đầu]\n[Cá rung chuyển]","ko":"[던지는 소리]\n[경쾌한 배경 음악 시작]\n[물고기가 팔딱거린다]","en":"[Throwing sound]\n[Upbeat background music starts]\n[The fish flutters]","start":2018.06,"end":2019.63,"viStart":2018.06,"viEnd":2019.63,"koStart":2018.06,"koEnd":2019.63,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":97,"sourceUid":"merged-mslz62pw-58","sourceNo":97,"originalSourceNo":388,"displayNo":97,"vi":"Chào các em. Chúng em chào cô.\nCác em ăn sáng chưa? Rồi ạ!\nCác em ăn gì vậy?\nCanh ạ! Xúc xích ạ. Trứng rán ạ Ờ.","ko":"(선생님) 여러분 반가워요. (아이들) 반가워요\n(선생님) 아침밥 먹었어요? (아이들) 네\n(선생님) 뭐 먹었어요? (아이 1) 계란후라이요. (아이 2) 소시지요. (아이 3) 계란. (아이 4) 고기요\n어... (여학생) 어...","en":"Hi, guys. Hi.\nDid you eat breakfast? Yes!\nWhat did you have?\nSoup! Sausage. Eggs!\nYeah. Yes.","start":1929.511236,"end":1947.310692,"viStart":1976.753,"viEnd":1992.672784,"koStart":1929.511236,"koEnd":1947.310692,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1976.753,"end":1992.672784},"koRange":{"start":1929.511236,"end":1947.310692}},{"id":100,"sourceUid":"merged-mslz1v2k-54","sourceNo":100,"originalSourceNo":569,"displayNo":100,"vi":"[ngạc nhiên]\n[Thở dài]\n[Nhạc nền sôi động kết thúc]\n[Tiếng còi]","ko":"[놀래다]\n[한숨 쉰다]\n[경쾌한 배경 음악 끝]\n[경적 울린다]","en":"[surprised]\n[Sighs]\n[Upbeat background music ends]\n[Horn sounds]","start":2052.86,"end":2054.5,"viStart":2052.86,"viEnd":2054.5,"koStart":2052.86,"koEnd":2054.5,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":101,"sourceUid":"merged-mslzkl68-61","sourceNo":101,"originalSourceNo":395,"displayNo":101,"vi":"Ngày nào cũng thế. Ừ.\nChắc sắp đến sân vận động rồi.\nỪ, được rồi.\nỪ. Đến nhanh nhé.\nCảm ơn thầy ạ.\nHọc chăm chỉ nhé!\nVâng.","ko":"얘 진짜 맨날 안 오더라\n이것 월드컵 중문인 거 같은데\n알았어... 먼저 가 있을게\n어... 빨리 와\n에이씨... 진짜\n죽여버릴라\n(학생들) 수고하셨습니다\n(학생들) 네!","en":"Every day.\nI think I'm close to the stadium.\nOkay, fine.\nOkay. Hurry. Thank you. Have a good week. Okay.","start":1967.121861,"end":1998.131816,"viStart":2014.203306,"viEnd":2044.464167,"koStart":1967.121861,"koEnd":1998.131816,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2014.203306,"end":2044.464167},"koRange":{"start":1967.121861,"end":1998.131816}},{"id":102,"sourceUid":"merged-msmml70q-2","sourceNo":102,"originalSourceNo":585,"displayNo":102,"vi":"Khoan! Các bạn Khoa Tâm lý ở lại.\nCó thông báo cho các bạn đây.\nCác bạn biết về buổi sinh hoạt chung vào thứ Sáu chứ?\nTối thứ Sáu lúc 8:00.\nVào lúc 8:00 tối…","ko":"(과대표) 잠시만요, 잠시만요 심리학과 분들은 잠깐만 남을게요\n전달사항이 있습니다\n심리학과 이번 주 금요일에 단합대회 잡힌 거 다들 아시죠\n이번 주 금요일 8시입니다\n8시...","en":"Wait! Psychology majors,\nI have something to announce.\nYou all know about the retreat, right?\nIt's this Friday, 8:00 p.m.\nAt 8:00 p.m...","start":1998.131816,"end":2008.214512,"viStart":2044.464167,"viEnd":2056.289474,"koStart":1998.131816,"koEnd":2008.214512,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2044.464167,"end":2056.289474},"koRange":{"start":1998.131816,"end":2008.214512}},{"id":103,"sourceUid":"merged-msmmncqj-4","sourceNo":103,"originalSourceNo":403,"displayNo":103,"vi":"Này em.\nEm không học khoa Tâm lý à?\nĐây là hoạt động xuyên đêm, mong mọi người đến đủ.","ko":"저기요... 심리학과 아니신가요?\n저기...\n한 분도 빠짐없이 밤부터 새벽까지로","en":"Excuse me.\nAre you not a psychology major?\nIt's an all-night event...","start":2008.214512,"end":2015.601207,"viStart":2056.289474,"viEnd":2063.838862,"koStart":2008.214512,"koEnd":2015.601207,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2056.289474,"end":2063.838862},"koRange":{"start":2008.214512,"end":2015.601207}},{"id":104,"sourceUid":"merged-msmmpr3n-7","sourceNo":104,"originalSourceNo":596,"displayNo":104,"vi":"Ê. Ồ, tiền bối. Em đánh rơi gì à? Không ạ.\nNgẩng cao đầu lên mà đi.\nCó vậy mới tia được trai đẹp.\nEm đến thư viện à? - Vâng.","ko":"야! 어? 선배? 뭐 떨어트렸어? 아니요...\n고개 좀 들고 다녀\n그래야 잘생긴 남자를 발견하지\n도서관 가는 거야? 네...","en":"Hi. Hi. Did you drop something? No.\nChin up.\nThat's how you spot a good-looking guy.\n-Are you going to the library? -Yes.","start":2022,"end":2033.945124,"viStart":2063.838862,"viEnd":2080.141113,"koStart":2022,"koEnd":2033.945124,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2063.838862,"end":2080.141113},"koRange":{"start":2022,"end":2033.945124}},{"id":105,"sourceUid":"merged-msmnew64-10","sourceNo":105,"originalSourceNo":414,"displayNo":105,"vi":"Hồi năm nhất, chị còn chẳng bén mảng đến gần thư viện.\nEm học gì vậy? Ôn TOEIC? Luyện chứng chỉ?\nKhông, em chỉ đọc sách thôi.\nÔi trời, đừng làm thế.\nBây giờ không chơi thì đợi đến bao giờ?","ko":"난 1학년 때 도서관 근처도 안 갔는데\n뭐 공부해? 토익? 자격증?\n아뇨, 그냥 책 읽어요 이것저것\n어우... 그러지 마라\n1학년 때 안 놀면 언제 노냐?","en":"I never went anywhere near the library when I was a freshman.\nWhat do you study? English? Certifications?\nNo, I just read.\nGosh, don't do that.\nWhen are you going to have fun if not now?","start":2033.945124,"end":2047.164,"viStart":2080.141113,"viEnd":2094.338222,"koStart":2033.945124,"koEnd":2047.164,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2080.141113,"end":2094.338222},"koRange":{"start":2033.945124,"end":2047.164}},{"id":106,"sourceUid":"merged-msmnjs76-15","sourceNo":106,"originalSourceNo":420,"displayNo":106,"vi":"Sống vui vẻ chút đi.\nÔi trời, chị lại càm ràm như bà già rồi.\nKhông hiểu sao dạo này chị dạy đời người khác nhiều thế.\nCó lẽ chị già rồi.\nKhông đâu.\nXin lỗi em nhiều, nhưng em xí một chỗ cho chị nhé?","ko":"그냥 재밌게 살아\n헉!\n아... 또 할머니 같은 소릴 했어\n요즘엔 왜 이렇게 가르치려는 소릴 하는지 몰라\n나 늙나 봐\n저기 미안한데... 나 자리 좀 맡아줄래?","en":"Live a little.\nGosh, I was being a grandma again.\nI don't know why I'm lecturing people these days.\nI think I'm getting old.\nYou're not.\nCould you get me a spot?","start":2047.164,"end":2074.874506,"viStart":2094.338222,"viEnd":2122.547564,"koStart":2047.164,"koEnd":2074.874506,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2094.338222,"end":2122.547564},"koRange":{"start":2047.164,"end":2074.874506}},{"id":107,"sourceUid":"ko-mshaf166-1383","sourceNo":107,"originalSourceNo":607,"displayNo":107,"vi":"[Rung điện thoại di động]","ko":"[핸드폰 진동]","en":"[Cellphone vibration]","start":2149.26,"end":2150.43,"viStart":2149.26,"viEnd":2150.43,"koStart":2149.26,"koEnd":2150.43,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":108,"sourceUid":"merged-msmnswd2-16","sourceNo":108,"originalSourceNo":424,"displayNo":108,"vi":"Tự dưng bồ chị mò đến trường mình.\nAnh ấy lúc nào cũng vậy.\nChị quay lại ngay.\nXin lỗi. Gặp em sau.","ko":"남자친군데... 갑자기 학교 앞이라고\n맨날 제 맘대로야\n나 진짜 금방 올게 미안, 이따 봐","en":"My boyfriend just showed up.\nHe always does this.\nI'll be back real quick.\nSorry. See you.","start":2074.874506,"end":2083.28165,"viStart":2122.547564,"viEnd":2130.334956,"koStart":2074.874506,"koEnd":2083.28165,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2122.547564,"end":2130.334956},"koRange":{"start":2074.874506,"end":2083.28165}},{"id":109,"sourceUid":"merged-msmnve1a-18","sourceNo":109,"originalSourceNo":613,"displayNo":109,"vi":"[Mưa tạnh dần]\n[chạm ngón tay]","ko":"[비 솓아진다]\n[손가락 톡톡]\n[한숨 쉰다]\n[벨소리]","en":"[The rain thins out]\n[finger tap]","start":2137.833,"end":2139.873,"viStart":2137.833,"viEnd":2139.873,"koStart":2137.833,"koEnd":2139.873,"hasViAudio":true,"hasKoAudio":false,"viRange":{"start":2137.833,"end":2139.873},"koRange":null},{"id":110,"sourceUid":"merged-msmo4qn8-23","sourceNo":110,"originalSourceNo":433,"displayNo":110,"vi":"Sao chị không đến?\nChị mau đến đi.\nChị ở đâu vậy?\nBao giờ chị đến?\nNày!\nĐÃ GỬI: CHỊ Ở ĐÂU VẬY? BAO GIỜ CHỊ ĐẾN?","ko":"(유은재) 왜 안 와요?\n빨리 와요\n어디에요?\n언제쯤 올 건가요?\n유은재님에게서 카톡이 왔습니다\n아! 야...\n어디에요? 언제쯤 올 건가요?\n어디에요? 언제쯤 올 건가요?","en":"Why aren't you coming?\nHurry.\nWhere are you?\nWhen are you coming?\nHey!\nSENT: WHERE ARE YOU? WHEN ARE YOU COMING?\nAre you okay?\nExcuse me.","start":2240.77,"end":2243.8,"viStart":2240.77,"viEnd":2243.8,"koStart":2240.77,"koEnd":2243.8,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":112,"sourceUid":"merged-msmofjk9-32","sourceNo":112,"originalSourceNo":437,"displayNo":112,"vi":"Bạn không sao chứ?\nChị từng sống ở phường Yeonnam phải không ạ?\nChị ơi.\nỞ Belle Epoque.\nCăn nhà chung ấy.\nChị từng ở đó, đúng không?\nEm mới dọn đến phòng cũ của chị.","ko":"괜찮아요?\n예\n저기...\n저기 혹시, 연남동 사셨었죠?\n벨 에포크라고...\n셰어하우스...\n거기 사셨었죠?\n제가 그 방에 새로 들어갔는데요","en":"You lived in Yeonim, didn't you?\nBelle Epoque.\nA share-house.\nYou lived there, didn't you?\nI live in your old room now.\nAnd?\nWell...","start":2224.1434,"end":2255.733617,"viStart":2302.926,"viEnd":2335.468908,"koStart":2224.1434,"koEnd":2255.733617,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2302.926,"end":2335.468908},"koRange":{"start":2224.1434,"end":2255.733617}},{"id":113,"sourceUid":"merged-msmoeb5g-31","sourceNo":113,"originalSourceNo":630,"displayNo":113,"vi":"[nôn]\n[Nhạc chủ đề lạc quan kết thúc]","ko":"[토한다]\n[경쾌한 테마 음악 끝]","en":"[vomits]\n[Upbeat theme music ends]","start":2327.93,"end":2329.7,"viStart":2327.93,"viEnd":2329.7,"koStart":2327.93,"koEnd":2329.7,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":114,"sourceUid":"merged-msmooi00-37","sourceNo":114,"originalSourceNo":444,"displayNo":114,"vi":"Thì sao?\nChuyện là…\nTại sao chị dọn ra khỏi nhà đó?\nBạn hỏi làm gì?\nEm chỉ tò mò thôi.\nNếu ở căn nhà đó có vấn đề gì…\nKiểu như ai đó bắt nạt chị…\nKhông có chuyện đó.","ko":"그런데요?\n저기...\n그 집에서 왜 나왔어요?\n그건 왜 묻죠?\n그냥 궁금해서...\n혹시 그 집에 무슨 문제가 있는 거면...\n사람들이 괴롭혔다거나...\n그런 거 없어요","en":"Why did you move out?\nWhy do you ask?\nI'm just curious.\nIf there's anything wrong with that place...\nIf anyone bullied you--\nIt was nothing like that.","start":2255.733617,"end":2276.721789,"viStart":2335.468908,"viEnd":2357.681567,"koStart":2255.733617,"koEnd":2276.721789,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2335.468908,"end":2357.681567},"koRange":{"start":2255.733617,"end":2276.721789}},{"id":115,"sourceUid":"merged-msmosmqp-44","sourceNo":115,"originalSourceNo":656,"displayNo":115,"vi":"Túi xách đó…\nCô ơi.\nCủa em à?\nKhông ạ.\nNó không phải của em,","ko":"저기...\n저 가방...\n이거 학생 거예요?\n아뇨\n제건 아닌데...","en":"Excuse me.\nThat bag.\nIs this yours?\nNo.\nIt's not mine.","start":2293.226389,"end":2305.937012,"viStart":2372.677557,"viEnd":2387.430936,"koStart":2293.226389,"koEnd":2305.937012,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2372.677557,"end":2387.430936},"koRange":{"start":2293.226389,"end":2305.937012}},{"id":116,"sourceUid":"merged-msmov7so-49","sourceNo":116,"originalSourceNo":456,"displayNo":116,"vi":"mà là của bạn em.\nEm không biết là không được đặt gạch xí chỗ à?\nEm xin lỗi ạ.\nBạn em vẫn chưa đến nhỉ?\nChả hiểu sao có nhiều sinh viên ích kỷ vậy.\nHọ không chấp nhận để bản thân chịu thiệt.","ko":"아는 사람 건데...\n자리 맡아놓으면 안 된다는 거 몰라요?\n죄송합니다\n그 친구 아직 안 왔죠?\n학생들이 왜 이렇게 이기적인지 몰라요\n자기 손해 보는 거는 조금도 못 참아 난리 치면서","en":"It's a friend of mine's.\nDon't you know that you can't hold someone's spot?\nI'm sorry.\nYour friend isn't here yet, right?\nSome students are so selfish.\nThey can't stand a little inconvenience.","start":2305.937012,"end":2326.197454,"viStart":2387.430936,"viEnd":2407.103861,"koStart":2305.937012,"koEnd":2326.197454,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2387.430936,"end":2407.103861},"koRange":{"start":2305.937012,"end":2326.197454}},{"id":117,"sourceUid":"merged-msmp8tq5-53","sourceNo":117,"originalSourceNo":461,"displayNo":117,"vi":"Cũng chẳng đếm xỉa đến những người khác.\nChủ nhân chiếc túi này làm sai.\nNhưng em cũng có vấn đề.\nEm xin lỗi.\nVì em biết làm vậy là sai, nhưng em lại không từ chối.","ko":"뭐 다른 사람들한테 피해 주는 거는\n아무렇지도 않나 봐요?\n가방 주인도 문젠데...\n학생도 문제에요\n죄송합니다\n잘못된 일이라는 걸 알면서도\n거절을 안 했잖아요","en":"They don't care about others at all.\nYour friend is wrong to do this.\nAnd so are you.\nI'm sorry.\nYou didn't say no, knowing it's wrong.","start":2326.197454,"end":2343.468684,"viStart":2407.103861,"viEnd":2423.01411,"koStart":2326.197454,"koEnd":2343.468684,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2407.103861,"end":2423.01411},"koRange":{"start":2326.197454,"end":2343.468684}},{"id":118,"sourceUid":"merged-msmp91rd-54","sourceNo":118,"originalSourceNo":670,"displayNo":118,"vi":"[Thở dài]\n[Nhạc chủ đề sôi động bắt đầu]\n[Rung điện thoại di động]","ko":"[한숨 쉰다]\n[경쾌한 테마 음악 시작]\n[핸드폰 진동]","en":"[Sighs]\n[Upbeat theme music starts]\n[Cellphone vibration]","start":2476.3,"end":2477.56,"viStart":2476.3,"viEnd":2477.56,"koStart":2476.3,"koEnd":2477.56,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":120,"sourceUid":"merged-msmphq2k-62","sourceNo":120,"originalSourceNo":682,"displayNo":120,"vi":"Chị làm gì vậy hả?\nLàm sai thì phải biết xin lỗi chứ.\nThật ngứa mắt.\nMắc cười nhỉ?\nSao con bé vẫn chưa về?\nSao vậy? Em lo cho em ấy à?","ko":"아 에이 씨\n뭐 하는 거야\n잘못했으면 잘못했다고 말을 하든가\n재수 없게...\n아 진짜 웃기지... 진짜 웃기지\n우와...\n흠...\n아이 왜 이렇게 안 와?\n왜? 슬슬 걱정돼?","en":"What are you doing?\nExcuse you.\nSo annoying.\nIsn't it so funny?\nWhy isn't she coming?\nWhy, are you worried?","start":2362.661475,"end":2415.712396,"viStart":2442.623372,"viEnd":2496.145367,"koStart":2362.661475,"koEnd":2415.712396,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2442.623372,"end":2496.145367},"koRange":{"start":2362.661475,"end":2415.712396}},{"id":121,"sourceUid":"merged-msmpfy77-56","sourceNo":121,"originalSourceNo":677,"displayNo":121,"vi":"[Cửa xe buýt mở ra]\n[Nhạc chủ đề lạc quan kết thúc]\n[Phụ nữ cười]","ko":"[버스 문 열린다]\n[경쾌한 테마 음악 끝]\n[여자들 웃는다]","en":"[Bus door opens]\n[Upbeat theme music ends]\n[Women laugh]","start":2524.23,"end":2525.5,"viStart":2524.23,"viEnd":2525.5,"koStart":2524.23,"koEnd":2525.5,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":122,"sourceUid":"merged-msmpvi0j-66","sourceNo":122,"originalSourceNo":475,"displayNo":122,"vi":"Em không cố ý làm vậy.\nEm cố tình mà. Em coi thường Eun Soon thấy rõ.\nDo dòng đời xô đẩy thôi.\nEm đâu làm gì được.\nNhưng tại sao hai đứa gọi em ấy là Eun Soon?\nVì em ấy nhà quê sao?\nVì nó quá thật thà.\nGiống nhau mà.","ko":"내가 일부러 그랬나?\n일부러 맞잖아 은순이 만만하게 봤잖아\n상황이 그랬다니까, 어쩔 수 없었어\n그런데...\n왜 은순이야?\n촌스러워서? - 으으응\n순박해서\n그거나 그거나","en":"It's not like I did it on purpose.\nYou did do it on purpose. You look down on Eun-Sun.\nIt just happened.\nI couldn't help it.\nBut why do you call her Eun-Sun?\nBecause she's tacky?\nBecause she's naive.\nSame thing.","start":2415.712396,"end":2432.507882,"viStart":2496.145367,"viEnd":2512.437068,"koStart":2415.712396,"koEnd":2432.507882,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2496.145367,"end":2512.437068},"koRange":{"start":2415.712396,"end":2432.507882}},{"id":123,"sourceUid":"merged-msmsu45h-71","sourceNo":123,"originalSourceNo":482,"displayNo":123,"vi":"Con bé đó không trang điểm nhỉ?\nGái nhà quê đều vậy à?\nTrang điểm á?\nNó còn chẳng thèm tỉa lông mày.\nEm thích con trai có lông mày rậm.\nNhưng con gái thì không.\nChắc chỗ khác của nó cũng đầy lông.","ko":"걔 화장 안 하지?\n시골 애들은 다 걔 같은가?\n화장?\n난 남자애들이 눈썹 진한 건 괜찮은데\n여자애들이 그러면 좀 싫더라\n왠지 다른데도 털이 막 무성 할 거 같고...","en":"She doesn't wear make-up, does she?\nAre all country girls like that?\nMake-up?\nShe doesn't even trim her eyebrows.\nI like thick eyebrows on men.\nI don't like them on girls.\nI feel like she'd be hairy everywhere.","start":2432.507882,"end":2449.518966,"viStart":2512.437068,"viEnd":2528.557522,"koStart":2432.507882,"koEnd":2449.518966,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2512.437068,"end":2528.557522},"koRange":{"start":2432.507882,"end":2449.518966}},{"id":124,"sourceUid":"merged-msmt2z1z-79","sourceNo":124,"originalSourceNo":711,"displayNo":124,"vi":"Em về từ khi nào vậy? Chị xin lỗi.\nMáy chị hết pin nên không gọi em được.\nChị mới sạc và đang định gọi em đây. Này!","ko":"언제 왔어? 아 미안\n배터리가 나가서 연락할 방법이 있어야지\n이제 막 충전하고 연락하려던 참인데...","en":"When did you get home? I'm sorry.\nMy battery was out and I couldn't reach you.\nI was about to call you now. Hey!","start":2464.124708,"end":2478.958628,"viStart":2544.005,"viEnd":2565.02,"koStart":2464.124708,"koEnd":2478.958628,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2544.005,"end":2565.02},"koRange":{"start":2464.124708,"end":2478.958628}},{"id":125,"sourceUid":"merged-msmsysjw-73","sourceNo":125,"originalSourceNo":706,"displayNo":125,"vi":"[Chuông reo] [Tín hiệu đi]\n[Tiếng ném] [Tiếng ném túi]","ko":"[벨 소리 울린다][신호가 간다]\n[던지는 소리][가방 던진다]","en":"[Bell rings] [Signal goes]\n[Throwing sound][Throwing bag]","start":2603.9,"end":2605,"viStart":2603.9,"viEnd":2605,"koStart":2603.9,"koEnd":2605,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":126,"sourceUid":"merged-msmtfr78-82","sourceNo":126,"originalSourceNo":712,"displayNo":126,"vi":"Tôi mắc cười lắm à?\nNày.\nEm sao vậy? Tự hỏi mình đi. Tại sao các chị làm vậy?\nTôi có đần độn hay khờ khạo đi nữa\nthì các chị cũng đâu cần phải thế.","ko":"야! 내가 우스워? 야아... 왜 그래?\n너야말로 왜 그래?\n너희들이야말로 왜 그래?\n내가 아무것도 모르고...\n바보 같고 그래도...\n이럴 필요는 없잖아!","en":"You think I'm a joke?\nHey.\nWhy are you doing this? Why are you?\nWhy are you all doing this?\nEven if I am stupid and naive, you don't have to be like this.\nYou don't have to be so mean!","start":2493.845736,"end":2512.503683,"viStart":2572.716975,"viEnd":2592.734953,"koStart":2493.845736,"koEnd":2512.503683,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2572.716975,"end":2592.734953},"koRange":{"start":2493.845736,"end":2512.503683}},{"id":127,"sourceUid":"ko-mshaf167-1490","sourceNo":127,"originalSourceNo":714,"displayNo":127,"vi":"[Nhạc chủ đề sôi động bắt đầu]","ko":"[경쾌한 테마 음악 시작]","en":"[Upbeat theme music starts]","start":2630.53,"end":2631.7,"viStart":2630.53,"viEnd":2631.7,"koStart":2630.53,"koEnd":2631.7,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":128,"sourceUid":"merged-msmu9usd-85","sourceNo":128,"originalSourceNo":500,"displayNo":128,"vi":"Các chị đâu cần xấu tính đến vậy!\nĐâu cần cười nhạo tôi!\nTử tế chút cũng được mà.\nĐâu phải ai cũng sỏi đời như các chị.\nTôi…\nthấy khổ sở chết đi được!","ko":"그렇게 못되게 굴 것까진 없잖아!\n비웃을 필요는 없잖아!\n조금은 친절해도 되잖아\n다들 너희들처럼 익숙한 건 아니니까\n나는...\n죽을 것처럼 힘든데!","en":"You don't have to laugh at me!\nYou can be a little nice.\nNot everyone is used to this.\nI'm...\ndying here!","start":2512.503683,"end":2533.096167,"viStart":2592.734953,"viEnd":2611.656329,"koStart":2512.503683,"koEnd":2533.096167,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2592.734953,"end":2611.656329},"koRange":{"start":2512.503683,"end":2533.096167}},{"id":129,"sourceUid":"merged-msmuer59-90","sourceNo":129,"originalSourceNo":505,"displayNo":129,"vi":"Các chị không thể…\ntử tế một chút sao?\nCác chị quá đáng thật mà.\nLại sao nữa vậy?\nKhông biết sao con bé lại như vậy.","ko":"조금만...\n잘해주면 되는데...\n다들 정말...\n너무해\n왜 그래? 또 뭔 일 있어?\n몰라, 왜 저래?","en":"Why can't you...\nbe just a little nice?\nYou're so mean.\nWhat's wrong?\nI don't know what's up with her.","start":2545.644496,"end":2594.189179,"viStart":2625.445898,"viEnd":2673.770462,"koStart":2545.644496,"koEnd":2594.189179,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2625.445898,"end":2673.770462},"koRange":{"start":2545.644496,"end":2594.189179}},{"id":130,"sourceUid":"merged-msneh3pb-10","sourceNo":130,"originalSourceNo":736,"displayNo":130,"vi":"[Nước mắt chảy dài] [Nhạc chậm bắt đầu]\n[Khóc] [Thở hổn hển]","ko":"[눈물 흘러내린다][느린 음악 시작]\n[흐느껴 운다][숨을 몰아쉰다]\n[총 소리]\n[숨을 들이쉰다]\n[숨을 토해낸다]\n[한숨 쉰다]\n[경쾌한 테마 음악 끝]","en":"[Tears flowing] [Slow music starts]\n[Sobbing][Out of breath]","start":2731.66,"end":2733.1,"viStart":2731.66,"viEnd":2733.1,"koStart":2731.66,"koEnd":2733.1,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":131,"sourceUid":"merged-msn6kmtl-1","sourceNo":131,"originalSourceNo":513,"displayNo":131,"vi":"Này, túi xách kìa. Ngu ngốc.\nMình là đồ ngốc. Đến nổi giận cũng chẳng biết.\nMẹ ơi.\nCon muốn về nhà. Nhưng không có chỗ để về.\nMình muốn về nhà.","ko":"야... 너 가방! 어, 아악!\n바보. 화도 못 내는 바보\n엄마... 집에 가고 싶어\n돌아갈 집도 없는데...","en":"Your bag. Stupid.\nI'm so stupid. I can't even be angry. Mom.\nI want to go home. You don't answer the phone.\nI don't even have a home.","start":2594.189179,"end":2668.081517,"viStart":2673.770462,"viEnd":2727.366669,"koStart":2594.189179,"koEnd":2668.081517,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2673.770462,"end":2727.366669},"koRange":{"start":2594.189179,"end":2668.081517}},{"id":132,"sourceUid":"merged-msnf70lz-18","sourceNo":132,"originalSourceNo":757,"displayNo":132,"vi":"Hình như em ấy sốt rồi. Có cần đi viện không?\nNhà mình còn thuốc hạ sốt không?\nKhông sao đâu.\nSao lại thế?\nSao em phải dọn nhà vệ sinh vậy? Tính ra em thiệt nhất rồi.\nÔi.Em tỉnh rồi hả?\nThấy ổn hơn chưa?\nKhông sao chứ?\nBớt sốt chưa?","ko":"열나는 것 같은데...\n야, 얘 아픈가 봐... 병원에 안 가도 돼?\n(윤진명) 해열제 있어?\n(남자) 괜찮아, 괜찮아. 어... 어. 도대체 왜? \n내가 왜 화장실이야? \n손해 본 걸로 따지면 내가 최고구먼. \n아휴 진짜. 지난번에도 화장실. 어? 일어났어?\n너 괜찮아? 네...","en":"She seems sick. Does she need to go to the hospital?\nDo we have anything to lower her fever? It's okay. Why?\nI sacrificed the most around here. Gosh. You're up.\nAre you feeling okay?\nAre you okay?\nHas the fever gone down? Yes.","start":2668.081517,"end":2737.993261,"viStart":2727.366669,"viEnd":2829.343087,"koStart":2668.081517,"koEnd":2737.993261,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2727.366669,"end":2829.343087},"koRange":{"start":2668.081517,"end":2737.993261}},{"id":133,"sourceUid":"merged-msoj1fdw-23","sourceNo":133,"originalSourceNo":532,"displayNo":133,"vi":"Rồi ạ. À… Em muốn dùng nhà vệ sinh.\nỪ, đi đi. Chắc em ấy nhịn lâu lắm rồi.\nChắc nhịn để đi một lần cho đã.\nEm nên làm gì đây ạ?\nKhông sao. Bọn chị làm xong rồi.\nEm xin lỗi.","ko":"괜찮아? 열은 내렸어?\n네...저...화장실 좀\n어...들어가\n되게 오래 참았나 봐\n참다 참다... 터트리는 게 취민가 보지\n저 뭐하면 되죠? 아니야, 할 거 없어, 다했어\n죄송해요","en":"She must have held it for a while.\nWell... I need to use the bathroom. Sure, go ahead.\nShe holds it until it explodes, I guess. What can I do?\nIt's okay, we're done. I'm sorry.","start":2737.993261,"end":2789.695132,"viStart":2737.993261,"viEnd":2789.695132,"koStart":2737.993261,"koEnd":2789.695132,"hasViAudio":false,"hasKoAudio":true,"viRange":null,"koRange":{"start":2737.993261,"end":2789.695132}},{"id":134,"sourceUid":"merged-msneywwd-14","sourceNo":134,"originalSourceNo":749,"displayNo":134,"vi":"[Cằn nhằn] [Thở dài]\n[Tiếng mở cửa] [Cốc rơi]\n[Cá vỗ cánh] [Thở dài]\n[tiếng chó sủa]","ko":"[구시렁거린다][한숨 쉰다]\n[문 여는 소리][컵 떨어진다]\n[물고기가 팔딱거린다][숨 길게 쉰다]\n[개가 짖는다]","en":"[Grumpers] [Sighs]\n[Sound of door opening] [Cup falls]\n[The fish flutters] [Takes a long breath]\n[dog barks]","start":2792.46,"end":2793.93,"viStart":2792.46,"viEnd":2793.93,"koStart":2792.46,"koEnd":2793.93,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":135,"sourceUid":"merged-msodjpnr-7","sourceNo":135,"originalSourceNo":776,"displayNo":135,"vi":"[Tiếng đóng cửa]\n[Có tiếng nước rơi]\n[Cười]\n[Cười]\n[Tiếng xả bồn cầu]","ko":"[문 닫는 소리]\n[물 내리는 소리가 난다]\n[픽 웃는다]\n[웃는다]\n[화장실 물 내리는 소리]","en":"[Sound of door closing]\n[There is a sound of water falling]\n[Laughs]\n[Laughs]\n[Sound of toilet flushing]","start":2898.06,"end":2899.06,"viStart":2898.06,"viEnd":2899.06,"koStart":2898.06,"koEnd":2899.06,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":136,"sourceUid":"merged-msoe0q4x-13","sourceNo":136,"originalSourceNo":791,"displayNo":136,"vi":"Em bị ốm mà. Không cần xin lỗi.\nÔi trời. Nếu áy náy cỡ đó thì em có thể đi vứt rác.","ko":"아픈 것까지 죄송할 거 없어요\n아이고, 그렇게 미안하면...쓰레기라도 버리든가...","en":"You don't have to be sorry for being sick.\nGoodness. If you're that sorry, take the trash out.","start":2789.695132,"end":2798.071057,"viStart":2829.343087,"viEnd":2889.493641,"koStart":2789.695132,"koEnd":2798.071057,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2829.343087,"end":2889.493641},"koRange":{"start":2789.695132,"end":2798.071057}},{"id":137,"sourceUid":"merged-msoeqndo-21","sourceNo":137,"originalSourceNo":537,"displayNo":137,"vi":"Tuy hơi phiền nhưng hãy rút phích cắm ra nhé.\nKhi nào ra ngoài, em nhớ rút điện nhé,\nmặc dù hơi phiền.\nEm lại ăn mì này.\nKhông được. Em đừng ăn.\nEm sốt hừng hực cả đêm rồi. Không thể ăn mì gói được.\nHãy ăn cháo rồi uống thuốc đi.\nEm sẽ trả tiền cháo và thuốc…\nKhỏi đi.","ko":"(윤진명) 밖에 나갈 때는 전원을 뽑아줄래?\n귀찮더라도 코드는 뽑고 나갔으면...\n음...이리 와, 라면 먹어\n안 돼, 넌 먹지 마\n(정예은) 됐어\n죽 값이랑 약값은...\n[후루룩 먹는다]\n[경쾌한 배경 음악 끝]","en":"When you go out, please turn it off.\nI know it's a hassle, but please unplug it.\nI know it's a hassle.\nHave some ramen.\nNo, you can't eat.\nYou were sick all night. You can't have ramen.Have some porridge and take your medicine.\nI'll pay for the porridge and the--\nIt's fine.","start":2832.220444,"end":2870.906982,"viStart":2922.54,"viEnd":2953.033381,"koStart":2832.220444,"koEnd":2870.906982,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2922.54,"end":2953.033381},"koRange":{"start":2832.220444,"end":2870.906982}},{"id":138,"sourceUid":"merged-msok6ro1-25","sourceNo":138,"originalSourceNo":803,"displayNo":138,"vi":"Chị Jin Myung mang cháo hết hạn\nở cửa hàng tiện lợi về đấy.\nMới hết hạn một ngày. Vẫn ăn được.","ko":"죽은 윤 선배가 편의점에서 유통기한 지난 거 들고 온 거고\n하루밖에 안 지난 거니까 괜찮아","en":"Jin-Myung brought porridge past the sell by date\nfrom the convenience store.\nOnly by one day. It's fine.","start":2870.906982,"end":2882.88408,"viStart":2953.033381,"viEnd":2960.858633,"koStart":2870.906982,"koEnd":2882.88408,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2953.033381,"end":2960.858633},"koRange":{"start":2870.906982,"end":2882.88408}},{"id":139,"sourceUid":"merged-msokchog-27","sourceNo":139,"originalSourceNo":551,"displayNo":139,"vi":"Bọn chị có sẵn thuốc ở nhà.\nEm xin lỗi chuyện hôm qua.\nĐúng đấy. Túi của chị có tội tình gì?\nGhét chị thì ghét, đừng giận lây sang nó chứ.","ko":"(정예은) 밤새 끙끙 앓아 댄 주제에 라면이 말이 되냐?\n약은 원래 있던 거니까\n어젠 죄송해요\n죽 먹고 약 먹어\n그래, 가방이 무슨 죄냐?\n번거롭겠지만\n죄는 미워해도 가방은 미워하지 말아야지","en":"We already had the medicine.\nI'm sorry about yesterday.\nRight. What did my bag ever do?\nYou can hate me, but you can't hate the bag.","start":2882.88408,"end":2891.959999,"viStart":2960.858633,"viEnd":2971.356828,"koStart":2882.88408,"koEnd":2891.959999,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2960.858633,"end":2971.356828},"koRange":{"start":2882.88408,"end":2891.959999}},{"id":140,"sourceUid":"merged-msoknhf7-35","sourceNo":140,"originalSourceNo":815,"displayNo":140,"vi":"Đúng đấy.\nLần sau, em nên ném người. Đây.","ko":"(강이나) 그래...\n다음엔 사람을 집어 던져\n(정예은) 자...","en":"Right.\nNext time, just throw someone. Here.","start":2891.959999,"end":2898.810431,"viStart":2971.356828,"viEnd":2976.198189,"koStart":2891.959999,"koEnd":2898.810431,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2971.356828,"end":2976.198189},"koRange":{"start":2891.959999,"end":2898.810431}},{"id":141,"sourceUid":"ko-mshaf168-1614","sourceNo":141,"originalSourceNo":838,"displayNo":141,"vi":"[Nhạc chủ đề sôi động bắt đầu]","ko":"[경쾌한 테마 음악 시작]","en":"[Upbeat theme music starts]","start":3127.23,"end":3128.1,"viStart":3127.23,"viEnd":3128.1,"koStart":3127.23,"koEnd":3128.1,"hasViAudio":false,"hasKoAudio":false,"viRange":null,"koRange":null},{"id":142,"sourceUid":"merged-msokf1hk-29","sourceNo":142,"originalS
